<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Long Silence — Pantheon Gate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#100e16;
  --ink-2:#17131f;
  --parchment:#e9decb;
  --parchment-dim:#b9ac93;
  --gold:#c8a24a;
  --gold-bright:#e6c777;
  --ember:#a1462a;
  --line:#3a3346;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--parchment);font-family:'EB Garamond',serif;}
body{
  background-image:radial-gradient(ellipse at 20% -10%, rgba(200,162,74,0.10), transparent 55%),
                   radial-gradient(ellipse at 90% 5%, rgba(138,107,184,0.08), transparent 55%);
  background-attachment:fixed;
}
h1,h2,h3,.display{font-family:'Cinzel',serif;letter-spacing:0.04em;}
.wrap{max-width:760px;margin:0 auto;padding:0 24px 100px;}
.eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);opacity:0.85;}
header.mast{text-align:center;padding:64px 0 40px;}
header.mast h1{font-size:clamp(32px,6vw,50px);margin:14px 0 6px;color:var(--parchment);text-shadow:0 0 30px rgba(200,162,74,0.15);}
header.mast p.sub{font-style:italic;color:var(--parchment-dim);max-width:480px;margin:0 auto;font-size:16px;}
.rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto;}
.backlink{display:block;text-align:center;color:var(--parchment-dim);text-decoration:none;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;font-family:'Cinzel',serif;margin-top:10px;}
.backlink:hover{color:var(--gold-bright);}
body.map-screen{overflow:hidden;}
body.map-screen .mast, body.map-screen footer.notice{display:none;}
body.map-screen .wrap{max-width:none;margin:0;padding:0;}
.map-hub-screen{
  position:fixed;inset:0;z-index:5;
  display:flex;align-items:center;justify-content:center;
  background:var(--ink);
}
body.login-screen{overflow:hidden;}
body.login-screen .mast, body.login-screen footer.notice{display:none;}
body.login-screen .wrap{max-width:none;margin:0;padding:0;}
.login-screen-wrap{
  position:fixed;inset:0;z-index:5;
  display:flex;align-items:center;justify-content:center;
  background:url('https://static.wixstatic.com/media/d6c75e_6e127e24b9ce43e2a468ef72aa9dd73a~mv2.jpg') center/cover no-repeat;
}
.login-card{
  background:rgba(10,8,16,0.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border:1px solid var(--line);border-radius:6px;
  padding:38px 32px;max-width:360px;width:calc(100% - 40px);text-align:center;
}
.login-card h1{font-size:clamp(24px,5vw,32px);margin:0 0 10px;color:var(--parchment);text-shadow:0 0 24px rgba(200,162,74,0.25);}
.login-card .hint{margin:0 0 22px;}
.login-card input{margin-bottom:12px;}
.login-divider{display:flex;align-items:center;gap:10px;color:var(--parchment-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;margin:20px 0;}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--line);}
.card{background:linear-gradient(180deg,var(--ink-2),var(--ink));border:1px solid var(--line);border-radius:4px;padding:28px;margin-bottom:24px;}
.card h2{font-size:18px;color:var(--gold-bright);margin:0 0 8px;}
.card .hint{color:var(--parchment-dim);font-style:italic;font-size:14px;margin:0 0 20px;}
.choice-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:22px;}
.choice{background:rgba(0,0,0,0.25);border:1px solid var(--line);border-radius:4px;padding:18px 16px;text-align:center;cursor:pointer;width:150px;transition:border-color .15s, transform .15s;}
.choice:hover{border-color:var(--gold);transform:translateY(-2px);}
.choice.selected{border-color:var(--gold-bright);background:rgba(200,162,74,0.08);box-shadow:0 0 0 1px var(--gold-bright);}
.choice .art{margin:0 auto 10px;display:flex;align-items:center;justify-content:center;height:70px;}
.choice .label{font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:0.06em;color:var(--parchment);}
.choice .blurb{font-size:12px;color:var(--parchment-dim);font-style:italic;margin-top:4px;}
.swatch-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:22px;}
.swatch{width:44px;height:44px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s;}
.swatch:hover{transform:scale(1.08);}
.swatch.selected{border-color:var(--gold-bright);box-shadow:0 0 0 3px rgba(230,199,119,0.25);}
input[type=text],input[type=email]{
  background:rgba(0,0,0,0.3);border:1px solid var(--line);color:var(--parchment);padding:12px 14px;
  font-family:'EB Garamond',serif;font-size:16px;border-radius:3px;width:100%;max-width:320px;margin:0 auto 16px;display:block;
}
input:focus{outline:none;border-color:var(--gold);}
button{background:var(--gold);color:var(--ink);border:none;padding:12px 26px;font-family:'Cinzel',serif;
  font-size:12px;letter-spacing:0.1em;text-transform:uppercase;border-radius:3px;cursor:pointer;display:block;margin:0 auto;}
button:hover:not(:disabled){background:var(--gold-bright);}
button:disabled{opacity:0.4;cursor:not-allowed;}
button.secondary{background:transparent;border:1px solid var(--gold);color:var(--gold-bright);}
.status{font-size:13px;color:var(--parchment-dim);font-style:italic;text-align:center;margin-top:14px;min-height:18px;}
.status.ok{color:var(--gold-bright);}
.status.err{color:var(--ember);}
.guardian-display{text-align:center;padding:10px 0 20px;}
.guardian-display .art{margin:0 auto 14px;filter:drop-shadow(0 0 22px rgba(200,162,74,0.22));}
.guardian-display h2{font-size:26px;color:var(--parchment);margin:0 0 4px;}
.stage-badge{display:inline-block;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--gold-bright);border:1px solid var(--gold);border-radius:20px;padding:4px 14px;margin-bottom:6px;}
.species-line{color:var(--parchment-dim);font-style:italic;font-size:14px;margin-bottom:20px;}
.bond-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0 6px;flex-wrap:wrap;}
.bond-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--parchment-dim);}
.bond-value{font-family:'Cinzel',serif;font-size:20px;color:var(--gold-bright);}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin:20px 0 4px;}
.stat-tile{border:1px solid var(--line);border-radius:3px;padding:12px 8px;text-align:center;}
.stat-tile .num{font-family:'Cinzel',serif;font-size:19px;color:var(--gold-bright);}
.stat-tile .label{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--parchment-dim);margin-top:3px;}
.marks-note{text-align:center;color:var(--parchment-dim);font-style:italic;font-size:14px;margin:20px 0 0;}
.map-hub{
  position:relative;overflow:hidden;
  width:min(100vw, calc(100vh * 1408 / 768));
  aspect-ratio:1408/768;
  background:url('https://static.wixstatic.com/media/d6c75e_11a7f28595a041d49639dce6f72788d7~mv2.jpg') center/cover no-repeat;
}
.map-hotspot{
  position:absolute;background:transparent;border:none;padding:0;margin:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.map-hotspot:hover,.map-hotspot:active,.map-hotspot:focus{background:transparent!important;}
.map-hotspot:focus-visible{outline:2px solid rgba(230,199,119,0.55);outline-offset:2px;}
.phase-note{text-align:center;color:var(--parchment-dim);font-size:12.5px;font-style:italic;margin-bottom:18px;}
.phase-note strong{color:var(--gold-bright);font-style:normal;}
.pantheon-group{margin-bottom:18px;}
.pantheon-group h3{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);opacity:0.85;margin:0 0 8px;text-align:left;}
.deity-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;cursor:pointer;transition:border-color .15s;}
.deity-row:hover{border-color:var(--gold);}
.deity-row .name{font-family:'Cinzel',serif;font-size:13.5px;color:var(--parchment);}
.mark-badge{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;font-family:'Cinzel',serif;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--parchment-dim);}
.mark-badge.full{color:var(--ink);background:var(--gold-bright);border-color:var(--gold-bright);}
.mark-badge.partial{color:var(--gold-bright);border-color:var(--gold);}
.challenge-text{font-style:italic;font-size:16px;line-height:1.6;color:var(--parchment);text-align:center;margin:0 0 22px;padding:0 6px;}
textarea{background:rgba(0,0,0,0.3);border:1px solid var(--line);color:var(--parchment);padding:12px 14px;
  font-family:'EB Garamond',serif;font-size:16px;border-radius:3px;width:100%;max-width:520px;margin:0 auto 16px;display:block;min-height:110px;resize:vertical;}
textarea:focus{outline:none;border-color:var(--gold);}
.verdict-card{text-align:center;}
.verdict-badge{display:inline-block;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;border-radius:20px;padding:5px 16px;margin-bottom:14px;}
.verdict-badge.full{color:var(--ink);background:var(--gold-bright);}
.verdict-badge.partial{color:var(--gold-bright);border:1px solid var(--gold);}
.verdict-text{font-style:italic;font-size:16px;line-height:1.6;color:var(--parchment);margin:0 0 18px;}
.gain-note{font-size:13px;color:var(--parchment-dim);margin-bottom:22px;}
.essence-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 18px;}
.essence-label{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--parchment-dim);}
.essence-value{font-family:'Cinzel',serif;font-size:15px;color:var(--moon);}
.tier-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:3px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;}
.tier-row:hover{border-color:var(--gold);}
.tier-row.locked{opacity:0.4;cursor:not-allowed;}
.tier-row .tname{font-family:'Cinzel',serif;font-size:13.5px;color:var(--parchment);}
.tier-row .taff{font-size:11px;color:var(--parchment-dim);font-style:italic;}
.mark-check{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;cursor:pointer;}
.mark-check.picked{border-color:var(--gold-bright);background:rgba(200,162,74,0.08);}
.mark-check .mname{font-size:14px;color:var(--parchment);}
.hp-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;}
.hp-name{font-family:'Cinzel',serif;font-size:13px;color:var(--parchment);}
.hp-bar-track{background:rgba(0,0,0,0.4);border:1px solid var(--line);border-radius:20px;height:10px;overflow:hidden;margin-bottom:18px;}
.hp-bar-fill{height:100%;background:linear-gradient(90deg,var(--ember),var(--gold-bright));transition:width .35s ease;}
.hp-bar-fill.opponent{background:linear-gradient(90deg,var(--amethyst,#8a6bb8),var(--moon));}
.hp-wrap{position:relative;}
.hp-wrap.flash-hit{animation:hitFlash 0.45s ease;}
.hp-wrap.control-hit .hp-bar-track{box-shadow:0 0 0 1px var(--moon);}
@keyframes hitFlash{ 0%{filter:brightness(1);} 25%{filter:brightness(2) saturate(1.5);transform:translateX(-2px);} 50%{transform:translateX(2px);} 100%{filter:brightness(1);transform:translateX(0);} }
.dmg-float{position:absolute;right:4px;top:-6px;font-family:'Cinzel',serif;font-size:15px;color:var(--ember);pointer-events:none;animation:dmgFloat 0.9s ease forwards;text-shadow:0 1px 3px rgba(0,0,0,0.6);}
.dmg-float.crit{color:var(--gold-bright);font-size:18px;}
.dmg-float.control{color:var(--moon);font-size:13px;}
.dmg-float.heal{color:#7fbf6a;}
.dmg-float.burntick{color:var(--ember);font-size:13px;}
.dmg-float.stunlabel{left:4px;right:auto;color:var(--moon);font-size:12px;letter-spacing:0.06em;text-transform:uppercase;}
@keyframes dmgFloat{ 0%{opacity:1;transform:translateY(0);} 100%{opacity:0;transform:translateY(-28px);} }
.particle{position:absolute;top:50%;left:50%;width:var(--p-size,20px);height:var(--p-size,20px);margin:calc(var(--p-size,20px) / -2) 0 0 calc(var(--p-size,20px) / -2);border-radius:50%;background-color:var(--p-color,#e6c777);pointer-events:none;animation-name:particleBurst;animation-timing-function:ease-out;animation-fill-mode:forwards;
  -webkit-mask-image:var(--p-sprite);mask-image:var(--p-sprite);
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  filter:drop-shadow(0 0 4px var(--p-color,#e6c777));}
@keyframes particleBurst{
  0%{transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--tx),var(--ty)) scale(0.4);opacity:0;}
}
.status-badge{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:34px;height:34px;margin-left:-17px;pointer-events:none;animation:badgePop 0.9s ease forwards;
  background-color:var(--p-color,#e6c777);
  -webkit-mask-image:var(--p-sprite);mask-image:var(--p-sprite);
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  filter:drop-shadow(0 0 3px var(--p-color,#e6c777));}
@keyframes badgePop{ 0%{opacity:0;transform:translate(-50%,4px) scale(0.6);} 30%{opacity:1;transform:translate(-50%,-4px) scale(1.15);} 70%{opacity:1;transform:translate(-50%,-8px) scale(1);} 100%{opacity:0;transform:translate(-50%,-16px) scale(1);} }
.move-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0;}
.move-btn{background:transparent;border:1px solid var(--gold);color:var(--gold-bright);padding:10px 18px;font-family:'Cinzel',serif;font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;border-radius:3px;cursor:pointer;}
.move-btn:hover:not(:disabled){background:rgba(200,162,74,0.12);}
.move-btn:disabled{opacity:0.35;cursor:not-allowed;}
.battle-log{max-height:150px;overflow-y:auto;border-top:1px solid var(--line);margin-top:16px;padding-top:12px;font-size:13px;color:var(--parchment-dim);text-align:left;}
.battle-log .entry{margin-bottom:5px;}
.battle-log .crit{color:var(--gold-bright);}
.battle-log .entry.burntick{color:var(--ember);font-style:italic;}
.battle-log .entry.stunskip{color:var(--moon);font-style:italic;}
.affinity-glow{border-radius:50%;filter:drop-shadow(0 0 26px var(--glow-color, transparent));}
.circle-banner{margin:0 auto;display:block;}
.circle-list-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:3px;margin-bottom:8px;}
.circle-list-row .cinfo{flex:1;text-align:left;}
.circle-list-row .cname{font-family:'Cinzel',serif;font-size:14px;color:var(--parchment);}
.circle-list-row .cblurb{font-size:12.5px;color:var(--parchment-dim);font-style:italic;margin-top:2px;}
.circle-list-row .ccount{font-size:11px;color:var(--parchment-dim);margin-top:3px;letter-spacing:0.06em;text-transform:uppercase;}
.circle-list-row .ractions{display:flex;flex-direction:column;gap:6px;}
.circle-list-row .ractions button{padding:8px 12px;font-size:10.5px;white-space:nowrap;}
.role-badge{display:inline-block;font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;border-radius:20px;padding:3px 10px;}
.role-badge.high_priest, .role-badge.high_priestess{color:var(--ink);background:var(--gold-bright);}
.role-badge.magus{color:var(--gold-bright);border:1px solid var(--gold);}
.role-badge.initiate{color:var(--parchment-dim);border:1px solid var(--line);}
.roster-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;}
.roster-row .rname{font-size:14px;color:var(--parchment);}
.roster-row .ractions{display:flex;gap:6px;flex-wrap:wrap;}
.roster-row .ractions button{padding:6px 10px;font-size:10px;}
.request-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;}
.request-row .ractions button{padding:6px 10px;font-size:10px;}
.shape-pick-row{display:flex;gap:14px;justify-content:center;margin-bottom:22px;flex-wrap:wrap;}
.shape-pick{cursor:pointer;text-align:center;padding:10px;border:1px solid var(--line);border-radius:4px;width:80px;transition:border-color .15s;}
.shape-pick:hover{border-color:var(--gold);}
.shape-pick.selected{border-color:var(--gold-bright);box-shadow:0 0 0 1px var(--gold-bright);}
.affinity-pick-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:22px;}
.affinity-pick{cursor:pointer;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:4px;width:74px;transition:border-color .15s;}
.affinity-pick:hover{border-color:var(--gold);}
.affinity-pick.selected{border-color:var(--gold-bright);box-shadow:0 0 0 1px var(--gold-bright);}
.affinity-pick .dot{width:20px;height:20px;border-radius:50%;margin:0 auto 6px;}
.affinity-pick .aname{font-size:10.5px;color:var(--parchment-dim);text-transform:capitalize;}
.cap-pick-row{display:flex;gap:10px;justify-content:center;margin-bottom:22px;}
.cap-pick{cursor:pointer;padding:10px 18px;border:1px solid var(--line);border-radius:3px;font-family:'Cinzel',serif;font-size:13px;color:var(--parchment);transition:border-color .15s;}
.cap-pick:hover{border-color:var(--gold);}
.cap-pick.selected{border-color:var(--gold-bright);background:rgba(200,162,74,0.08);color:var(--gold-bright);}
.section-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--parchment-dim);text-align:center;margin:0 0 12px;}
.msg-list{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:4px;}
.msg-row{margin-bottom:12px;text-align:left;}
.msg-row.mine{text-align:right;}
.msg-meta{font-size:10.5px;color:var(--parchment-dim);letter-spacing:0.04em;margin-bottom:2px;}
.msg-body{display:inline-block;background:rgba(200,162,74,0.08);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--parchment);max-width:85%;text-align:left;}
.msg-row.mine .msg-body{background:rgba(200,162,74,0.16);border-color:var(--gold);}
.altar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0;}
.altar-plot{aspect-ratio:1;border:1px dashed var(--line);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;font-size:10px;line-height:1.3;color:var(--parchment-dim);}
.altar-plot.empty.clickable{cursor:pointer;transition:border-color .15s;}
.altar-plot.empty.clickable:hover{border-color:var(--gold);}
.altar-plot.seed{border-style:solid;border-color:var(--line);background:rgba(122,148,87,0.14);}
.altar-plot.seed.ready{border-color:var(--gold-bright);cursor:pointer;color:var(--gold-bright);}
.altar-plot.decoration{border-style:solid;border-color:var(--gold);background:rgba(200,162,74,0.1);color:var(--parchment);}
.altar-picker{border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:16px;}
.altar-catalog-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;}
.altar-catalog-row .aname{font-size:13.5px;color:var(--parchment);}
.altar-catalog-row .adesc{font-size:11.5px;color:var(--parchment-dim);font-style:italic;}
.altar-grid.palt{grid-template-columns:repeat(3,1fr);max-width:340px;margin-left:auto;margin-right:auto;}
.altar-plot .pickup-btn{margin-top:4px;padding:2px 6px;font-size:9px;}
footer.notice{text-align:center;color:var(--parchment-dim);font-size:12px;font-style:italic;margin-top:50px;opacity:0.65;}
</style>
