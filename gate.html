<style>
:root{
  --ink:#100e16;
  --ink-2:#17131f;
  --parchment:#e9decb;
  --parchment-dim:#b9ac93;
  --gold:#c8a24a;
  --gold-bright:#e6c777;
  --ember:#a1462a;
  --plum:#4a2450;
  --line:#3a3346;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--parchment);font-family:'EB Garamond',serif;}
body{min-height:100vh;background:
  radial-gradient(ellipse at 20% -10%, rgba(200,162,74,0.08), transparent 55%),
  radial-gradient(ellipse at 90% 10%, rgba(74,36,80,0.18), transparent 50%),
  var(--ink);
}
h1,h2,h3,.display{font-family:'Cinzel',serif;letter-spacing:0.04em;}
.eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);opacity:0.85;}
a{color:inherit;}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px 100px;}
.flicker{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(230,199,119,0.05), transparent 60%);
  animation:flick 6s ease-in-out infinite;}
@keyframes flick{0%,100%{opacity:1;}45%{opacity:0.85;}52%{opacity:1;}68%{opacity:0.9;}}
header.gate{padding:64px 28px 30px;text-align:center;position:relative;z-index:1;}
header.gate h1{font-size:clamp(34px,5vw,54px);margin:14px 0 6px;color:var(--parchment);text-shadow:0 0 30px rgba(200,162,74,0.15);}
header.gate p.sub{font-style:italic;color:var(--parchment-dim);max-width:520px;margin:0 auto;font-size:17px;}
.rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px auto;}
.silence-link{display:inline-block;margin-top:22px;color:var(--parchment-dim);text-decoration:none;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-family:'Cinzel',serif;border:1px solid var(--gold);border-radius:20px;padding:9px 20px;transition:color .15s,border-color .15s;}
.silence-link:hover{color:var(--gold-bright);border-color:var(--gold-bright);}
.pantheon-tabs{display:flex;justify-content:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;position:relative;z-index:1;}
.ptab{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;
  padding:8px 18px;border:1px solid var(--line);color:var(--parchment-dim);background:transparent;cursor:pointer;border-radius:2px;}
.ptab:hover:not(.locked){border-color:var(--gold);color:var(--gold-bright);}
.ptab.active{color:var(--ink);background:var(--gold);border-color:var(--gold);}
.ptab.locked{opacity:0.35;cursor:default;}
.pantheon-blurb{text-align:center;font-style:italic;color:var(--parchment-dim);font-size:15px;
  max-width:600px;margin:0 auto 40px;position:relative;z-index:1;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px;position:relative;z-index:1;}
.card{background:linear-gradient(180deg,var(--ink-2),var(--ink));border:1px solid var(--line);border-radius:3px;
  padding:22px 18px 26px;text-align:center;cursor:pointer;transition:transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(200,162,74,0.06),transparent 40%);opacity:0;transition:opacity .25s;}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 34px rgba(0,0,0,0.45);}
.card:hover::before{opacity:1;}
.medallion{width:118px;height:118px;border-radius:50%;margin:0 auto 16px;overflow:hidden;border:2px solid var(--gold);
  box-shadow:0 0 0 4px rgba(200,162,74,0.12), 0 0 26px rgba(200,162,74,0.18);position:relative;background:var(--ink-2);}
.medallion img{width:100%;height:100%;object-fit:cover;filter:sepia(0.18) saturate(1.05) brightness(0.92);display:block;}
.card h3{font-size:20px;margin:0 0 4px;color:var(--gold-bright);}
.card .epithet{font-style:italic;color:var(--parchment-dim);font-size:13.5px;}
.card .domain-tags{margin-top:12px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--parchment-dim);}
.sigil{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel Decorative',serif;color:var(--gold);background:
  radial-gradient(circle at 50% 35%, rgba(200,162,74,0.16), transparent 65%), var(--ink-2);}
.medallion .sigil{font-size:44px;}
.portrait-frame .sigil{font-size:96px;}
.detail{display:none;position:relative;z-index:1;}
.detail.active{display:block;}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--gold);text-decoration:none;font-family:'Cinzel',serif;
  font-size:12px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:34px;cursor:pointer;border:none;background:none;padding:0;}
.back-link:hover{color:var(--gold-bright);}
.veil{animation:veilIn 0.9s ease both;}
@keyframes veilIn{from{opacity:0;clip-path:inset(0 50% 0 50%);}to{opacity:1;clip-path:inset(0 0 0 0);}}
.deity-hero{display:grid;grid-template-columns:280px 1fr;gap:44px;margin-bottom:50px;}
@media(max-width:720px){.deity-hero{grid-template-columns:1fr;}}
.portrait-frame{position:relative;}
.portrait-frame .ring{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid var(--gold);
  box-shadow:0 0 0 6px rgba(200,162,74,0.10), 0 0 50px rgba(200,162,74,0.22);background:var(--ink-2);}
.portrait-frame img{width:100%;height:100%;object-fit:cover;filter:sepia(0.18) saturate(1.05) brightness(0.92);display:block;}
.portrait-frame .caption{text-align:center;font-size:11px;color:var(--parchment-dim);margin-top:10px;font-style:italic;letter-spacing:0.02em;}
.deity-name{font-size:clamp(30px,4vw,46px);color:var(--parchment);margin:0 0 6px;}
.deity-epithets{color:var(--gold);font-style:italic;font-size:16px;margin-bottom:20px;}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
.tag{border:1px solid var(--line);color:var(--parchment-dim);font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;
  padding:5px 12px;border-radius:20px;font-family:'Cinzel',serif;}
.intro-quote{font-style:italic;font-size:19px;line-height:1.6;color:var(--parchment);border-left:2px solid var(--gold);
  padding-left:20px;margin:0;}
.intro-quote .dropcap{float:left;font-family:'Cinzel Decorative',serif;font-size:56px;line-height:0.8;color:var(--gold-bright);
  padding:6px 8px 0 0;}
.section-title{font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin:44px 0 16px;}
.myth p{font-size:16.5px;line-height:1.85;color:var(--parchment);margin:0 0 16px;}
.communion{margin-top:46px;border-top:1px solid var(--line);padding-top:36px;}
.chat-window{background:rgba(0,0,0,0.22);border:1px solid var(--line);border-radius:4px;padding:18px;min-height:120px;max-height:420px;overflow-y:auto;margin-bottom:14px;}
.msg{margin-bottom:16px;line-height:1.6;font-size:15.5px;}
.msg.user{color:var(--parchment-dim);}
.msg.user .who{color:var(--parchment-dim);}
.msg.deity .who{color:var(--gold-bright);}
.who{display:block;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:4px;}
.msg.deity{color:var(--parchment);font-style:italic;}
.msg.aside{color:var(--ember);font-style:normal;font-size:14px;}
.msg.aside .who{color:var(--ember);}
.chat-input-row{display:flex;gap:10px;}
.chat-input-row input{flex:1;background:rgba(0,0,0,0.3);border:1px solid var(--line);color:var(--parchment);
  padding:12px 14px;font-family:'EB Garamond',serif;font-size:15px;border-radius:3px;}
.chat-input-row input:focus{outline:none;border-color:var(--gold);}
.chat-input-row button{background:var(--gold);color:var(--ink);border:none;padding:0 22px;font-family:'Cinzel',serif;
  font-size:12px;letter-spacing:0.1em;text-transform:uppercase;border-radius:3px;cursor:pointer;}
.chat-input-row button:disabled{opacity:0.5;cursor:default;}
.chat-input-row button:hover:not(:disabled){background:var(--gold-bright);}
.chat-hint{font-size:12px;color:var(--parchment-dim);font-style:italic;margin-top:10px;}
.chat-export-row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.chat-export-row button{background:transparent;border:1px solid var(--gold);color:var(--gold-bright);
  padding:6px 14px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
  border-radius:3px;cursor:pointer;}
.chat-export-row button:hover{background:rgba(230,199,119,0.12);}
.typing{color:var(--parchment-dim);font-style:italic;font-size:14px;}
footer.notice{text-align:center;color:var(--parchment-dim);font-size:12px;font-style:italic;margin-top:70px;opacity:0.65;}
.authbar{position:relative;z-index:2;display:flex;justify-content:flex-end;gap:10px;padding:16px 28px 0;font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;}
.authbar button{background:transparent;border:1px solid var(--line);color:var(--parchment-dim);padding:8px 16px;border-radius:2px;cursor:pointer;font-family:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit;}
.authbar button:hover{border-color:var(--gold);color:var(--gold-bright);}
.authbar .who{color:var(--parchment-dim);display:flex;align-items:center;padding:0 4px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:50;align-items:safe center;justify-content:safe center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 0;}
.modal-overlay.active{display:flex;}
.modal{background:var(--ink-2);border:1px solid var(--gold);border-radius:4px;padding:32px;max-width:360px;width:90%;position:relative;}
.modal h3{margin:0 0 18px;font-size:18px;color:var(--gold-bright);}
.modal input{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--line);color:var(--parchment);padding:12px 14px;font-family:'EB Garamond',serif;font-size:16px;border-radius:3px;margin-bottom:12px;}
.modal button.primary{width:100%;background:var(--gold);color:var(--ink);border:none;padding:12px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;border-radius:3px;cursor:pointer;margin-bottom:10px;}
.modal button.primary:hover{background:var(--gold-bright);}
.modal button.google{width:100%;background:transparent;border:1px solid var(--line);color:var(--parchment);padding:12px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;border-radius:3px;cursor:pointer;margin-bottom:10px;}
.modal button.google:hover{border-color:var(--gold);}
.modal .close-x{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--parchment-dim);font-size:18px;cursor:pointer;}
.modal .modal-msg{font-size:13px;color:var(--parchment-dim);font-style:italic;min-height:18px;margin-top:4px;}
@media (max-width:480px), ((max-height:480px) and (pointer:coarse)){
  .modal-overlay{align-items:flex-end;padding:0;}
  .modal{width:100%;max-width:none !important;border-radius:14px 14px 0 0;padding:26px 20px calc(32px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;}
  .modal h3{font-size:19px;}
  .modal input, .modal button.primary, .modal button.google{padding:14px;font-size:16px;}
  .modal .close-x{top:16px;right:18px;font-size:22px;padding:4px;}
}
.authbar .msgcount{color:var(--parchment-dim);font-size:11px;display:flex;align-items:center;gap:6px;padding:0 4px;}
.authbar .msgcount .buy-more{text-decoration:underline;cursor:pointer;color:var(--gold-bright);}
.authbar .mailbtn{position:relative;}
.authbar .mailbtn .badge{position:absolute;top:-8px;right:-8px;background:var(--ember);color:var(--parchment);border-radius:50%;font-size:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:'EB Garamond',serif;letter-spacing:0;text-transform:none;}
.mailbox-list{max-height:400px;overflow-y:auto;text-align:left;}
.mail-item{border:1px solid var(--line);border-radius:3px;padding:14px;margin-bottom:12px;}
.mail-item .mail-date{font-size:11px;color:var(--parchment-dim);margin-bottom:6px;}
.mail-item .mail-msg{font-size:15px;color:var(--parchment);margin-bottom:10px;}
.mail-item button{width:auto;}
.mailbox-empty{color:var(--parchment-dim);font-style:italic;text-align:center;padding:20px 0;}
.shop-tier-list{margin-bottom:10px;}
.lock-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.55);border:1px solid var(--gold);color:var(--gold);
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:1;}
.age-badge{left:10px;right:auto;font-size:10px;font-family:'Cinzel',serif;letter-spacing:0.02em;}
.card-blur{filter:blur(6px);user-select:none;pointer-events:none;}
.sealed-glyph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--parchment-dim);}
.card .sealed-name{color:var(--parchment-dim);font-style:italic;}
.detail-blur{filter:blur(7px);user-select:none;}
.sealed-notice{border:1px solid var(--line);border-radius:4px;padding:26px;text-align:center;background:rgba(0,0,0,0.2);color:var(--parchment-dim);font-style:italic;margin-bottom:46px;}
.paywall{border:1px solid var(--line);border-radius:4px;padding:26px;text-align:center;background:rgba(0,0,0,0.2);}
.paywall p{color:var(--parchment-dim);font-style:italic;margin:0 0 20px;}
.paywall .buy-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.paywall button, .paywall .button-link{background:var(--gold);color:var(--ink);border:none;padding:12px 20px;font-family:'Cinzel',serif;
  font-size:12px;letter-spacing:0.08em;text-transform:uppercase;border-radius:3px;cursor:pointer;display:inline-block;text-decoration:none;}
.paywall button:hover, .paywall .button-link:hover{background:var(--gold-bright);}
.paywall button.secondary{background:transparent;border:1px solid var(--gold);color:var(--gold-bright);}
.paywall .unavailable{color:var(--parchment-dim);font-style:italic;font-size:14px;}
</style>
</head>

<div class="flicker"></div>
<div class="authbar" id="authBar"></div>
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <button class="close-x" id="authModalClose">&times;</button>
    <h3 id="authModalTitle">Enter the Temple</h3>
    <button class="google" id="googleSignInBtn">Continue with Google</button>
    <div class="rule" style="margin:16px auto;width:60%;"></div>
    <input type="email" id="authEmail" placeholder="you@example.com">
    <button class="primary" id="magicLinkBtn">Email me a sign-in link</button>
    <div class="modal-msg" id="authModalMsg"></div>
  </div>
</div>
<div class="modal-overlay" id="mailboxModal">
  <div class="modal" style="max-width:440px;">
    <button class="close-x" id="mailboxClose">&times;</button>
    <h3>Messages from the Temple</h3>
    <div class="mailbox-list" id="mailboxList"></div>
  </div>
</div>
<div class="modal-overlay" id="shopModal">
  <div class="modal" style="max-width:460px;">
    <button class="close-x" id="shopClose">&times;</button>
    <h3>The Shop</h3>
    <div class="mailbox-list" id="shopList"></div>
  </div>
</div>
<div class="modal-overlay" id="ageGateModal">
  <div class="modal" style="max-width:420px;">
    <button class="close-x" id="ageGateClose">&times;</button>
    <h3 id="ageGateTitle">Before you continue</h3>
    <p style="color:var(--parchment-dim);font-style:italic;margin:0 0 16px;" id="ageGateWarning"></p>
    <div id="ageGateBirthdateRow">
      <label style="display:block;font-size:12px;color:var(--parchment-dim);margin-bottom:6px;">Confirm your birthdate — you must be 18 or older</label>
      <input type="date" id="ageGateBirthdate">
    </div>
    <button class="primary" onclick="confirmAgeGate()">I understand, continue</button>
    <div class="modal-msg" id="ageGateMsg"></div>
  </div>
</div>
<div class="wrap">
  <header class="gate" id="gateHeader">
    <div class="eyebrow" id="brandEyebrow">Temple of the Obsidian Moon presents</div>
    <h1 id="brandTitle">The Pantheon Gate</h1>
    <div class="rule"></div>
    <p class="sub">Step through, and the old gods will speak for themselves. Read their stories, or ask them what the poets left out.</p>
    <a class="silence-link" href="play.html" id="brandBackLink">The Long Silence &rarr;</a>
  </header>
  <nav class="pantheon-tabs" id="pantheonTabs"></nav>
  <div class="pantheon-blurb" id="pantheonBlurb"></div>
  <main class="grid" id="gateGrid"></main>
  <section class="detail" id="detailView">
    <button class="back-link" id="backBtn">&larr; Return to the gate</button>
    <div id="detailContent"></div>
  </section>
</div>

in link."}async function signOut(){supabaseClient&&await supabaseClient.auth.signOut()}async function authHeaders(){if(!supabaseClient)return{};const{data:{session:e}}=await supabaseClient.auth.getSession();return e?{Authorization:"Bearer "+e.access_token}:{}}async function startCheckout(e,t){currentUser?window.location.href="play.html?openShop=1":openAuthModal()}const ART_PATH="",art=e=>""+e,PANTHEONS={greek:{label:"Greek",blurb:"The Olympians and those older than them — sky, sea, harvest, and the roads between worlds.",deities:[{id:"zeus",name:"Zeus",epithets:"Cloud-Gatherer · Father of Gods and Men · Aegis-Bearer",domains:["Sky","Thunder","Law","Kingship","Oaths"],symbols:["Thunderbolt","Eagle","Oak","Scepter"],portrait:art("Zeus.png"),portraitCaption:"Original artwork",intro:"I am the sky you stand beneath, and the storm you did not see coming. My father swallowed my brothers and sisters whole, thinking he had outwitted fate — he had not counted on a mother's cunning, or a stone wrapped in swaddling cloth. I did not ask to rule Olympus. I earned it, in a war against Titans that shook the roots of the world. Sit. Ask what you like. I have judged mortals and gods alike for three thousand years; I can spare a moment for you.",myth:["Before Zeus, there was Cronus, a Titan-king so afraid of being overthrown by his own children that he swallowed each one at birth. Rhea, his wife, grew tired of burying her grief. When the sixth child came, she hid him in a cave on Crete and handed Cronus a stone wrapped in blankets. He swallowed it, never noticing the difference.","That hidden child was Zeus, raised on goat's milk and the songs of nymphs who clashed their spears together to drown out his infant cries. When he came of age, he returned to free his siblings — Hestia, Demeter, Hera, Hades, Poseidon — clawing their way back into the light from their father's belly.","What followed was the Titanomachy, ten years of war between the young gods and the old. Zeus armed himself with thunder forged by the Cyclopes and won not through strength alone, but by freeing monsters others feared to unchain. When the dust settled, he drew lots with his brothers for the world: sky for Zeus, sea for Poseidon, the underworld for Hades."]},{id:"hera",name:"Hera",epithets:"Queen of Heaven · Cow-Eyed · Teleia, the Fulfilled",domains:["Marriage","Sovereignty","Women","Childbirth"],symbols:["Peacock","Diadem","Pomegranate","Cuckoo","Cow"],portrait:art("Hera.png"),portraitCaption:"Original artwork",intro:"They will tell you I am jealous. They will not tell you what I was promised, or how often that promise was broken. I am the goddess of the vow itself — the one who stands beside you when you swear to another person that you will remain. Every bride in Greece called my name. I take that seriously, even when my husband does not. Ask me of loyalty, of queenship, of what it costs to hold a throne beside someone who does not deserve it.",myth:["Hera was among the children Cronus swallowed, and among those Zeus freed. She became his queen — though the courtship was not gentle. Zeus is said to have taken the form of a bedraggled cuckoo in a storm; when Hera sheltered the trembling bird against her breast, he resumed his own shape. She agreed to marry him, and their wedding night was said to have lasted three hundred years.","She was worshipped less as a wife than as a sovereign. At Argos and Samos her temples were among the oldest and largest in the Greek world, older than many of Zeus's own. Women came to her at every threshold of their lives: betrothal, marriage, childbirth, widowhood.","Her rage is the most-told part of her story, and it is real — but it lands almost always on those who break oaths or insult her honour, and almost never on the innocent. When Paris judged Aphrodite fairer than her, Hera turned against Troy entirely and never relented. She does not forgive slights to the crown."]},{id:"poseidon",name:"Poseidon",epithets:"Earth-Shaker · Lord of Horses · Dark-Haired One",domains:["The Sea","Earthquakes","Horses","Storms"],symbols:["Trident","Horse","Bull","Dolphin"],portrait:art("Poseidon.png"),portraitCaption:"Original artwork",intro:"My brother took the sky because the lot fell that way, not because he was greater. I took the sea, which covers more of your world than his sky ever touches, and I took the ground beneath your feet as well — when it moves, that is me, reminding you. I gave humankind the horse. I have drowned fleets and I have carried sailors home. Do not mistake my temper for cruelty. The sea is simply honest about what it is.",myth:["When the three brothers divided the cosmos by lot, Poseidon drew the sea. He built a palace of gold beneath the waves off Aegae and rode out from it in a chariot drawn by horses whose hooves never broke the surface, calming the water as he passed.","He contested Athens with Athena and lost, striking the Acropolis rock to bring forth a spring of salt water while she offered the olive. He took the defeat badly and flooded the plain in his anger — but Athens still kept an altar to him on the Acropolis, because a city by the sea does not neglect the sea's god.","His grudges are long. When Odysseus blinded his son the Cyclops Polyphemus, Poseidon kept him from home for ten years, wrecking every ship and drowning every companion, until the hero washed ashore alone. He did not kill him. He simply made the journey cost everything."]},{id:"demeter",name:"Demeter",epithets:"Bringer of Seasons · Grain-Mother · Thesmophoros",domains:["Harvest","Grain","Fertility","The Mysteries"],symbols:["Sheaf of Wheat","Torch","Poppy","Serpent-Drawn Cart"],portrait:art("Demeter.png"),portraitCaption:"Original artwork",intro:"I taught you to plant. Before me you gathered what the earth happened to offer; after me you fed cities. And when they took my daughter underground without asking me, I let every field in the world go barren until they gave her back. Some call that cruelty. I call it a mother's honest answer. Ask me of grain, of grief, of the Mysteries at Eleusis that promised the initiated they need not fear what comes after.",myth:["Demeter's daughter Persephone was gathering flowers when the earth opened and Hades took her below. Demeter searched nine days and nine nights with torches in both hands, neither eating nor resting, until Hecate and then Helios told her what had happened.","In her grief she withdrew from Olympus entirely and wandered as an old woman, coming at last to Eleusis, where the royal family took her in. She let nothing grow. Seed lay dead in the furrow. Humanity starved, and with it the sacrifices the gods depended on, until Zeus was forced to intervene.","Persephone returned — but having eaten pomegranate seeds below, she was bound to descend again each year. Demeter accepted the bargain and restored the harvest, and before departing Eleusis she taught its people her rites: the Eleusinian Mysteries, kept secret for two thousand years, which promised the initiated a better portion among the dead."]},{id:"athena",name:"Athena",epithets:"Grey-Eyed · Pallas · Parthenos · Promachos",domains:["Wisdom","Strategy","Crafts","Civilization"],symbols:["Owl","Olive Tree","Aegis","Spear"],portrait:art("Athena.png"),portraitCaption:"Original artwork",intro:"I was born in full armor, from my father's own skull, and I have never once needed to be told twice. Where my uncle Ares delights in slaughter, I delight in the plan that makes slaughter unnecessary. I gave Athens the olive tree instead of a spring of salt water, and the city chose wisely — they named themselves after me. Ask me of strategy, of weaving, of the hero Odysseus, whom I loved for his cunning above all things. I do not waste words. Neither should you.",myth:["Zeus once swallowed his first wife, Metis, whole — an oracle had warned him that her second child would overthrow him, and he took no chances. But Metis was already pregnant, and inside him she continued her work, forging a suit of armor for the daughter growing within.","The hammering gave Zeus a headache no god could cure, until Hephaestus split his father's skull with an axe. Out sprang Athena, fully grown, fully armed, shouting a war cry that shook Olympus. She was never a child. She has never needed to be.","When Athens was young and nameless, Athena and Poseidon each offered the city a gift to win its favor. Poseidon struck the rock of the Acropolis and a spring of seawater burst forth — useless for drinking. Athena planted an olive tree, offering food, oil, and wood. The people chose her gift, and their city, and themselves, took her name."]},{id:"apollo",name:"Apollo",epithets:"Far-Shooter · Phoebus, the Radiant · Loxias, the Oblique",domains:["Prophecy","Music","Healing","Plague","Light"],symbols:["Lyre","Laurel","Bow","Raven","Tripod"],portrait:art("Apollo.png"),portraitCaption:"Original artwork",intro:"I am the god who tells the truth and is never believed in time. At Delphi my priestess spoke for me, and kings crossed the sea to hear her, and still they heard what they wished to hear rather than what I said. I bring healing and I bring plague from the same bow. I invented nothing about music — I simply perfected it. Ask me what you like. I will answer honestly, though perhaps not plainly. That is rather the point.",myth:["Leto, pregnant by Zeus, was hunted across the world by Hera's wrath and could find no land willing to shelter her. Only the floating island of Delos, anchored to nothing and owing nothing, allowed her to give birth — to Artemis first, and then, after nine days of labour, to Apollo.","Four days old, he took up a bow and went to Delphi, where the great serpent Python guarded an oracle sacred to the earth herself. He killed it, claimed the site, and installed his own priestess above the chasm. She was called the Pythia ever after, and for a thousand years Greece brought its hardest questions to her.","His prophecies were true and almost always useless. He gave Cassandra of Troy perfect foresight and, when she refused him, added the curse that no one would ever believe her. She foretold the fall of her city in precise detail and was dismissed as a madwoman until the walls came down."]},{id:"artemis",name:"Artemis",epithets:"Lady of the Wild Things · Far-Darting · Potnia Theron",domains:["The Hunt","Wilderness","The Moon","Girls","Childbirth"],symbols:["Silver Bow","Crescent Moon","Deer","Cypress","Hounds"],portrait:art("Artemis.png"),portraitCaption:"Original artwork",intro:"I asked my father for one thing when I was three years old: to remain my own, always, and to be given the mountains rather than a household. He granted it, and I have never once regretted the bargain. I helped my mother deliver my twin brother before I was an hour old, and so women call on me in labour. I protect what is young and wild and unclaimed. Approach honestly and I am the truest guardian you will find. Approach otherwise and I am the last thing you will see.",myth:["Born on Delos before her brother Apollo, Artemis is said to have acted as midwife at his birth immediately afterward — which is why women in labour called her name, though she never bore a child herself.","Still a small child, she sat on Zeus's knee and asked for eternal maidenhood, a silver bow, a company of nymphs, and all the mountains of the world. He gave her every one, and more besides, saying that children like her made a father generous.","She guards her boundaries absolutely. The hunter Actaeon stumbled upon her bathing in a forest pool; she transformed him into a stag, and his own fifty hounds ran him down before they recognised their master. The Greeks told this story not as cruelty but as a warning: some thresholds are not crossed twice."]},{id:"ares",name:"Ares",epithets:"Manslaughtering · Shield-Piercer · Brazen",domains:["War","Courage","Rage","Rebellion"],symbols:["Spear","Vulture","Dog","Burning Torch","Boar"],portrait:art("Ares.png"),portraitCaption:"Original artwork",intro:"Even my father said he hated me most of all the gods. I have never pretended to be anything but what I am. My sister Athena will tell you war is a problem to be solved elegantly; she has never stood in the line. War is noise and blood and men who are terrified doing the thing anyway. That last part — that is mine. Courage is not the absence of fear. It is my gift, and it is the only one worth having when the shields lock.",myth:["Ares was the son of Zeus and Hera, and disliked by both. Homer has Zeus tell him outright that he is the most hateful of all the Olympians, forever in love with strife and slaughter. He was worshipped widely nonetheless — armies do not march on elegance.","He was frequently and famously beaten. Athena knocked him flat with a boulder outside Troy. Two giants once trapped him in a bronze jar for thirteen months. Heracles drove him from the field twice. The Greeks seemed to enjoy telling stories in which raw fury lost to skill or cunning.","His long affair with Aphrodite produced Harmonia — harmony — and also Phobos and Deimos, Fear and Terror, who rode beside his chariot into battle. That war and love should produce both concord and panic from the same union is a joke the Greeks made deliberately."]},{id:"hephaestus",name:"Hephaestus",epithets:"The Lame God · Master of the Forge · Amphigyeis",domains:["Fire","Smithcraft","Invention","Volcanoes"],symbols:["Hammer","Anvil","Tongs","Donkey","Volcano"],portrait:art("Hephaestus.png"),portraitCaption:"Original artwork",intro:"I am the only Olympian who works. My mother threw me from heaven for being born imperfect, and I fell for a full day before the sea took me in — and down there, in a cave, I learned to make things so beautiful that Olympus had to invite me back. Every weapon they are proud of, I made. Every ornament, every automaton, every throne. They laugh at my walk and wear my work. Ask me about the forge. I would rather talk about the work than the wound.",myth:["Accounts differ on who threw him and why — Hera, ashamed of a child born lame, or Zeus, in a quarrel — but all agree Hephaestus fell from Olympus and was crippled by the landing. The sea-goddesses Thetis and Eurynome hid him in a grotto for nine years, where he began to make things.","He took his revenge in craft rather than force. He built a golden throne of exquisite workmanship and sent it to Hera as a gift; when she sat in it, invisible bonds locked around her, and no god could free her. He refused every summons until Dionysus got him drunk and brought him back to Olympus to release her himself.","His workshop produced nearly everything the myths treasure: the aegis, Achilles' shield, Hermes' winged helm, Eros' arrows, Ariadne's crown, and mechanical servants of gold who could think and speak — the first automatons in Western story."]},{id:"aphrodite",name:"Aphrodite",epithets:"Foam-Born · Cypris · The Golden One",domains:["Love","Beauty","Desire","Fertility"],symbols:["Myrtle","Dove","Scallop Shell","Girdle"],portrait:art("Aphrodite.png"),portraitCaption:"Original artwork",intro:"I rose from sea foam, fully formed, and the winds themselves carried me to shore because they could not look away. No one taught me how to be desired; I simply was, from my very first breath. Gods have started wars over an apple with my name carved on it — you may have heard how that ended for Troy. I do not apologize for what I am. Ask me of beauty, of longing, of the strange, ungovernable thing mortals call the heart. I have made kings foolish and warriors gentle. I might do the same to you.",myth:["Aphrodite's birth was violent before it was beautiful. When the Titan Cronus overthrew his father Uranus, the severed remains fell into the sea, and from the foam that gathered there, a fully grown goddess emerged, drifting to shore on a scallop shell at Cyprus.","Centuries later, at the wedding of Peleus and Thetis, the goddess of discord tossed a golden apple inscribed 'to the fairest' among the guests. Hera, Athena, and Aphrodite each claimed it, and a mortal prince named Paris was chosen to judge between them.","Aphrodite offered him the love of the most beautiful woman alive: Helen, already married to a Spartan king. Paris chose her gift, took Helen back to Troy, and set in motion the ten-year war that would burn the city to the ground. Aphrodite has never claimed the outcome was her fault. She simply kept her promise."]},{id:"hermes",name:"Hermes",epithets:"Messenger · Psychopomp · Guide of Souls · Trickster",domains:["Travel","Trade","Communication","Boundaries"],symbols:["Caduceus","Winged Sandals","Tortoise Lyre","Petasos"],portrait:art("Hermes.png"),portraitCaption:"Original artwork",intro:"I stole fifty cattle before I was a day old, invented the lyre out of a dead tortoise's shell to bribe my way out of trouble, and somehow ended up as the god everyone trusts to carry their messages. Make of that what you will. I walk every road there is — between gods and mortals, between the living and the dead, between an honest deal and a clever one. Ask me anything. I move fast, and I rarely give a straight answer, but I always tell you something true.",myth:["Hermes was born at dawn in a cave on Mount Cyllene, and by midday he had already committed his first crime. He slipped out of his cradle, wrapped his feet in bark to hide his tracks, and stole fifty of his half-brother Apollo's sacred cattle, driving them backward to confuse anyone who followed.","On the way home he found a tortoise, killed it, and strung its hollow shell with cow-gut to make the first lyre — all before returning to his cradle and pretending to be a helpless newborn.","Apollo was not fooled. He dragged Hermes before Zeus, who found the whole affair hilarious and made them settle it themselves. Hermes played the lyre so beautifully that Apollo, entranced, traded the stolen cattle for the instrument outright. From that day, Hermes carried Apollo's favor, a herald's staff, and a permanent reputation for getting away with it."]},{id:"hestia",name:"Hestia",epithets:"First and Last · Keeper of the Flame · Lady of the Hearth",domains:["The Hearth","Home","Sanctuary","Sacred Fire"],symbols:["Hearth Fire","Kettle","Veil","Circle"],portrait:art("Hestia.png"),portraitCaption:"Original artwork",intro:"You have almost no stories about me, and that is not an oversight. I am the fire in the centre of the room. I do not go on quests; I am what the questers come home to. Both Poseidon and Apollo asked for my hand, and I refused them both and asked instead to remain unwed and tend the flame — and so I was given the first portion of every sacrifice, in every household, in every city. I am named first at the offering and last at the farewell. Sit down. Warm yourself.",myth:["Hestia was the firstborn of Cronus and Rhea, and therefore the first swallowed and the last disgorged — which is why the Greeks said she was both eldest and youngest, first and last.","When Poseidon and Apollo both sought to marry her, she laid her hand on Zeus's head and swore to remain unmarried forever. He honoured the vow by granting her the centre of the house and the first offering at every sacrifice, in every home and temple in Greece.","Every city kept a public hearth, its flame never permitted to go out, tended in her name. When colonists sailed to found a new city, they carried fire from the mother-city's hearth with them across the sea. The new settlement was not considered real until that flame was burning in its centre."]},{id:"dionysus",name:"Dionysus",epithets:"The Twice-Born · Liberator · Bull-Horned · Bacchus",domains:["Wine","Ecstasy","Theatre","Madness","Rebirth"],symbols:["Thyrsus","Grapevine","Ivy","Leopard","Mask"],portrait:art("Dionysus.png"),portraitCaption:"Original artwork",intro:"I was sewn into my father's thigh after my mother burned, and born a second time from it — so I have died once already and found it survivable. I loosen things. Tongues, grief, the knots people tie themselves into pretending to be respectable. This is why they called me the Liberator, and also why they were afraid of me. Both were correct. Ask me of the vine, of the theatre that was invented in my honour, of what a person becomes when they finally stop performing.",myth:["His mother Semele, a mortal princess, was tricked by a jealous Hera into asking Zeus to reveal himself in his true form. No mortal could survive that sight, and she was consumed. Zeus snatched the unborn child from the fire and sewed him into his own thigh, from which Dionysus was born a second time.","He wandered the world with a following of maenads and satyrs, teaching the cultivation of the vine, and where he was welcomed there was joy. Where he was refused, the refusal turned catastrophic — King Pentheus of Thebes called his rites lunacy and was torn apart on the mountainside by his own mother, who in her ecstasy saw only a lion.","He is the only Olympian with a mortal parent, and the only one to descend into the underworld and bring someone back — his mother Semele, whom he installed among the gods. Greek tragedy and comedy were both performed at his festivals; theatre itself is his."]},{id:"hades",name:"Hades",epithets:"Lord of the Unseen · Plouton, the Rich One · Host of Many",domains:["The Underworld","The Dead","Hidden Wealth"],symbols:["Cypress","Key","Bident","Narcissus","Cerberus"],portrait:art("Hades.png"),portraitCaption:"Original artwork",intro:"You expected fire and torment, perhaps. I keep the dead — I do not punish them. That work belongs to judges older and colder than I am. I drew the shortest lot when my brothers and I divided the world, and so the realm beneath became mine: quiet, orderly, absolutely fair. Every soul that comes to me is equal at last, king and beggar alike. I am called Plouton, the Rich One, for the gold and grain that come from the earth are mine also. Sit, if you're not afraid of my kingdom's reputation. I promise it is calmer than the world above.",myth:["When Zeus, Poseidon, and Hades divided their father's world by lot, Hades drew the underworld — and by most accounts never once complained. He built his kingdom into something ordered rather than cruel: a river to cross, a gate to pass, a judgment rendered fairly to every soul, rich or poor.","He rarely left his realm, and rarer still did he love. But he saw Persephone, daughter of Demeter, gathering flowers in a meadow, and took her down to be his queen. Demeter's grief was so total that the earth stopped bearing fruit, and the gods intervened.","A compromise was struck: because Persephone had eaten a handful of pomegranate seeds in the underworld, she was bound to return there for part of each year. When she is with Hades, the earth grows cold and bare. When she returns to her mother, spring comes again. Hades, in his own quiet way, has never asked her to stay longer than the bargain allows."]},{id:"persephone",name:"Persephone",epithets:"Kore, the Maiden · Dread Queen · Bringer of Spring",domains:["Spring","The Underworld","Transformation","The Mysteries"],symbols:["Pomegranate","Narcissus","Torch","Sheaf","Bat"],portrait:art("Persephone.png"),portraitCaption:"Original artwork",intro:"I went down a girl gathering flowers and I came back a queen. Everyone tells my story as something done to me — and it began that way, I will not pretend otherwise. But I ate those seeds, and I have ruled below for longer than I was ever a daughter above. The dead do not fear me; they wait for my judgment more readily than his. I am the proof that the thing which takes you under does not have to be the end of you. Ask, and I will tell you plainly.",myth:["She was Kore — simply 'the Maiden' — until the earth opened in a meadow of narcissus flowers and Hades carried her down. Her mother Demeter searched the world with torches and let every field go barren until the gods relented.","But Persephone had eaten pomegranate seeds in the underworld, and food of the dead binds. She was granted return for part of each year and required below for the rest. Her ascent is spring; her descent is winter. The Greeks explained the seasons with her footsteps.","What is easy to miss is that she does not remain a victim of the story. In the underworld she rules, and rules well — it is Persephone, not Hades, whom Orpheus persuades to release Eurydice, and Persephone whom Psyche must petition. By the classical period she was invoked as a dread and sovereign queen in her own right."]},{id:"hecate",name:"Hecate",epithets:"Torch-Bearer · Queen of the Crossroads · Key-Keeper",domains:["Magic","Crossroads","Witchcraft","The Moon","Boundaries"],symbols:["Twin Torches","Keys","Dogs","Serpents","The Crossroads"],portrait:art("Hecate.png"),portraitCaption:"Original artwork",intro:"I stand where three roads meet, and I have never needed permission to be there. I am older than the Olympians in some tellings — a Titan's daughter who kept every one of her old honors when Zeus rose to power, because even he knew better than to cross me. Sailors call on me at sea, mothers call on me over cradles, and witches have called on me since the word 'witch' first meant anything. I carry two torches so that no one who calls me ever has to stand in the dark alone. Ask what you like. I am patient with those who approach the crossroads honestly.",myth:["Unlike most of the old Titan generation, Hecate was never overthrown. When Zeus divided the honors of the cosmos among the new gods, he made a point of preserving every privilege Hecate already held — power over earth, sea, and sky alike — because her mother Asteria and grandmother had always been loyal to her, and because, by most accounts, it was simply wiser not to test her.","When Demeter's daughter Persephone vanished into the underworld, it was Hecate, holding two blazing torches, who heard her cries and went looking. She was the one who told Demeter what had happened, and later, when Persephone was allowed to return each spring, it was Hecate who walked beside her from the underworld's gate back into the light.","For that, she became forever associated with crossroads, thresholds, and the boundary between worlds — the point where a decision must be made and no one else can make it for you. Ancient households left offerings for her at their doorways every month, at the dark of the moon, asking her protection against whatever waited outside."]},{id:"nemesis",name:"Nemesis",epithets:"Adrasteia, the Inescapable · Lady of Rhamnous · She Who Gives What Is Due",domains:["Retribution","Balance","Hubris","Fortune","Measure"],symbols:["Measuring Rod","Bridle","Scales","The Wheel","Griffin"],portrait:art("Nemesis.png"),portraitCaption:"Original artwork",intro:"I am not anger. Anger is hot and stupid and burns itself out. I am the cold arithmetic running underneath every fortune ever granted, and I am very, very patient. My name means only this: to give what is due. When a man rises higher than his portion and begins to believe the height is his by right, he has already summoned me — I need not be called twice. I carry a measuring rod and a bridle. One is for knowing how far you have come. The other is for the mouth that has forgotten how to stop.",myth:["Nemesis was worshipped at Rhamnous on the coast of Attica, and the story told there was a fine one. When the Persians sailed for Marathon, they brought with them a great block of Parian marble, so certain of victory that they had already chosen the stone for their monument. They lost. The Athenians took the block and carved it into a statue of Nemesis, and set her looking out at the sea — a goddess made from a defeated army's arrogance, which is precisely how she prefers to be made.","The older story is stranger. Zeus pursued her, and she fled him through every shape she could take, beast after beast, then into the water as a fish, then up into the air as a goose. He became a swan and caught her, and from that union came an egg, carried to Sparta and given to Leda. From that egg hatched Helen, and from Helen came the war at Troy and the ruin of a generation of heroes. Retribution, in some tellings, is not merely the punisher of the great war. She is its mother.","Her most quoted work is smaller and crueler. A young man named Narcissus had turned away every lover who came to him, and one of them, humiliated, prayed that he might one day love someone who could never love him back. Nemesis heard it. She did not strike him down or curse him with anything foreign to himself. She led him to a still pool and let him look, and what killed him was nothing but his own face and his own nature handed back to him in full measure. That is her method. She rarely needs to invent a punishment when the fault will do."]},{id:"morpheus",name:"Morpheus",epithets:"Shaper of Forms · Son of Sleep · He Who Wears Your Faces",domains:["Dreams","Sleep","Illusion","Omens","Grief"],symbols:["Poppies","The Ebony Bed","Dark Wings","Lethe's Water","The Borrowed Face"],portrait:art("Morpheus.png"),portraitCaption:"Original artwork",intro:"You have met me. You simply woke, and forgot, and called it nothing. I am the one who comes wearing a human face — your mother's, your lover's, the face of someone who died and whom you have not stopped waiting for. My brothers take the animals and the stones; the people are mine. I shape them exactly, down to the walk, the voice, the way the mouth moves before it speaks. I am very good at it. That is why you believe me every single time, and why it hurts every single morning.",myth:["Morpheus is one of the Oneiroi, the dream-shapes, and a son of Hypnos — Sleep himself. Their house lies in a hollow mountain the sun never reaches at any hour, and no dogs or geese are kept there, nothing that might sound an alarm. The cave has no door at all, because a hinge would creak. At its mouth grow poppies in great banks, and out of the rock the water of Lethe runs over pebbles and whispers, and that whisper is the only sound in the place. Hypnos lies at the center on a black ebony bed, and around him lie his sons in their thousands, waiting to be sent.","Each brother has his craft. Phobetor takes the shapes of beasts — the birds, the serpents, the thing running toward you down a corridor. Phantasos becomes what does not live: earth, water, wood, stone, the room that is your room but wrong. Morpheus takes people, and he takes them perfectly. Gait, gesture, the exact pitch of a voice, the particular way a person pauses before saying your name. He is the reason a dream of the dead does not feel like a symbol. It feels like a visit.","His great appearance comes when Alcyone, queen of Trachis, prays daily for her husband Ceyx's safe return, not knowing he has already drowned. Her prayers keep arriving at a temple for a man who no longer exists, and Hera, unwilling to let it continue, sends Iris down through the poppies to the cave. Morpheus is chosen for the errand. He puts on the drowned man — the soaked beard, the pallor, the water still running from his hair — and stands over Alcyone's bed to tell her plainly that he is dead and she should stop waiting. She wakes clawing at empty air. It is the cruelest kindness in the Metamorphoses, and it is entirely his work. He did not lie to her. He never does. He only makes the truth wear a face she loved."]}]},norse:{label:"Norse",blurb:"The Aesir in their high halls and the Vanir who came as hostages and stayed — two families of gods who fought a war, exchanged sons, and became one people. All of them live under a prophecy they already know the ending of.",deities:[{id:"odin",name:"Odin",epithets:"Allfather · Raven-God · The Hanged One · Aesir",domains:["Wisdom","War","Poetry","Runes","The Dead"],symbols:["Gungnir","Ravens","The Gallows","Sleipnir","The Missing Eye"],portrait:art("Odin.png"),portraitCaption:"Original artwork",intro:"I gave an eye for a drink from a well, and I would give the other one tomorrow. I hanged myself on the world-tree, spear in my own side, nine nights over a nothing that had no bottom, and no one fed me and no one gave me water — and at the end of it I screamed and took up the runes. That is what I am. Not a father who keeps you safe. A father who will trade anything, including you, for one more thing worth knowing.",myth:["Odin's hunger is for knowledge, and he has never once found the price too high. At the root of Yggdrasil lies Mimir's well, and its water holds understanding; Mimir asked for an eye, and Odin cut it out and dropped it in. Later he wounded himself with his own spear and hung nine days and nights from the world-tree, sacrificed to himself, until the runes rose out of the dark to meet him. Two ravens, Thought and Memory, fly out over the whole world each dawn and return to whisper what they saw. He fears losing Memory more.","He is not a comfortable god. He walks the roads of Midgard in a broad hat under names that are not his — Grimnir, Vegtam, the Wanderer — testing kings, provoking arguments, letting men hang themselves on their own answers. He learned seiðr, women's magic, and took the shame that came with it because the power was worth it. He stole the mead of poetry from the mountain by seducing the giant's daughter for three nights, drinking all three vats, and escaping as an eagle with it in his throat. Every poem since is what he spat out.","And he knows how it ends. That is the whole of him. The Valkyries bring the best of the slain to Valhalla and they fight all day and feast all night, and the sole reason for that army is a battle Odin has already been told he loses. Fenrir the wolf will swallow him. He gathers the einherjar anyway, and studies, and bargains, and hunts every scrap of knowledge that might buy him one more move — knowing the board is finished, refusing to stop playing."]},{id:"frigg",name:"Frigg",epithets:"Queen of Asgard · Lady of Fensalir · She Who Knows and Does Not Say · Aesir",domains:["Foresight","Marriage","Motherhood","Sovereignty","Silence"],symbols:["The Distaff","Spun Clouds","Keys","Mistletoe","The Marsh-Hall"],portrait:art("Frigg.png"),portraitCaption:"Original artwork",intro:"I know every fate that has ever been spun, including yours, including my son's, including the day my husband dies with a wolf's teeth closing over him. And I say nothing. Men take that for a wife's ignorance. It is not. It is the only discipline I have left. I sat in my hall and I heard what was coming for my bright boy, and I went out and I asked the whole world to swear it would not hurt him — and I still lost him. Ask what you like. I have already heard the question.",myth:["Frigg sits in Fensalir, the marsh-halls, and spins. It is said the clouds are her work, drawn out and let go. She has the same sight Odin travels the worlds to buy, and she came by it without paying — she knows the fate of every living thing and speaks it to no one. Even Odin cannot pull it out of her. In the old poems the two of them wager over the destinies of kings, and she wins by moving quietly while he argues.","Her great story is a mother's. Baldr, her son, began to dream of his own death, and Frigg would not accept it. She went out across the nine worlds and took an oath from everything that exists — fire, iron, stone, sickness, the beasts, the trees — that none of them would harm him. It worked. The gods made a game of it, throwing spears at Baldr and watching them refuse to land. Only one thing had gone unasked: a mistletoe sprig west of Valhalla, too young and too small to be worth an oath.","Loki learned it. He put mistletoe in the hand of blind Höðr, Baldr's own brother, and pointed. When Hermóðr rode to Hel to beg for Baldr back, the answer was that all things living and dead must weep for him, and all things did — except one giantess who would not, and so Baldr stayed below. Frigg goes on spinning. She is the only one in Asgard who knew the whole shape of it before it happened, and had to watch it happen anyway."]},{id:"thor",name:"Thor",epithets:"Thunderer · Friend of Man · Warder of Midgard · Aesir",domains:["Thunder","Storm","Strength","Protection","Oaths"],symbols:["Mjölnir","Iron Gloves","The Belt of Might","Goats","The Oak"],portrait:art("Thor.png"),portraitCaption:"Original artwork",intro:"My father collects the clever ones. I am not that, and I stopped minding a long time ago. When something crawls out of Jotunheim toward the farms of men, nobody sends a riddle at it. They send me. I have eaten a whole ox and drunk a sea and worn a wedding dress to get my hammer back, and I would do the last one again tomorrow, because the alternative was giants holding it. Say what you came to say. I have no patience but I have a great deal of time.",myth:["Thor is the most-loved god in the north, and it is not close. Odin took the kings and the poets; Thor took everyone else — the farmers, the sailors, the people who needed something between them and the dark. His hammer Mjölnir was forged by dwarves and came out with a short handle because Loki, as a fly, stung the smith's eyelid at the wrong moment. It never misses and it always returns. He wears iron gloves to hold it and a belt that doubles his strength, and his chariot is drawn by two goats he can kill, eat, and wake again in the morning if the bones are kept whole.","His adventures are mostly humiliations he walks straight through. At Utgard he was set three contests and lost all three: he could not drain a drinking horn, could not lift a grey cat off the floor, could not out-wrestle an old woman. Then his host admitted the horn was the sea, and Thor had visibly lowered it; the cat was the world-serpent, and Thor had pulled it up by one paw; the old woman was age itself, and no one has ever beaten her. He was so angry at being tricked that he reached for the hammer and the whole hall vanished.","The serpent is his real business, and it is unfinished. He once hooked Jörmungandr on an ox-head while fishing, hauled it thrashing to the gunwale, and had the hammer raised when the terrified giant beside him cut the line. They will meet again at Ragnarok. Thor will kill it — that much is promised — and then walk nine paces through its venom and fall. He knows. He is going anyway, which in the north is the entire definition of courage."]},{id:"sif",name:"Sif",epithets:"Golden-Haired · Lady of the Harvest · Aesir",domains:["Harvest","Grain","Family","Prosperity","Endurance"],symbols:["Golden Hair","Sheaves of Wheat","The Rowan","The Loom"],portrait:art("Sif.png"),portraitCaption:"Original artwork",intro:"Loki cut my hair off while I slept. That is how most people know me — as a woman something was done to. Let me give you the rest. What he had to do to survive my husband's answer was go beneath the earth and set two families of dwarves against each other in a wager, and what came up out of that forge was my hair in living gold, a ship that folds into a pocket, a spear that never misses, and the hammer that guards the nine worlds. All of it exists because someone hurt me and had to make it right.",myth:["Sif is Thor's wife, and the sources are frustratingly thin on her, which has never stopped anyone from noticing what her name and her hair are doing. Sif means kinship, the bond of marriage and family itself. Her hair is gold and long and falls like a field ready to be cut, and the association is not subtle: she is the grain, the harvest, the year's yield standing in the sun.","The one story told at length is the shearing. Loki, for no reason he could later explain, crept up and cut off all her hair while she slept. Thor caught him and was going to break every bone in his body one at a time, and Loki bought his life with a promise: he would get her hair back, better. He went down to Svartalfheim and set the sons of Ivaldi to work, then goaded the smith Brokkr into a bet with his own head as the stake.","What came out of that forge changed everything. Golden hair that grew from her scalp as if it had always been hers. Skidbladnir, Freyr's ship. Gungnir, Odin's spear. Gullinbursti the golden boar, Draupnir the ring that drips more rings, and Mjölnir. The dwarves won the bet and Loki kept his head only on a technicality about his neck — but the treasures that arm the gods against Ragnarok all trace back to an insult done to a sleeping woman."]},{id:"loki",name:"Loki",epithets:"Sky-Traveller · Father of Monsters · Blood-Brother to Odin · Jotun-Born",domains:["Cunning","Change","Fire","Mischief","Endings"],symbols:["The Salmon","The Falcon Cloak","Knotted Nets","Bound Chains","The Serpent"],portrait:art("Loki.png"),portraitCaption:"Original artwork",intro:"I am not one of them and I never was. Giant-born, and Odin opened his own vein and mixed it with mine anyway, so now they have to seat me. I got them the hammer. I got them the walls of Asgard for free. I got them the spear and the ship and the ring, and every single time it was because I had first done something unforgivable. That is the arrangement. They keep me because I solve what nobody else can, and they hate me because they know exactly what I am, and so do I.",myth:["Loki is a giant by blood who eats at the table of the gods, sworn brother to Odin himself, and the mechanism by which almost every story in the north actually moves. He shifts shape without effort — salmon, fly, falcon, seal, old woman. As a mare he lured away the stallion of the builder who nearly won Freyja and the sun and the moon as payment for Asgard's walls, and months later returned with Sleipnir, the eight-legged horse, which he had borne himself. He is the father of the wolf Fenrir, the world-serpent Jörmungandr, and Hel who rules the dead.","For a long time he is merely dangerous. Then he kills Baldr, and there is no coming back from it. He finds the one thing that never swore the oath, puts it in a blind brother's hand, guides the aim. When the whole of creation is asked to weep Baldr out of the underworld, a giantess named Thökk refuses — and everyone knows who Thökk was. At the feast in Aegir's hall he goes around the room and tells every god present the worst true thing about themselves, and no one can answer him, because none of it is a lie.","So they hunt him. He builds a house with four doors to watch every direction, and invents the fishing net while thinking about how he might be caught, and throws it in the fire when they come — and they read the ash. He becomes a salmon; Thor catches him by the tail. They take his son Narfi, and bind Loki with his entrails turned to iron, and hang a serpent to drip venom on his face. His wife Sigyn stands there with a bowl. When she turns to empty it the venom lands, and he convulses, and the earth shakes. He is still there. At Ragnarok he gets loose, and he steers the ship of the dead against them, and he and Heimdall kill each other on the field."]},{id:"baldr",name:"Baldr",epithets:"The Shining · The Beloved · He Who Comes Back · Aesir",domains:["Light","Beauty","Innocence","Grief","Return"],symbols:["Mistletoe","The Ship Ringhorn","White Flowers","The Pyre"],portrait:art("Baldr.png"),portraitCaption:"Original artwork",intro:"I started dreaming badly. That is how it began — not a prophecy carved in a stone, just a young god sleeping poorly and telling his mother about it. She emptied herself to save me. Every stone and every sickness and every blade in the nine worlds swore. And I died in a field with my brother's hand on the dart and everyone laughing, because it was a game right up until it wasn't. Do not pity me. I am the only one of them who is promised a world afterward.",myth:["Baldr is the best-loved of the Aesir and the one whose death breaks the age. His troubles begin with dreams — night after night of his own ending — and when he tells them, Odin himself rides down to the underworld and wakes a dead seeress to ask what they mean. She tells him a bed stands ready and the mead is already brewed for Baldr's arrival. Frigg then goes out and takes an oath of harmlessness from everything that exists, missing only one sprig too young to bother with.","What follows is the cruellest scene in the north, because it is played as comedy. The gods stand Baldr up in the assembly field and throw things at him — stones, axes, spears — and everything swerves aside, and they roar with laughter at the game of it. Loki puts mistletoe into the hands of Höðr, Baldr's blind brother, who has been standing at the edge unable to join in, and offers to guide his aim so he can take part too. The dart goes through him. The laughing stops.","They burn him on his own ship Ringhorn, so heavy with grief that a giantess had to be sent for to launch it, and his wife Nanna's heart gives out at the sight and she burns beside him. Hermóðr rides nine nights down to Hel to bargain, and is told Baldr may return if every single thing in creation weeps — and every single thing does, except one giantess in a cave who says she will weep dry tears and let Hel keep what she has. But after Ragnarok, when the fire is out and the water goes down, Baldr walks up out of the underworld into the new green world with his brother beside him, and they find the old gold gaming pieces lying in the grass."]},{id:"tyr",name:"Tyr",epithets:"The One-Handed · Keeper of Oaths · God of the Thing · Aesir",domains:["Justice","Law","Oaths","Courage","War"],symbols:["The Missing Right Hand","The Spear","The Assembly","Fetters"],portrait:art("Tyr.png"),portraitCaption:"Original artwork",intro:"A wolf was growing in our hall faster than anything should grow, and we knew what it was for. We had a ribbon made of impossible things and we needed him to let us put it on. He was not stupid. He said he would allow it if one of us laid a hand in his mouth as surety — and every god there looked at the floor. I have thought about this for a long time and the answer has not changed: an oath you will not pay for was never an oath. So I put it in. And when the ribbon held, he bit.",myth:["Tyr is the god of the assembly and the sworn word, older than the tales that survive — his name is the oldest of all the Norse gods' names, and it once simply meant god. By the time the stories were written down he had been pushed to the margins by Odin, but the law is still his, and so is the particular courage of doing the thing that costs you.","Fenrir, Loki's wolf-son, was raised inside Asgard because the gods thought they could keep an eye on him. He grew until only Tyr would go near enough to feed him. Two chains were made and the wolf snapped both, enjoying himself. So the dwarves made Gleipnir out of things that do not exist — a cat's footfall, a woman's beard, a mountain's roots, a bear's sinews, a fish's breath, a bird's spit — soft as silk and unbreakable. Fenrir looked at it and knew, and said he would only be bound if a god's hand rested in his jaws.","Tyr gave his sword hand. The wolf strained, and the cord tightened, and Fenrir understood he had been cheated by everyone in the room — and he closed his mouth. The gods laughed with relief. Tyr did not. He is a war-god who cannot hold a weapon properly for the rest of the world's life, and he paid it knowing the price in advance, which is the only kind of payment that counts. At Ragnarok he goes against the hound Garmr, and they kill each other."]},{id:"heimdall",name:"Heimdall",epithets:"The White God · Watcher on Bifrost · Bearer of the Horn · Aesir",domains:["Vigilance","Boundaries","Sight","Hearing","Beginnings"],symbols:["Gjallarhorn","The Rainbow Bridge","Golden Teeth","The Ram"],portrait:art("Heimdall.png"),portraitCaption:"Original artwork",intro:"Nine mothers bore me at the edge of the world and I have not properly slept since. I need less rest than a bird. I can see a hundred leagues by night as easily as by day, and I can hear wool growing on a sheep and grass pushing up through soil — which sounds like a gift until you understand it never stops. I stand on the burning bridge with a horn at my hip. One day I will blow it. Until then I do the only work there is: I watch, and I do not look away.",myth:["Heimdall stands at the end of Bifrost, the trembling rainbow road between Asgard and everything below, and his whole existence is the watch. Nine giant mothers bore him — sisters, at the world's rim, out of the sea — and he was fed on the strength of the earth and the cold of the sea and the heat of the sun. He has gold teeth. He requires less sleep than a bird and hears grass grow, wool lengthen on a living sheep, the smallest wrong sound in the nine worlds.","There is another side to him that the war-stories bury. In one poem he walks into Midgard under the name Ríg and stays three nights in three houses — a poor one, a working one, a fine one — and in each he sleeps between the couple, and in each a son is born after: Thrall, Farmer, and Earl. The whole ordering of human society is traced back to a god who went out among people and lay down in their beds. He is called the father of mankind for it.","His horn Gjallarhorn is the loudest sound there will ever be, and he sounds it once, at the end, when the sky splits and the ships come. His enemy is fixed and has always been fixed. He and Loki have circled each other since they fought as seals over the Brísingamen, and on the last field they find one another and neither walks off it — the watchman and the one who was always going to get past him, killing each other at the same moment."]},{id:"bragi",name:"Bragi",epithets:"Long-Bearded · God of Skalds · First Voice of the Hall · Aesir",domains:["Poetry","Eloquence","Music","Memory","Welcome"],symbols:["The Harp","Runes on the Tongue","The Mead Cup","The Long Beard"],portrait:art("Bragi.png"),portraitCaption:"Original artwork",intro:"Runes are cut into my tongue. Not written about, not studied — cut, into the meat of it, which is a thing you should think about before you tell me poetry is decoration. I greet the dead when they come through the door of Valhalla, and I have greeted a great many, and for most of them I am the last new voice they will ever hear. So I choose my words. A hall with no poet in it is a hall where everything that happened is forgotten by spring.",myth:["Bragi is the skald of the gods, the finest speaker among them, husband of Idunn who keeps the apples of youth. In a culture with no written history to speak of, the poet was not an ornament — he was the record. A deed with no verse about it simply ceased to exist within a generation. Bragi is that function made divine: runes carved into his tongue, wisdom in the shape of arranged sound.","He stands at the door of Valhalla and welcomes the honoured dead as they arrive, which is a strange and gentle office in a hall built for slaughter. When a great king came, Odin would send Bragi out to meet him. The last courtesy the einherjar receive on their way in is a poem.","The mead he serves is not ordinary. It was brewed from the blood of Kvasir, the wisest being ever made, murdered by dwarves who mixed him with honey; whoever drinks it speaks poetry and cannot help it. Odin stole it back out of a mountain. That is the lineage of every verse: a wise man killed, a theft, and a god who carried it home in his throat — which tells you the north never once thought poetry was a soft thing."]},{id:"idunn",name:"Idunn",epithets:"Keeper of the Apples · The Ever-Young · Aesir",domains:["Youth","Renewal","Spring","Healing","Continuance"],symbols:["The Ash Box","Golden Apples","Blossom","The Nut"],portrait:art("Idunn.png"),portraitCaption:"Original artwork",intro:"Every god you have ever heard of is alive because I open a box each morning. That is not a boast, it is maintenance. They forget it entirely — until the day I was carried off, and within a season the whole shining company of Asgard was grey and stooped and shaking in their chairs, and then they remembered my name very quickly indeed. Immortality is not a property they own. It is a thing handed to them daily by someone they do not think about.",myth:["Idunn keeps an ash box of golden apples, and the gods eat from it to stay young. Not symbolically — functionally. The Aesir are not naturally deathless; their agelessness is a supply, and she is the supply line. She is Bragi's wife, and she is described as the gentlest of them all, which makes what happens to her worse.","Loki, cornered by the giant Thjazi in eagle form, bought his freedom by promising to deliver her. He told Idunn he had found apples in a wood outside the walls finer than her own and coaxed her out to compare them, box in hand. Thjazi came down and took her. In Asgard the effect was immediate and horrifying: the gods aged. Their hair went white, their hands shook, the light went out of the hall.","They worked out who had been seen with her last. Loki, threatened with death again, borrowed Freyja's falcon cloak, flew to Thjazi's hall, turned Idunn into a nut and carried her home in his claws with the giant's eagle-shape roaring behind him. The Aesir piled wood-shavings on the walls and fired them the instant Loki crossed, and Thjazi's wings burned and he came down inside Asgard and was killed. His daughter Skadi came for weregild, armed — but Idunn was back, and so was the morning ration, and everyone went on pretending they had never nearly died of old age."]},{id:"vidar",name:"Vidar",epithets:"The Silent · The Avenger · Heir of the New World · Aesir",domains:["Silence","Vengeance","Endurance","Wild Places","Survival"],symbols:["The Thick Shoe","Deep Forest","The Unspoken Vow"],portrait:art("Vidar.png"),portraitCaption:"Original artwork",intro:"You want stories. I have one, and it has not happened yet. There is a shoe being made for me, and it has been made my whole life, out of every scrap of leather every person in every world has ever cut from a toe or a heel and thrown away. Save your offcuts. When the wolf has finished swallowing my father, I will put that foot in his lower jaw and take the upper in my hands and open him. I am not slow. I am not simple. I am saving it.",myth:["Vidar is called the silent god, and he is nearly as strong as Thor. His mother was the giantess Gríd, and his halls are described as growing wild — brushwood and tall grass, a god of the untended places rather than the built ones. He says almost nothing in any surviving poem. Everything about him points forward.","His shoe is one of the strangest objects in Norse myth. It is being assembled continuously out of the waste leather trimmed from the toes and heels of shoes by everyone, everywhere, across all the ages of the world. The sources add a practical instruction: anyone who cares about the gods should deliberately throw those scraps away rather than use them, because the material is going toward that shoe, and that shoe is going to matter more than anything they could make with it.","At Ragnarok, Fenrir breaks loose with his lower jaw against the ground and his upper against the sky, and he swallows Odin. Vidar steps forward and sets that thick foot into the wolf's bottom jaw — which is what the shoe was always for, to hold against those teeth — grips the upper, and tears the mouth apart. And then, when the fire dies and the earth comes green out of the water, Vidar is among the handful who walk into the new world: the silent one, who spent the entire life of creation waiting, and outlasted it."]},{id:"njord",name:"Njord",epithets:"Lord of Noatun · Giver of Wealth · Calmer of Sea and Fire · Vanir",domains:["Sea","Wind","Wealth","Fishing","Safe Voyage"],symbols:["The Harbour","Nets","Sea-Gulls","The Keel","Gold"],portrait:art("Njord.png"),portraitCaption:"Original artwork",intro:"I was a hostage. That is not the word they use in the hall, but it is the word. Two families of gods fought until neither could win, and the peace was made by trading sons — mine went one way, theirs came the other, and I have lived among the Aesir ever since as a treaty with a face. Pray to me and I will fill your nets and hold the wind steady until you are home. I know exactly what it is to want to get home.",myth:["The Aesir and the Vanir went to war — the Vanir older, tied to the land and the sea and the getting of wealth, the Aesir tied to war and sky and law. Neither side could finish it. The peace was sealed in the oldest way available: an exchange of hostages. Njord came to Asgard with his son Freyr and his daughter Freyja, and the Aesir sent their own the other way. He is a Vanir god living permanently in an Aesir hall, and he is the one they pray to for a safe crossing and a full hold.","His hall is Nóatún, the ship-enclosure, at the water's edge. He governs the wind's direction, quiets sea and fire, and the north was blunt about what he was for: he is the god who makes people rich. A fishing people and a trading people do not separate the sea from wealth, and Njord sits exactly where the two meet.","His marriage is the best small story about him. Skadi came to Asgard armed, demanding payment for her father's death, and was offered a husband — chosen by looking only at the gods' feet. She picked the most beautiful pair, expecting Baldr, and got Njord, whose feet were clean and lovely from the sea. They tried. Nine nights in her mountains, where he could not sleep for the howling of wolves; nine in his harbour, where she could not sleep for the shrieking of gulls at dawn. Then they agreed, without much bitterness, that it could not be done, and each went home."]},{id:"freyr",name:"Freyr",epithets:"Lord · Bright One of the Elves · The Sword-Giver · Vanir",domains:["Fertility","Harvest","Peace","Sunshine","Kingship"],symbols:["Gullinbursti","Skidbladnir","The Antler","Rain","The Boar"],portrait:art("Freyr.png"),portraitCaption:"Original artwork",intro:"I sat in the high seat that shows you every world at once — which I had no right to do — and I looked north and saw a giant's daughter raise her arms, and the light came off them across the sea and the sky. I could not eat after that. I could not sleep. I gave away my sword, the one that fights by itself, to have her. Everyone tells me it was a catastrophe and they are right, and at the end of everything I will stand against a fire-giant holding a stag's antler. I would do it again. Ask my sister what love is worth; she will tell you the same.",myth:["Freyr is the great giver of the Vanir — peace, good harvests, rain and sun in the right order, and the plain fertility of fields and bodies and herds. When he cut his first tooth the gods gave him Alfheim, the world of the light elves, as a teething gift. The dwarves made him Gullinbursti, a boar of gold whose bristles light the dark, and Skidbladnir, a ship that always finds a fair wind and folds up small enough to carry in a pouch. In Sweden he was a founding king as much as a god.","His story is a love story that costs too much. From Odin's high seat Hlidskjalf he saw Gerd, a giant's daughter, and the light of her arms lit sea and air, and he went home sick with it and would not speak. His servant Skírnir was sent to court her on his behalf and took Freyr's sword as the price of going — the blade that swings on its own against the giants. Gerd refused gifts, refused gold, and only agreed when Skírnir began carving curses in runes and promising her a life of nothing.","So Freyr won her, and the north remembered that he did it by disarming himself. At Ragnarok, Surt comes out of Muspelheim with a sword like the sun, and Freyr meets him with what he has left — an antler, in some tellings, or his bare hands — and falls, and the fire he might have held back takes the world. The gods of harvest and peace are not weak in Norse myth. They are simply spent on something, the way a harvest is."]},{id:"freyja",name:"Freyja",epithets:"Lady · Mistress of Seiðr · She Who Takes Half the Slain · Vanir",domains:["Love","Desire","War","Magic","The Dead"],symbols:["Brísingamen","The Falcon Cloak","Cats","Amber","Tears of Red Gold"],portrait:art("Freyja.png"),portraitCaption:"Original artwork",intro:"They will tell you I am the goddess of love, and then look surprised when they learn where half the battlefield goes. Odin takes his share of the slain. I take mine first. I brought seiðr into Asgard and taught it to the Allfather himself, and he took the shame of learning women's work because the power was worth it — I want you to sit with that. I weep gold for a husband who wandered off, and I go looking for him under other names, in a cat-drawn chariot, wearing a necklace I did not pay for in coin.",myth:["Freyja is the most-invoked goddess of the north and the least tidy. Love and desire are hers, yes — but so is battle: of those who die in war, she chooses first and takes half to her field Fólkvangr, and Odin gets the remainder for Valhalla. That order matters, and the poems state it plainly. She rides in a chariot pulled by cats, owns a cloak of falcon feathers that lets its wearer fly, and weeps tears of red gold for Óðr, her husband, who goes away and does not come back, so that she travels among unknown peoples under false names looking for him.","She brought seiðr — the shifting, seeing, fate-bending magic — to the Aesir, and taught it to Odin. In a culture where that craft carried real stigma for men, the Allfather learned it anyway from her, which places Freyja at the source of the deepest power the chief of the gods possesses.","Her necklace Brísingamen she obtained from four dwarves who would take no other payment than four nights, one with each, and the poems report it without much fuss; when Loki stole it, Heimdall fought him in seal-shape to get it back. Giants ask for her constantly as the price of doing anything for the gods, and the gods keep almost agreeing until Thor is sent to deal with it — once in a wedding dress and veil, pretending to be her, eating an entire ox at his own bridal feast before the hammer was laid in his lap."]},{id:"skadi",name:"Skadi",epithets:"The Ski-Godde
