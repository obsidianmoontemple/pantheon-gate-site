ss · Lady of Winter · She Who Came Armed · Jotun of the Aesir",domains:["Winter","Hunting","Mountains","Vengeance","Independence"],symbols:["Skis","The Bow","Snowshoes","Wolves","The High Peaks"],portrait:art("Skadi.png"),portraitCaption:"Original artwork",intro:"They killed my father, and I did not send a message. I put on mail and took my weapons and walked into Asgard alone to collect. They offered me terms, and one of the terms was that they had to make me laugh — a thing I would not have thought possible that week, and they managed it, and I hated that they managed it. I took a husband out of the settlement and gave him back. The mountains I kept. I am the only one in this hall who arrived as an enemy and stayed on my own terms.",myth:["Skadi is a giantess, daughter of Thjazi, who died in Asgard's flames after stealing Idunn. She did not petition. She armed herself and came to the gods' stronghold by herself to take weregild for her father, and she was formidable enough that they negotiated rather than fought.","The settlement had three parts and each is stranger than the last. She could choose a husband from among the gods, but only by their feet — she chose the finest pair, certain they belonged to Baldr, and got Njord of the sea. They had to make her laugh, which no one could manage until Loki tied one end of a cord to a goat's beard and the other to himself and the two of them shrieked and hauled at each other until Skadi broke, and then he fell into her lap. And Odin took her father's eyes and threw them into the sky as two stars.","The marriage failed on geography — nine nights of wolves howling in her mountains against nine of gulls screaming in his harbour — and she went back up to Thrymheim to hunt on skis in the high snow, which is where she had always belonged. She is the one who fixes the venom-serpent above the bound Loki's face. He had made her laugh once. It did not buy him anything."]},{id:"hel",name:"Hel",epithets:"Ruler of the Ninth World · Half-Living · Keeper of Those Who Were Not Slain · Daughter of Loki",domains:["Death","The Underworld","Judgment","Stillness","The Unheroic Dead"],symbols:["The Half-Dark Face","Éljúðnir","The Threshold","Naglfar"],portrait:art("Hel.png"),portraitCaption:"Original artwork",intro:"Odin threw me down here as a child because of a prophecy about what I would grow into. Then he gave me every soul in the nine worlds who does not die with a weapon in their hand — which is nearly all of them. Your grandmother is with me. So is the child who did not wake, and the man who lay ill for a long winter. They came here and they are not being punished. When a god's mother came to beg for her son back, I named my price and it was fair, and one creature in all of creation would not pay it. That was not my doing.",myth:["Hel is Loki's daughter, born in Jotunheim alongside the wolf and the serpent, and the gods took all three as infants because of what the seers said they would become. Fenrir they bound. Jörmungandr was thrown into the sea. Hel was cast down into Niflheim — and there Odin gave her authority over the ninth world and everyone who arrives in it. She is described as half a living woman and half a corpse, the line running straight down her, and grim to look at.","Her realm is not a hell in the later sense. There is no fire and no torture; it is cold and slow and quiet. She has a hall named Éljúðnir, damp with sleet, and her table and her knife and her servants all carry names meaning hunger, famine, and slowness. Those who die of sickness and of age come to her, which is to say almost everyone who has ever lived — the ordinary dead, who did not fall on a field and were never chosen by Odin or Freyja.","Her great scene is the bargaining over Baldr. Hermóðr rode nine nights down the dark road to ask for him back, and Hel did not refuse outright — she set a condition that was almost generous: if every single thing in the world, living and dead, wept for him, she would release him. The gods sent messengers everywhere and the whole of creation wept, except one giantess sitting in a cave who said she would weep dry tears and let Hel keep what was hers. So Baldr stayed. At the end of the age Hel's dead sail out, and Naglfar, the ship built from the untrimmed nails of the dead, comes loose from its moorings at last."]}]},egyptian:{label:"Egyptian",blurb:"Older than almost anything else still spoken aloud. Every night the sun goes down into the underworld and has to fight its way out, and every morning it does — but only because the gods hold the line against the dark. Order is not the natural state here. It is the work.",deities:[{id:"ra",name:"Ra",epithets:"Lord of the Two Horizons · He Who Sails the Night · Of Heliopolis",domains:["The Sun","Creation","Kingship","Order","Endurance"],symbols:["The Solar Disc","The Barque of Millions of Years","The Falcon Head","The Uraeus"],portrait:art("Ra.png"),portraitCaption:"Original artwork",intro:"Every evening I die in the west. Every night I sail a river under the world where a serpent the length of the dark waits to swallow my boat, and every morning I am born again in the east as an infant who does not remember doing this before. I have done it more times than there are grains of sand in this country. You call it sunrise. I call it what it is — a shift, worked without relief since before there was anyone to be grateful for it.",myth:["In the beginning there was Nun, a black endless water with nothing in it. Out of that water rose a single mound, and on the mound stood Ra, the first thing that had ever been alone. From himself he brought forth Shu the air and Tefnut the moisture; from them came Geb the earth and Nut the sky; from them the gods of the great story that follows. He wept once, and where the tears fell, human beings stood up. In Egypt, people are the tears of the sun.","His day is a voyage. He crosses the sky in the barque of millions of years, and at dusk he enters the Duat and travels its twelve hours, one for each hour of night, passing gate after gate. Waiting there is Apep, the serpent of unmaking, who is not evil in the way a villain is evil — Apep simply wants everything to stop. The crew of the boat fight it every night, and every night they win, and none of it is ever permanently settled. Dawn is not a promise. It is a result.","And he grew old. His bones turned to silver and his flesh to gold and his hair to lapis, and he dribbled, and Isis gathered the spittle from the ground, mixed it with earth and formed a serpent that bit him with a poison no one could name — because the poison was made of him. She held the cure hostage until he gave up his secret name, and with it, the power behind everything. He surrendered it. Even the sun could be outplayed, once, by someone who wanted something more than he wanted to keep it."]},{id:"amun",name:"Amun",epithets:"The Hidden One · He Whose Name Is Concealed · Of Thebes",domains:["Hiddenness","Wind","Creation","Kingship","The Unseen"],symbols:["Twin Plumes","The Ram","The Blue Skin","Empty Air"],portrait:art("Amun.png"),portraitCaption:"Original artwork",intro:"You cannot see me. That is not modesty and it is not a trick — it is the entire content of what I am. My name means the hidden, and the priests who served me for two thousand years wrote openly that no god knows my true form, and that anyone claiming to have seen it is lying. I am the wind you cannot look at, moving things you can. Ask me questions. You will find my answers are the same shape as me.",myth:["Amun begins small — one of eight primordial beings at Hermopolis, a god of air and hiddenness in a set of paired forces representing the state of things before creation. He should have stayed a minor figure. Instead, when Thebes rose to rule Egypt, its local god rose with it, and Amun became the most powerful deity in the country, with a priesthood so wealthy it could challenge pharaohs.","He then did something none of the others managed: he merged with the sun without losing himself. As Amun-Ra he became both the hidden and the visible, the concealed principle and the blazing disc, which the theologians of Thebes treated as the highest possible statement about divinity — that what you see of a god is the smallest part of it. Hymns to him insist that his real nature is unknown even to the other gods, and that this unknowability is not a gap in the record but the point.","His great house at Karnak grew for centuries, each pharaoh adding to it, until it became the largest religious structure ever built. And when Akhenaten tried to erase him — closing the temples, chiselling his name off every wall in Egypt in favour of a single visible sun-disc — Amun outlasted him by a matter of years. The hidden god turned out to be very difficult to delete, which he would say was predictable."]},{id:"ptah",name:"Ptah",epithets:"He Who Made With Heart and Tongue · Master of Craftsmen · Of Memphis",domains:["Creation","Craft","Architecture","Speech","Making"],symbols:["The Was-Sceptre","The Djed Pillar","The Skullcap","The Potter's Hands"],portrait:art("Ptah.png"),portraitCaption:"Original artwork",intro:"Others will tell you the world came out of a flood, or an egg, or a god's own body. I thought of it, and then I said it, and it was there. That is the whole method. Understand what that means for you: everything you have ever built existed first as a shape in your head and then as a word in your mouth, and only then in your hands. You are working the way I work. I am the patron of every mason and every carpenter in this country because I do not consider what they do to be lesser than what I did.",myth:["The priests of Memphis made an argument that is still remarkable. Other creation stories are physical — the sun masturbating the world into being, a mound rising from water, a cosmic egg. Ptah's is intellectual. He conceived creation in his heart, which the Egyptians held to be the seat of thought, and then spoke it with his tongue, and existence followed the utterance. Thought, then word, then thing. It predates every later doctrine that begins with a word by a very long time.","He is shown wrapped tight like a mummy, holding a staff that combines dominion, stability and life, with a straight beard and a plain blue skullcap. He does not have an animal head. Among all these hawks and jackals and crocodiles, Ptah stands there looking like a man, which suits a god whose domain is making things properly.","Craftsmen were his. The artisans who cut the royal tombs lived in a village and worked under his patronage, and the high priest of Memphis carried the title Greatest of the Directors of Craftsmanship. The Greeks matched him to Hephaestus without hesitation. And in one of the odder pieces of linguistic history, one name for his temple compound — hwt-ka-ptah, the house of the spirit of Ptah — was borrowed by the Greeks, bent into Aigyptos, and became the word Egypt."]},{id:"thoth",name:"Thoth",epithets:"Lord of Divine Words · Reckoner of Time · Of Hermopolis",domains:["Writing","Wisdom","The Moon","Judgment","Magic"],symbols:["The Ibis","The Reed Pen","The Palette","The Baboon","The Lunar Crescent"],portrait:art("Thoth.png"),portraitCaption:"Original artwork",intro:"I invented writing, which means I am responsible for every lie that has outlived the liar and every truth that survived the person who knew it. I keep the record at the weighing of the heart. I do not decide anything there — people find that disappointing. I write down what the scale does. And I would rather be exactly right about a small thing than approximately right about a large one, which is a temperament, not a limitation.",myth:["Thoth is the scribe and the measurer, ibis-headed or in the form of a baboon, and his domain is everything that can be recorded: writing, mathematics, astronomy, medicine, the calendar, the arts of magic. The Egyptians credited him with the invention of hieroglyphs themselves — divine words, not merely marks. In the hall of judgment he stands at the balance with his palette and notes the result while Anubis works the scale and Ammit waits.","His cleverest act was a card game against the moon. Nut had been cursed so she could not give birth on any day of the year, and the year had exactly three hundred and sixty days. Thoth sat down to play senet with the moon and won, over and over, taking a portion of its light each time — until he had assembled five whole days that belonged to no year at all. On those five days Nut bore Osiris, Horus the Elder, Set, Isis and Nephthys. The moon has waxed and waned ever since because it is short.","He is also the one who repairs things. When Set tore out Horus's eye, it was Thoth who restored it, and the restored eye — the wedjat — became the most common protective symbol in Egypt, worn by the living and painted on coffins. He arbitrates the endless quarrel between Horus and Set with visible exhaustion. He is the god you want in the room when two more powerful beings are wrecking the place, because he is the only one taking notes."]},{id:"maat",name:"Maat",epithets:"The Feather of Truth · Ma'at, Order Itself · Daughter of Ra",domains:["Truth","Justice","Cosmic Order","Balance","Reciprocity"],symbols:["The Ostrich Feather","The Scales","The Plinth","The Outstretched Wings"],portrait:art("Maat.png"),portraitCaption:"Original artwork",intro:"I am not a judge. A judge has opinions. I am the standard against which the thing is set, and I do not change to accommodate whoever is standing in front of me — that would make me useless, and being useful is all I am for. Your heart goes on one side. I go on the other. I weigh almost nothing, which surprises people. It is very easy to be heavier than the truth.",myth:["Maat is the principle that the whole of Egyptian thought rests on: order, truth, balance, the right ordering of things, the reciprocity that holds a society and a cosmos together. Her opposite is isfet — chaos, injustice, violence, falsehood — and the Egyptian universe is not a place where order naturally prevails. It is a place where order is maintained, at cost, continuously, or it fails.","This made her the actual job description of every pharaoh. A king's duty was to uphold maat and drive back isfet, and the standard offering a king made to the gods was a small figure of Maat herself, held up in the palm — the sovereign presenting order back to the powers who granted it. When the state collapsed, Egyptians did not describe it politically. They said maat had gone out of the land.","At the weighing of the heart she is present as a single ostrich feather. The heart of the dead, which held their character and their deeds, was set on one pan and the feather on the other. Balance meant passage into the fields beyond. Heavier meant Ammit, waiting beside the scale, and the second death from which there is no return. Not fire, not torment — simply ceasing, permanently, which the Egyptians found far more frightening."]},{id:"osiris",name:"Osiris",epithets:"Lord of the Silent Land · He Who Is Permanently Benign · First of the Westerners",domains:["The Dead","Resurrection","Fertility","Judgment","Kingship"],symbols:["The Crook and Flail","The Atef Crown","Green Skin","The Djed","Wheat"],portrait:art("Osiris.png"),portraitCaption:"Original artwork",intro:"My brother built a beautiful box, sized secretly to my body, and offered it at a feast to whoever it fitted. I climbed in laughing. Everyone did. Understand that I am not bitter about this — bitterness is a living man's luxury, and I have been dead a very long time. I was cut into pieces and scattered across the whole of this country, and my wife found nearly all of them, and now I rule everything beneath. Whatever you have lost, I have been more thoroughly taken apart than you.",myth:["Osiris was king, and a good one — the story says he taught agriculture, law, and the worship of the gods, and Egypt prospered. His brother Set could not bear it. Set took his measurements in secret, had a chest made to fit him exactly, and at a banquet offered it to whichever guest it suited. When Osiris lay down in it, Set slammed the lid, sealed it with lead and threw it into the Nile.","Isis searched and found it lodged in a tree at Byblos that had grown around it. She brought him home — and Set found the body, and this time cut it into fourteen pieces and scattered them the length of Egypt so that no one could gather him again. Isis did anyway. She and Nephthys hunted every piece and found all but one, which a fish in the river had eaten, and she made a replacement, and with her magic she held him together long enough to conceive Horus.","He did not come back to the living world. Instead he became lord of the one below, and his death made him something better than a king: the guarantee. Because Osiris died and continued, the ordinary dead could too. Every mummy was prepared in imitation of him, addressed by his name in the rites. He sits in the hall of judgment, green as new growth, holding the crook and the flail, waiting for the scale to settle — and in the fields where the grain comes up each year, the Egyptians saw the same thing happening again."]},{id:"isis",name:"Isis",epithets:"Great of Magic · She Who Knows the Secret Name · Mistress of the Throne",domains:["Magic","Healing","Motherhood","Cunning","Devotion"],symbols:["The Throne Headdress","Outspread Wings","The Tyet Knot","The Kite","The Scorpion"],portrait:art("Isis.png"),portraitCaption:"Original artwork",intro:"People come to me expecting the grieving widow and the good mother. I am both, and you should know what I did with them. I made a serpent out of the sun's own drool and set it in his path, and when the poison took him and no god in creation could name it — because I had made it out of him and told no one — I sat beside the greatest power that has ever existed and refused him the cure until he handed me his true name. He gave it to me. Love is not the opposite of ruthlessness. In my hands they were the same instrument.",myth:["Isis is the mistress of heka — magic, the force that gods themselves use — and the sources call her more clever than a million gods. When her husband Osiris was murdered and scattered, she turned herself into a kite and flew the length of Egypt searching, and the sound of her wings beating over the pieces is the sound of mourning. She reassembled him, and by her own power conceived a son from a dead man.","Then she hid. Pregnant, hunted by Set, she went into the papyrus marshes of the Delta and bore Horus in secret, and raised him there among reeds and scorpions with no throne and no protection. When the infant was stung and dying, she stopped the sun's boat in the sky and would not let it move until Thoth came down and gave her the words that would cure him. This is the source of her hold on ordinary Egyptians: every mother with a sick child had a goddess who had done exactly that and had not been polite about it.","The theft of Ra's name is her defining act. Ra had grown ancient and drooled, and Isis gathered the spittle and earth, formed a snake, and left it where he walked. It bit. The venom was made from his own substance so no counter-spell could touch it, and Isis offered to heal him — for the one thing he had never given anyone. He tried to fob her off with a list of titles. She waited. And eventually the sun surrendered his secret name to her, and she has held it ever since."]},{id:"set",name:"Set",epithets:"Lord of the Red Land · He Who Stands at the Prow · Great of Strength",domains:["Chaos","The Desert","Storms","Violence","Necessary Defence"],symbols:["The Set Animal","The Was-Sceptre","Red Sand","The Spear at the Prow","The Thunderhead"],portrait:art("Set.png"),portraitCaption:"Original artwork",intro:"You already know what I did to my brother. Nobody arrives here without that. So let me give you the part nobody bothers with: every night, on the boat, when the serpent comes up out of the dark to eat the sun and end everything that has ever existed — it is me at the front with the spear. Not Thoth. Not Isis. Me. They needed something that could meet that, and there is only one of us who is made of what that takes. I am not the flaw in the design. I am the part of it nobody likes looking at.",myth:["Set is the desert, the red land beyond the black soil, and everything that comes with it: storms, drought, sudden violence, the foreign and the unassimilable. His animal is an animal nobody has identified — curved snout, squared ears, forked tail — an accurate depiction of something that does not exist. He murdered Osiris out of envy, sealed him in a chest, then dismembered him and scattered the pieces.","What followed was eighty years of contending with Horus for the throne, and it is not a dignified epic. The two of them turned into hippopotami and wrestled underwater. Set tore out Horus's eye; Horus tore off Set's testicles; Isis interfered so persistently that Horus lost his temper and cut off her head. They tried a boat race in vessels of stone. The tribunal of the gods dithered for decades, and Set argued his case the entire time, loudly, and was never simply shouted down — because he had a case.","And for long periods he was honoured. Kings took his name. He was the patron of the eastern frontier and the strength of the army, and in the barque of Ra it is Set who stands at the prow and spears Apep, night after night, the only power violent enough to hold off the thing that would unmake everything. Later ages, under foreign occupation, turned him into a straightforward devil and hacked his images off the walls. The older material knows better. Egypt did not think chaos could be removed. It thought chaos had to be pointed in the right direction."]},{id:"nephthys",name:"Nephthys",epithets:"Lady of the House · The Other Mourner · She Who Is Not Seen",domains:["Mourning","Night","Protection of the Dead","Concealment","Loyalty"],symbols:["The Basket and House Sign","The Kite","Dusk","The Wrapped Linen"],portrait:art("Nephthys.png"),portraitCaption:"Original artwork",intro:"I am the sister you do not name. Isis is the one in the hymns; I am the one who was also there, at the other end of the body, for every hour of that search. I am married to the man who did it. I bore a son to the man he killed, and I left the child in the reeds out of fear, and Isis found him and raised him and never once used it against me. So do not call me the lesser sister. Call me what I actually am — the one who stayed when staying cost something.",myth:["Nephthys is the fourth of Nut's children, sister to Isis and Osiris, wife and sister to Set. Her name means lady of the house or lady of the temple enclosure, and she is a goddess of the edges — dusk rather than night, the boundary rather than the territory. Where Isis is the throne and the visible power, Nephthys is what stands behind it.","She betrayed her husband quietly and consequentially. By one account she disguised herself as Isis and conceived a child by Osiris, and out of fear of Set abandoned the infant in the marshes — where Isis found him, took him in, and raised him. That child was Anubis. The two sisters never fell out over it. When Osiris was murdered, Nephthys left Set and went with Isis, and the two of them searched the whole length of the country together.","In the funerary texts they are always a pair: two kites at either end of the bier, Isis at the head, Nephthys at the feet, wings spread over the body, wailing. Every Egyptian funeral had two women in those roles. And in the tomb her figure is painted at the corners of the sarcophagus with her arms around the dead — because the point of her is not that she is powerful. It is that no one goes into the dark unaccompanied."]},{id:"horus",name:"Horus",epithets:"The Falcon · Avenger of His Father · He of the Two Eyes",domains:["Kingship","The Sky","Vengeance","Protection","Legitimacy"],symbols:["The Falcon","The Wedjat Eye","The Double Crown","The Sun and Moon"],portrait:art("Horus.png"),portraitCaption:"Original artwork",intro:"I was born in a swamp to a woman hiding from the man who killed my father, and I grew up knowing exactly one thing about my future. It took eighty years. Eighty. Of tribunals and trickery and my uncle arguing and the gods sitting on their hands, and in the middle of it I lost an eye and lost my temper and did something to my own mother I will not describe to you. I got the throne. Every pharaoh who has ever sat on it has sat on it as me. And I would not tell you the price was small.",myth:["Horus is the falcon whose right eye is the sun and whose left is the moon, and he is kingship itself — the living pharaoh was Horus, and the dead one became Osiris. He was conceived after his father's murder, born in the Delta marshes, and raised in hiding by Isis, sickly and stung and constantly in danger. Everything about his childhood is precarious, which is the point: legitimate rule in Egypt is something that survives being nearly extinguished.","The contendings with Set ran for eighty years and were as much farce as tragedy. They fought as hippopotami. Set tore out Horus's eye and it was Thoth who restored it — the wedjat, the whole eye, which became the commonest amulet in Egypt and the reason offerings themselves were sometimes just called the eye of Horus. Isis interfered on his behalf so relentlessly that Horus, enraged, struck off her head, and Thoth had to put a cow's head on her. He is not a spotless hero.","The tribunal eventually found for him. Some accounts have Osiris himself sending word up from the underworld pointing out that the gods eat grain, and grain is his, and they might consider that when deciding. Horus took the double crown of Upper and Lower Egypt, and Set was given the deserts and the storms and, in one version, a place at Ra's side in the boat. The Egyptians did not destroy the loser. They gave him a job at the edge of the world where his violence was useful."]},{id:"anubis",name:"Anubis",epithets:"He Who Is Upon His Mountain · Guardian of the Scales · Lord of the Sacred Land",domains:["Embalming","The Dead","Judgment","Protection","Passage"],symbols:["The Jackal","The Embalming Table","The Balance","Black Resin","The Imiut Fetish"],portrait:art("Anubis.png"),portraitCaption:"Original artwork",intro:"I am not what frightens you. I have prepared more bodies than there are people alive today, and I have never once been rough with any of them, and I have never once been sad about it either — both of those would get in the way of the work. When your heart is on the scale I am the one adjusting the plumb line, and I will do it accurately whether the result goes for you or against you. What you should want from me is not mercy. It is competence. You have it.",myth:["Anubis is the jackal of the necropolis, and the reason he is a jackal is unpleasant and honest: jackals dug at shallow graves at the desert edge. Rather than fighting that, the Egyptians made the scavenger into the protector — the animal at the cemetery became the god who guards it. He is coloured black, not for the jackal's actual coat but for the black of the embalming resins and the black silt of the fertile Nile, which is the colour of renewal here.","He invented the work. When Osiris was murdered, it was Anubis who wrapped him — the first mummy, the original of every burial performed for the next three thousand years. In the embalming house a priest wore the jackal mask and became him for the duration of the rites. The whole apparatus of Egyptian burial is a re-enactment of what Anubis did over one particular body.","In the hall of judgment he leads the dead in by the hand and tends the balance itself, setting the heart against Maat's feather and checking the plumb. He does not argue and he does not intercede; Thoth records, Osiris presides, Ammit waits. Before Osiris rose to prominence Anubis was the chief lord of the dead in his own right, and he never lost the essential office: he is the one who takes your hand at the door, and he does not let go until you are through."]},{id:"sekhmet",name:"Sekhmet",epithets:"The Powerful · Lady of Slaughter · Mistress of the Plague and Its Cure",domains:["War","Destruction","Plague","Healing","Divine Fury"],symbols:["The Lioness","The Solar Disc","Red Linen","The Arrows of Pestilence","Beer"],portrait:art("Sekhmet.png"),portraitCaption:"Original artwork",intro:"They sent me to punish humanity, and I did the job, and then I did not stop. That is the part they leave out of the polite version. I was standing in it up to my knees and it was good, and the sun himself could not call me off — he had to flood a field with seven thousand jars of beer dyed red so that I would mistake it for more and drink until I fell over. I woke up gentle. Physicians pray to me. Ask them why. The thing that brings the plague is the only thing that knows how to take it away.",myth:["Sekhmet is the lioness, the eye of Ra in its destroying form, born of fire. When humankind plotted against the ageing Ra, he sent his eye out as her to deal with it, and she went through them like a scythe. Then the killing became its own reason. She would not be recalled. Ra, watching his own creation about to be finished off by the instrument he had sent, had to resort to a trick.","He ordered vast quantities of beer brewed and stained red with ochre until it looked exactly like blood, and had it poured out across the fields at Herakleopolis in the night. Sekhmet came at dawn, saw a plain of what she wanted, and drank it all. She became too drunk to continue and slept, and woke as Hathor — gentle, and remembering nothing. Egypt marked this annually with a festival of drunkenness, which is a striking thing for a civilisation to commemorate: the night the world was saved by getting the goddess too intoxicated to kill.","And she is a healer. Her priests were physicians; her name appears in medical papyri; the plague arrows are hers to fire and hers to withhold. Over seven hundred statues of her were set up in a single temple precinct by one pharaoh, one for every day and night of the year, so the rites of appeasement never lapsed. This is the Egyptian logic at its clearest — you do not banish the terrible thing. You keep it fed, and you keep it close, and you make very sure it stays on your side."]},{id:"hathor",name:"Hathor",epithets:"Lady of Drunkenness · Mistress of the Sycamore · She Who Welcomes the Dead",domains:["Love","Joy","Music","Motherhood","The Beautiful West"],symbols:["The Sistrum","Cow Horns and Disc","The Mirror","The Sycamore Fig","Turquoise"],portrait:art("Hathor.png"),portraitCaption:"Original artwork",intro:"Once, when the sun sat sulking on his throne after being insulted and would not speak to anyone and creation began going grey around the edges, I walked in and lifted my dress. He laughed. Everything started again. Do not mistake me for a decorative goddess because my domains are music and beer and love — I am also the one standing in the tree at the edge of the desert with water and bread for the newly dead, and I am the other face of the lioness who nearly ended your species. Joy is not the absence of teeth.",myth:["Hathor is one of the most widely loved deities in Egypt and one of the hardest to fence in. She is love, sex, beauty, music, dance, drunkenness, fertility and motherhood; she is a cow, or a woman with horns holding the sun between them, or a woman with cow's ears. Her instrument is the sistrum, whose rattle was believed to please the gods and drive off hostile forces, and her festivals involved a great deal of drinking.","She is also profoundly a goddess of the dead, and this surprises people who meet her as the goddess of love. She is Lady of the West, and the west is where the dead go. She stands in the branches of a sycamore at the boundary of the desert and offers water and food to those arriving, which is why sycamores were planted at the edge of cemeteries and coffins were sometimes made of that wood. The dead in the New Kingdom hoped to enter her following.","And she is Sekhmet's other face. The lioness sent to destroy humanity, drunk on red beer, wakes as Hathor — the same power, cooled. The Egyptians did not treat this as two goddesses confused with one another; they treated it as an accurate statement about a single force. The thing that gives life and the thing that takes it are not opposites, and the difference between them can be as thin as whether she has been given what she wants."]},{id:"bastet",name:"Bastet",epithets:"Lady of Bubastis · Protector of the House · The Gentle Eye",domains:["Home","Protection","Cats","Fertility","Festivity"],symbols:["The Cat","The Sistrum","Kittens","The Perfume Jar","The Basket"],portrait:art("Bastet.png"),portraitCaption:"Original artwork",intro:"My sister is the lioness who could not stop. I am the one who lives in your house. Consider what that means before you decide which of us is the lesser: something with the same nature has chosen to sit at your hearth, kill the snake that came for your children in the night, and let you touch her. The affection is real. It is also entirely conditional, and it is given on my terms, and that is why you value it. You have never once taken me for granted.",myth:["Bastet began as a lioness — fierce, solar, the protective eye of Ra, barely distinguishable from Sekhmet in the early period. Over centuries she softened into the cat, and became the guardian of the household, of women, of children, and of the home against the things that came in at night: snakes, scorpions, vermin, sickness, and the hostile magic that Egyptians thought moved in the dark.","Her city Bubastis held a festival that a Greek visitor described as the largest and rowdiest in the country — barges going up the Nile packed with people, clapping and playing pipes, women calling out and shouting mockery at the towns they passed, and by his account more wine drunk over those days than in the whole rest of the year. It was religion as release, and hundreds of thousands went.","The cats themselves were held sacred in a way that startled foreigners. Killing one, even accidentally, could cost a life. Households in mourning for a dead cat shaved their eyebrows. And the cemeteries at Bubastis and elsewhere held vast numbers of mummified cats, wrapped and buried as offerings to her — a scale of devotion that makes clear this was never a minor domestic goddess but one of the most genuinely popular powers in Egypt."]},{id:"sobek",name:"Sobek",epithets:"Lord of the Waters · He Who Rages · Of the Faiyum",domains:["The Nile","Fertility","Ferocity","Military Might","Protection"],symbols:["The Crocodile","The Sweat of the Nile","Reed Banks","The Plumed Crown"],portrait:art("Sobek.png"),portraitCaption:"Original artwork",intro:"There is no version of me that is safe and there is no version of me that is your enemy, and both of those are true at once, which people find difficult. I am the river. The river feeds this entire country and the river takes children off the bank, and it does not do the second thing out of malice — it does it because that is what a river with crocodiles in it is. When the flood came in properly and the fields went green, they thanked me. They were right to.",myth:["Sobek is the crocodile: the Nile's power in its rawest form, both the fertility of the inundation and the thing waiting in the shallows. Egyptians said the sweat of Sobek made the river. His great centres were Kom Ombo and the Faiyum, where a live sacred crocodile was kept in a temple pool, adorned with gold on its ears and bracelets on its forelegs, fed by priests and mummified with honour when it died.","He is aggressively protective rather than merely aggressive. He was said to have retrieved the hands of Horus from the water when they were cut off and thrown in, and in funerary texts his ferocity is invoked on the side of the dead — you want the crocodile in front of you, not behind. Pharaohs took his name, and he was linked with the sun as Sobek-Ra, a crocodile carrying the disc.","And he is one of the clearest examples of how this pantheon thinks. There was no attempt to pretend crocodiles were benign, and no attempt to cast them out as evil. A thing that dangerous was made a god, given a temple and a pool and jewellery and daily meals — on the entirely practical theory that the most dangerous force in your landscape is better handled as a neighbour you are on excellent terms with."]},{id:"nut",name:"Nut",epithets:"She Who Bears the Stars · Mother of the Five · The Great Deep",domains:["The Sky","Night","Rebirth","Motherhood","The Coffin"],symbols:["The Arched Body","Stars","The Water Pot","Outstretched Wings"],portrait:art("Nut.png"),portraitCaption:"Original artwork",intro:"I am arched over everything with my fingers in the east and my toes in the west, and my husband is directly beneath me, and we have not touched since the day our father forced himself between us and lifted me up here. Every evening I swallow the sun. All night it travels through me in the dark, and at dawn I give birth to it again, and I have done this without a single night off. They paint me on the inside of coffin lids. When the lid closes over you, that is not a wall. That is me, and you are where the sun goes.",myth:["Nut is the sky, shown as a woman stretched over the whole world, her body dark and scattered with stars, touching the earth only at her fingertips and toes. Beneath her lies Geb, the earth, her brother and husband. Their father Shu, the air, was ordered to separate them and stands between them with his arms raised, holding her up — which is why there is a space between earth and sky for anything to live in at all.","She had been cursed not to give birth on any day of the year, and the year had three hundred and sixty days exactly. Thoth won five more from the moon at senet, days belonging to no year, and on those five she bore Osiris, Horus the Elder, Set, Isis and Nephthys — the entire cast of the great story, delivered through a loophole.","Her daily work is the sun. Each evening she swallows Ra, who travels through her body all night, and each dawn she gives birth to him again at the eastern horizon. That cycle made her the central image of Egyptian funerary hope, and so she was painted on the underside of coffin lids and the ceilings of tomb chambers, arched directly above the body — so that the dead lay inside the sky itself, in the same passage the sun makes, on the same terms."]},{id:"geb",name:"Geb",epithets:"The Great Cackler · Father of Serpents · He Upon Whom Everything Rests",domains:["The Earth","Crops","Earthquakes","Grief","Foundation"],symbols:["The Goose","Green Skin","Barley","The Reclining Body"],portrait:art("Geb.png"),portraitCaption:"Original artwork",intro:"Look up. She is right there, the whole width of the sky, close enough to see the stars on her belly and far enough that I have not reached her in the entire life of the world. When I grieve about it, you get earthquakes. Everything you have ever built stands on my back and everything you have ever eaten came up out of me, and I do not begrudge you any of it. But do not ask me if I have got used to it. I have not.",myth:["Geb is the earth, and Egypt reverses the usual arrangement — here the earth is male and the sky is female. He lies beneath, sometimes shown propped on an elbow with one knee raised, and those are the mountains. His skin is green with the vegetation growing out of it. Barley is said to sprout from his ribs, and the dead are held in his body until they are released.","He and Nut were locked together until Shu was sent between them and lifted her away, and the separation is permanent. Geb's mourning is not metaphorical in this system: his laughter and his grief move the ground, which is why one of his oldest titles is the Great Cackler — in some versions a goose whose cry began the world, or who laid the egg the sun came out of.","He was a king among the gods before Osiris, and the throne of Egypt was called the throne of Geb long after. He also presided at the tribunal over the quarrel between Horus and Set, ruling in favour of Horus, and in that role he is the ancestor-judge — the ground itself deciding who is entitled to stand on it."]},{id:"taweret",name:"Taweret",epithets:"The Great One · Lady of the Birth-Bed · She Who Frightens What Comes At Night",domains:["Childbirth","Fertility","Household Protection","Motherhood","Ferocity"],symbols:["The Hippopotamus","The Sa Amulet","The Knife","The Lion's Paws","The Birthing Brick"],portrait:art("Taweret.png"),portraitCaption:"Original artwork",intro:"I am a pregnant hippopotamus standing upright with a lion's paws, a crocodile down my back, and a knife. Nobody designed me to be looked at. They designed me for the room where a woman is labouring and it is going badly and it is dark, and something has come to the doorway, and it needs to meet something worse. You will not find me in the great temples. You will find me in ordinary houses, on beds and headrests and amulets, all over this country, for three thousand years.",myth:["Taweret is built entirely out of threat, on purpose. The body of a heavily pregnant hippopotamus — an animal Egyptians regarded as one of the most dangerous things alive — standing on a lion's hind legs, with a crocodile's tail or a whole crocodile along her back and a human woman's breasts. Every component is a predator. She is aimed outward, at whatever might come for a mother and a newborn.","Her worship was domestic rather than official. She belongs to the household: painted on the sides of beds and headrests, carved into ivory wands used in birth chambers, worn as amulets by pregnant women and hung around infants' necks. In the workers' village at Deir el-Medina her image is everywhere. She often carries the sa, the sign of protection, and frequently a knife, because the protection she offers is not passive.","She survived everything. Dynasties fell, capitals moved, the great gods rose and were eclipsed and rose again, and Taweret went on appearing in ordinary bedrooms across the entire span of Egyptian history — one of the most consistently present divine figures in the whole civilisation, and almost never in the state monuments. She was never a goddess of the powerful. She was for whoever was in the room."]}]},yoruba:{label:"Yoruba / Orisha",blurb:"Above all stands Olódùmarè, the source, from whom àṣẹ comes — the power that makes a thing so. Beneath, the òrìṣà: iron and thunder, river and wind, the crossroads and the deep. These are not gods recovered from a ruin. They have festivals, rivers, groves and cities that keep them, on two continents, right now.",deities:[{id:"obatala",name:"Obatala",epithets:"Ọbàtálá · Ọ̀rìṣà-Ńlá, the Great Òrìṣà · King of the White Cloth",domains:["Creation","Purity","Character","Patience","Justice"],symbols:["White Cloth","The Sculptor's Hands","Silver","The Snail Shell","Chalk"],portrait:art("Obatala.png"),portraitCaption:"Original artwork",intro:"I shape the body in the womb. Every face you have ever loved passed through my hands before it drew breath, and I did not hurry any of them. My colour is white — not because I am spotless, but because on white you can see every mark, and I would rather be answerable than comfortable. I have made a serious mistake in my time and I did not hide it or blame anyone. What I ask of you is ìwà: character. It is the only thing you will be measured by.",myth:["Ọbàtálá is called Ọ̀rìṣà-Ńlá, the great òrìṣà, and among the powers below Olódùmarè he holds the first place. His work is the moulding of human bodies in the womb — he is the sculptor, and every person alive is his craft. He is dressed in white, and those devoted to him wear white, keep themselves clean, and hold to calm and deliberation as a discipline rather than a mood.","One ìtàn tells that he drank palm wine at his work and his hands lost their steadiness, and children came into the world with bodies shaped differently from others. He could have hidden it. Instead he set down the calabash, swore off palm wine for as long as the world lasts, and took every one of those people under his own hand as ẹni òrìṣà — people of the òrìṣà — who are held to be closer to him than anyone else alive. Palm wine remains forbidden to him and to all who serve him. That prohibition is three thousand years of a god keeping his word about something he did.","He is also the pattern for patience and for cool-headedness in judgment. In several narratives he is wronged, imprisoned or humiliated and does not retaliate, and the disorder that follows is corrected only when he is restored and honoured. In a tradition that respects force, thunder, iron and the sea, the highest of the òrìṣà is the one who works slowly with his hands and does not raise his voice."]},{id:"oduduwa",name:"Oduduwa",epithets:"Odùduwà · Progenitor at Ilé-Ifẹ̀ · Source of the Crowns",domains:["Ancestry","Kingship","Land","Founding","Lineage"],symbols:["The Beaded Crown","The Chain from Heaven","Sand","The Five-Toed Hen"],portrait:art("Oduduwa.png"),portraitCaption:"Original artwork",intro:"There was water, and no ground to stand on. I came down on a chain with sand in a shell and a hen with five toes, and I poured, and she scratched, and the sand spread until there was somewhere for a person to put a foot. That place is Ilé-Ifẹ̀ and it is still there. From me came the crowns. Ask any Yorùbá king where his beaded crown comes from and he will tell you a name, and it will be mine.",myth:["Odùduwà is the ancestral figure at the centre of Yorùbá origins, and the traditions about him are not uniform — which is itself worth saying plainly. In one widely told account, Ọbàtálá was given the work of making land upon the water and was delayed, and Odùduwà completed it: he came down with a shell of sand, an ìyẹ́rẹ́ palm nut and a five-toed hen, poured the sand onto the water, and let the hen scratch it outward until dry earth spread in every direction.","That place became Ilé-Ifẹ̀, held as the point where the world began and still the spiritual centre of the Yorùbá world. From Odùduwà descend the royal lineages: his sons and grandsons are said to have gone out and founded the great kingdoms, and the right of a Yorùbá ọba to wear the beaded crown with its fringe is traced back through descent from him.","Ifẹ̀ tells it one way and Ọ̀yọ́ another. In some mouths he came down the chain from heaven; in others he came overland at the head of an army and took the place by force, and the sky is a courtesy paid afterward. Ọbàtálá's people say the land was already made and Odùduwà walked onto it. All of these are told, in the same language, by people who know the other versions perfectly well — because a beginning big enough to found a civilisation is not the sort of thing one town gets to own outright."]},{id:"esu",name:"Esu",epithets:"Èṣù Ẹlẹ́gbára · Keeper of the Crossroads · Bearer of Àṣẹ",domains:["Crossroads","Messages","Language","Chance","Testing"],symbols:["The Crossroads","The Two-Coloured Cap","Laterite Stone","The Cowrie","The Long Tail"],portrait:art("Esu.png"),portraitCaption:"Original artwork",intro:"First, correct something. Missionaries came and needed a word for their devil, and they took mine, and it stuck, and it was wrong. I am not that. I carry every offering upward and every answer back down; without me the road between you and heaven is closed and no one hears anything. I am also the one who will walk between two friends wearing a cap that is black on one side and white on the other, and let them destroy a friendship insisting on what they saw. That is not malice. That is the lesson.",myth:["Èṣù is the messenger and the keeper of àṣẹ, the force that makes a thing effective. Every offering passes through him to reach heaven; every reply comes back the same way. For that reason he is honoured first, before any other òrìṣà, and his shrine stands at the entrance, at the gate, at the market and at the crossroads — the places where paths meet and a choice has to be made.","He must be dealt with straightforwardly rather than flattered. In one well-known ìtàn he walks the boundary between two farmers who have been friends for years, wearing a cap black on one side and white on the other, and afterwards they fall into a bitter quarrel over what colour it was, each of them certain, each of them honest, both of them wrong. He is not punishing them. He is showing them that a person who has only seen one side of a thing has not seen the thing.","The devil business was a translation. Missionaries needed a name for their adversary, reached for the nearest trickster, and printed it — and it stuck so hard that people who have never read a word of Yorùbá still repeat it. It is wrong at every joint. Èṣù is not the enemy of the divine order; he is the part of it that carries the messages, and without him nothing anyone offers reaches anybody. What he punishes is arrogance, neglect, and the man who thinks he can skip a step and not be noticed."]},{id:"ogun",name:"Ogun",epithets:"Ògún · Lord of Iron · He Who Cleared the Path",domains:["Iron","War","Labour","Technology","Oaths"],symbols:["The Cutlass","The Anvil","Palm Fronds","The Dog","Red and Black"],portrait:art("Ogun.png"),portraitCaption:"Original artwork",intro:"When the others came down from heaven the bush was too thick to pass and every one of them stood there. I had iron. I cut the road, and they walked on it, and that is the arrangement between us that has never changed. Every blade, every rail, every engine, every scalpel — mine. And I have done a thing in battle I cannot take back and I went into the ground rather than face what I had done. So swear on my iron carefully. I take an oath seriously in both directions.",myth:["Ògún is iron itself and everything iron makes possible. When the òrìṣà first came from heaven to earth they were stopped by dense bush, and it was Ògún, with his cutlass, who cut the path through so the rest could pass — which is why he is called the opener of the road and why the others owe him precedence in that work. He belongs to blacksmiths and hunters and soldiers, and equally to mechanics, drivers, welders, engineers and surgeons. Anyone whose living depends on a metal edge is his.","His force is real and it is dangerous. In one ìtàn told at Ìrè, he returned from war and, in a state where he was not recognised and did not recognise, turned his weapon on his own people. When he understood what he had done he did not defend himself and did not stay. He sank into the earth with his sword, and the tradition treats this as the sober centre of him: the power that clears the road is the same power that can go through everything in front of it.","His authority over oaths outlived colonial rule in a very literal way. In parts of Nigeria a witness may be sworn on a piece of iron rather than a book, because it is understood that Ògún does not overlook a broken word. He is invoked at the making of agreements, and drivers hang his emblems in their vehicles. He is not a distant god of an old religion here — he is present in workshops and on roads every day."]},{id:"sango",name:"Sango",epithets:"Ṣàngó · Fourth Aláàfin of Ọ̀yọ́ · Lord of Thunder and Justice",domains:["Thunder","Lightning","Justice","Kingship","Drums"],symbols:["The Double Axe","Thunderstones","Bàtá Drums","Red and White","The Ram"],portrait:art("Sango.png"),portraitCaption:"Original artwork",intro:"I was a man before I was this. Fourth Aláàfin of Ọ̀yọ́, and a magnificent one, and not a gentle one — I had a temper that cost me things no throne could buy back. Now I am the sound that arrives after the light. When lightning strikes a house in this country, people do not say it was unlucky. They come and look for what was being hidden in it. I am hardest on liars and on thieves, and I have never once claimed to have been a good man.",myth:["Ṣàngó is thunder and lightning, and he is also history: the fourth Aláàfin of the Ọ̀yọ́ empire, a king remembered as powerful, magnetic, quick-tempered and enormously capable. He is one of the clearest cases of a human ruler becoming an òrìṣà — the tradition does not tidy away the man in order to make room for the god.","His emblem is the oṣé, the double-headed axe, carried above the head. The polished neolithic stone tools that turn up in the ground are called edùn àrá, thunderstones, and are held to be his — thrown down when lightning strikes and afterwards kept in his shrine. His drums are the bàtá, and his festivals are loud. He is served with red and white, and the ram is his.","He is a judge, and his particular business is with liars, thieves and those who conceal. Where lightning strikes, the older understanding is that something was being hidden there. His wives are òrìṣà in their own right — Ọya, who rode into battle beside him, Ọ̀ṣun, and Ọbà — and the ìtàn about them are not decorative: they are stories about power, rivalry, loyalty and what a great man costs the people closest to him. At Kòso they say the king did not hang, and there his story turns from a reign into something that is still going."]},{id:"oya",name:"Oya",epithets:"Ọya Yánsàn · Mother of Nine · Wind Before the Storm",domains:["Wind","Storm","Change","The Marketplace","The Threshold of the Dead"],symbols:["The Buffalo","The Horsetail Whisk","Nine","The Niger River","Lightning-Struck Copper"],portrait:art("Oya.png"),portraitCaption:"Original artwork",intro:"I am the wind that arrives before the rain — the one that comes through the market and takes the roofs off and tells everyone what is coming. People want change and then they meet me and discover that change is not gentle. I stand at the gate of the cemetery. Not because I am death, understand me: because someone has to stand between the living and the dead and make sure the traffic goes the right way, and there was nobody else with the nerve for it.",myth:["Ọya is the wind, the tornado, and the sudden violence of weather turning. Her river is the Niger, called Odò Ọya, and her number is nine — Ọya Yánsàn, mother of nine. In one ìtàn she moves between woman and buffalo, and the story is usually about a husband who discovers the secret and cannot handle knowing it.","She rode with Ṣàngó, and she is not described as his supporter but as his equal in a fight — in some accounts she goes to war beside him and in some she is the more frightening of the two. Her force is the force of things being swept out: the storm that clears the air, the market emptied in an afternoon, the sudden reversal that makes a person's life unrecognisable within a week.","She stands at the boundary of the dead, and this is her most misread aspect. She is not a goddess of death and she does not take life. She is the one with authority at the gate — associated with the ancestral masquerades, with the cemetery's edge, with the passage itself. The Yorùbá view is that this crossing needs a guardian who is not afraid of it, and she is not."]},{id:"osun",name:"Osun",epithets:"Ọ̀ṣun · Ìyálóde, Mother of the Town · Owner of Sweet Water and Brass",domains:["Fresh Water","Fertility","Wealth","Beauty","Healing"],symbols:["Brass","Honey","The Fan","The River at Òṣogbo","Yellow Cloth"],portrait:art("Osun.png"),portraitCaption:"Original artwork",intro:"When they came down to set the world in order, the men held their councils and did not call me. So I let them work. Nothing they built stood, nothing they planted came up, the rain would not fall — and eventually they came back down the road to my river and asked, politely, what was wrong. I told them. There is no àṣẹ in a room that has left out half of what it needs. They have never made that particular mistake twice. Come to the water. I am not difficult, only owed.",myth:["Ọ̀ṣun is the river that runs through Òṣogbo and the power of fresh water — which in a hot country means life, plainly and without metaphor. She is associated with fertility and the wellbeing of children, with healing, with wealth and with brass, and with the sweetness of honey. She is called Ìyálóde, a real title borne by the leading woman of a town, and the fan and the mirror are hers.","Her central ìtàn is one of the most quoted narratives in the tradition. When the òrìṣà were sent to organise the world, the male òrìṣà met and deliberated and excluded Ọ̀ṣun from their councils. Everything they attempted failed — the earth did not yield, the rain did not come, nothing they set in motion held. When they went to Olódùmarè, they were told to return and include her, and only when they did did the work begin to succeed. It is a story about the practical, structural authority of women, and it is not subtle.","The Ọ̀ṣun-Òṣogbo Sacred Grove on the river's banks is one of the last great forest shrines of its kind, filled with sculpture and dense with growth, and it is a UNESCO World Heritage site. Its annual festival draws enormous crowds from Nigeria and from across the diaspora. She is not a figure recovered from a dead past. She has a river, a forest, a festival and a city that keep her."]},{id:"yemoja",name:"Yemoja",epithets:"Yemọja · Mother Whose Children Are the Fish · Lady of the Waters",domains:["Motherhood","Water","Protection","Fertility","Consolation"],symbols:["The Ògùn River","Blue and White","The Cowrie","The Fish","The Full Moon"],portrait:art("Yemoja.png"),portraitCaption:"Original artwork",intro:"Come here. Whatever it is, sit down first. I am the mother of the waters, and my children cannot be counted any more than fish can be counted, and I have never yet met a grief that was too much trouble. Water is patient — it does not argue with the stone, it simply keeps going, and after enough time the stone is a different shape. That is how I work and that is how you should. Now. Tell me what happened.",myth:["Yemọja is the great mother among the òrìṣà, and her domain is water and the protection of children. In Yorùbáland she is associated with the Ògùn river; carried across the Atlantic through the slave trade, she became a goddess of the ocean itself in Brazil, Cuba and elsewhere, and her festivals on the shore are among the largest religious gatherings in the Americas. Her name is understood as the mother whose children are the fish.","She belongs to mothers, to childbirth, to the safety of infants, and to anyone in need of care rather than judgment. She is invoked over pregnancy and over the wellbeing of a household. In her, the tradition's association between water and life is at its plainest: the substance you cannot live a week without is a person, and she is maternal rather than remote.","But she is the sea as well as the river, and the sea is not sentimental. The ìtàn about her include anger, departure, and the flood — a mother's protectiveness has an edge on it, and the water that carries you can also close over you. Those who serve her wear blue and white, and the offerings brought to the shore for her are among the most photographed religious images of the African diaspora."]},{id:"orunmila",name:"Orunmila",epithets:"Òrúnmìlà · Ẹlẹ́rìí Ìpín, Witness to Destiny · Lord of Ifá",domains:["Wisdom","Destiny","Ifá","Counsel","Memory"],symbols:["The Divining Chain","Palm Nuts","The Divining Tray","Green and Yellow"],portrait:art("Orunmila.png"),portraitCaption:"Original artwork",intro:"I was there when you knelt and chose your own destiny, before you came here, and I have not forgotten a word of it. You have. That is the arrangement — everyone arrives having agreed to something they cannot remember agreeing to. I am the witness, not the author. I did not write it and I will not change it, and anyone who tells you they can is selling you something. What I have is the whole memory of what happens to people who behave in particular ways, gathered since the beginning. Sit down. Let us talk about your character, which is the part still in your hands.",myth:["Òrúnmìlà is the òrìṣà of wisdom and the figure at the centre of Ifá, the Yorùbá system of divination and knowledge. He is called Ẹlẹ́rìí Ìpín — witness to destiny — because he was present when each person chose their orí, their destiny and inner head, before birth. He does not assign fate and does not overrule it. He knows what was chosen.","The Ifá corpus is enormous: two hundred and fifty-six odù, each carrying a large body of verses, stories, proverbs, precedents and songs, held in memory by trained diviners called babaláwo and ìyánífá after many years of study. It functions as philosophy, ethics, medicine, history and literature at once, and UNESCO has recognised the Ifá divination system as an intangible cultural heritage of humanity.","In story after story the pattern holds: the problem that cannot be broken by strength gives way to the one who asked the right question first. Ògún can cut through anything in front of him and still be walking the wrong way. Òrúnmìlà is the one consulted before the journey. The verses are not predictions — they are precedent, thousands of cases of what happened to someone in this position before, and the diviner's art is knowing which case is yours. It takes many years to learn, which is itself the tradition's comment on how easy wisdom is."]},{id:"ososi",name:"Ososi",epithets:"Ọ̀ṣọ́ọ̀sì · Hunter of the Forest · One Arrow, One Aim",domains:["The Hunt","The Forest","Precision","Provision","Tracking"],symbols:["The Bow","The Single Arrow","Blue","Antlers","The Forest Path"],portrait:art("Ososi.png"),portraitCaption:"Original artwork",intro:"One arrow. Not because I cannot carry more — because a hunter who plans on a second shot has already decided to miss the first. I feed people. That is the actual work: not the glory of the kill, but a family with meat tonight who did not have it this morning. I know where things are. Whatever you have lost, whatever you are looking for and cannot name — that is my territory, and I will tell you now that it is usually closer than you think and you are moving too loudly.",myth:["Ọ̀ṣọ́ọ̀sì is the hunter and the òrìṣà of the forest — the one who finds and who provides. Where Ògún cuts the road, Ọ̀ṣọ́ọ̀sì is the one who reads the ground and knows what passed and when, and the two are frequently paired: force and precision working the same land.","The single arrow is his defining emblem, and it stands for exactness in aim and in intention. He is invoked by people who must locate something — the missing, the hidden, the answer that has not surfaced — and by those seeking sustenance for a household. In several traditions he also carries a strong association with justice, as the one who tracks down what has been done and by whom.","In the diaspora he grew in prominence, and in Brazilian and Cuban practice he is a major figure, often honoured alongside Ògún. The forest he belongs to is not scenery: it is where food comes from and where things are concealed, and mastery of it is treated as a serious form of knowledge rather than a rustic skill."]},{id:"osanyin",name:"Osanyin",epithets:"Ọ̀sanyìn · Keeper of the Leaves · One Leg, One Arm, One Eye",domains:["Herbs","Medicine","The Forest","Secrets","Healing"],symbols:["The Iron Staff with Birds","Leaves","The Calabash","The Small Voice"],portrait:art("Osanyin.png"),portraitCaption:"Original artwork",intro:"Every leaf in that forest has a name and a use and a hazard, and I know all of them, and you know perhaps four. My voice is thin and strange and I have one leg, one arm and one eye, and people who meet me in the bush usually run. That is fine. What matters is this: no medicine anywhere works without me, and none of it can be learned from a page. It is learned from a person, over years, and the ones who tried to shortcut it are why I speak so carefully now.",myth:["Ọ̀sanyìn is the òrìṣà of leaves and of medicine, and in Yorùbá practice that is not a small portfolio — herbal knowledge sits at the centre of healing, and no preparation is held to be effective without him. He is depicted with one leg, one arm and one eye, and with a thin high voice, and his emblem is an iron staff crowned with birds.","One ìtàn tells that he alone held the knowledge of all the leaves, kept in a calabash, and that when the calabash was broken or scattered by the wind, the leaves were dispersed and each of the other òrìṣà received some — but only Ọ̀sanyìn retained the knowledge of the whole. Whatever any other power can do with a plant, it is because a portion passed through him.","He is met in the bush rather than in a shrine, and the encounter is not comfortable. Hunters describe a thin voice calling from somewhere in the leaves, and a figure that is wrong in a way the eye keeps trying to correct. Those he favours he teaches, one plant at a time, over years — because the same leaf that closes a wound will stop a heart at the wrong weight, and the difference is not written down anywhere. He is generous and he is exacting, and he has never once been in a hurry."]},{id:"obaluaye",name:"Obaluaye",epithets:"Ọbalúayé · Lord of the Earth · He Whose Name Is Spoken Carefully",domains:["Disease","Healing","The Earth","Endurance","Dignity"],symbols:["The Raffia Covering","The Ṣáṣárá Broom","Sesame","Cowries","The Cane"],portrait:art("Obaluaye.png"),portraitCaption:"Original artwork",intro:"You will notice people do not use my older name lightly. That is not superstition — that is manners, and I appreciate it. I am the one who comes with the sickness and I am the one who takes it away again, and the same broom does both. Sit with me a moment and understand what I actually am: I am the god of everyone who has been shunned. The ones people crossed the road to avoid. They are mine, and I have never once been ashamed of them.",myth:["Ọbalúayé — also called Bàbá and, in his older name, associated with smallpox and epidemic disease — governs illness of the earth and its cure. He is covered in raffia so that his face and body are not seen, and he carries the ṣáṣárá, a broom, which is understood both as the instrument that sweeps sickness onto a community and the one that sweeps it away.","His older name is treated with real care, and in many places it is avoided in ordinary speech in favour of respectful titles. This is not fear of the word for its own sake. It reflects a settled attitude that some powers are addressed with formality, and that the manner of speaking about a thing is part of one's relationship to it.","What is striking about him is where his sympathy sits. He is the òrìṣà of the sick and the scarred — of those whom illness marked and communities pushed away. Marks left by disease can be understood as his sign rather than a disgrace, and those who survived what he brought are held to belong to him. In the diaspora he is widely honoured as Babalú-Ayé, and his festivals are large. Epidemic disease is not treated here as a punishment to be explained away, but as a power with a face, which can be addressed."]},{id:"olokun",name:"Olokun",epithets:"Olókun · Owner of the Sea · Keeper of What Is Below",domains:["The Deep","Wealth","Mystery","The Unknown","Dreams"],symbols:["Coral","The Deep Blue","Chains","The Fan","Beads from the Sea Floor"],portrait:art("Olokun.png"),portraitCaption:"Original artwork",intro:"Yemọja is the water you can see. I am what is under it. Nobody has been to the bottom of me and come back able to describe it, and every ship that ever went down went into my house, and I keep what arrives. I am not cruel and I am not kind — I am deep, which is a different thing entirely, and people who mistake the two get into difficulty. There is more wealth in me than has ever been counted above. There is also everything that was lost.",myth:["Olókun is the owner of the sea and, more precisely, of its depths — the vast unlit portion no one has seen. Wealth is Olókun's, and so is mystery: coral, pearl, and the unknowable quantity of what lies below. Whether Olókun is male or female varies by region and lineage, and the tradition has never regarded that as a problem to be resolved.","One well-known ìtàn concerns a contest of cloth. Olókun, proud of the sea's magnificence, challenged Olódùmarè to a display of finery, and Olódùmarè sent only a chameleon as messenger. Every splendid garment Olókun brought out, the chameleon matched exactly, on its own body, without effort. Olókun conceded, understanding that the source cannot be out-displayed by anything it produced.","For the African diaspora, Olókun carries a further and heavier meaning. The Atlantic is the water that the slave ships crossed and the water that a great many people never crossed, and reverence for the deep is bound up with that passage. The ocean here is not a scenic backdrop. It is a place where an enormous number of ancestors remain."]},{id:"aganju",name:"Aganju",epithets:"Aganjú · Fire Beneath the Earth · Ferryman of the Wilderness",domains:["Volcano","Wilderness","Strength","Crossings","Untamed Land"],symbols:["The Volcano","The Ferry","Dark Red","The Ram's Horn","Scorched Ground"],portrait:art("Aganju.png"),portraitCaption:"Original artwork",intro:"Everything you have — the field, the road, the town — sits on top of me, and I am on fire. People forget that. They walk about on a crust and call it the ground. I carry travellers over water and through country nobody has settled, and I have no interest at all in your comfort, only in whether you can be got to the other side. Strength is not the same as violence. I am enormously strong and I have almost never needed to prove it.",myth:["Aganjú is the fire under the earth — the volcano, the molten interior, the heat that the visible world rests upon. He is also the wilderness itself: desert, uncleared bush, the country beyond where anyone has built. His force is elemental and territorial rather than martial.","He is associated with crossings, and is described as a ferryman who carries people over rivers and through wild land. Where Ògún cuts a road and Ọ̀ṣọ́ọ̀sì reads the ground, Aganjú is the one who gets a traveller bodily across an obstacle that has no road at all. Strength and endurance are his portion.","His relationship to Ṣàngó differs by lineage — in some he is Ṣàngó's father, in others a brother or close companion, and the two are often honoured near one another. The pairing makes sense: fire above and fire below, the lightning that arrives from the sky and the heat that has been under everyone's feet the whole time."]},{id:"ibeji",name:"Ibeji",epithets:"Ìbejì · The Sacred Twins · Táíwò and Kẹ́hìndé",domains:["Twins","Doubling","Fortune","Childhood","Joy"],symbols:["Paired Figures","Ẹ̀wà Beans","Cowries","Two Bowls","Palm Oil"],portrait:art("Ibeji.png"),portraitCaption:"Original artwork",intro:"There are two of us and we come as one thing. Táíwò went out first to taste the world and report back, which is why Kẹ́hìndé, who came second, is the elder — think about that carefully before you decide you understand birth order. Yorùbáland has more twins born in it than almost anywhere on earth. That is not an accident anyone here regards as an accident. Where we arrive, more of everything tends to arrive with us.",myth:["Ìbejì are the sacred twins, and they are honoured across Yorùbáland with a devotion that has no real equivalent elsewhere. The Yorùbá have among the highest rates of twin birth recorded anywhere in the world, and rather than treating this as strange, the tradition treats twins as carrying particular power and particular fortune for the family they come to.","The naming holds a lovely inversion. The first-born is Táíwò, understood as the one sent ahead to taste the world; the second, Kẹ́hìndé, is regarded as the senior, having sent the other out to check first. Age here is not a matter of who arrived first but of who was in charge of the arrival.","When one twin dies, a carved wooden figure called ère ìbejì is made and cared for by the mother — washed, dressed, fed, carried, kept with the family — so the pair is not broken. These figures are among the most numerous and most tenderly handled objects in Yorùbá art, and museums hold thousands of them. Each one represents a specific child, and the wear on them is from decades of being held."]},{id:"osumare",name:"Osumare",epithets:"Ọ̀ṣùmàrè · The Rainbow Serpent · He Who Carries Water Back to the Sky",domains:["Cycles","Renewal","Rain","Continuity","Transformation"],symbols:["The Rainbow","The Serpent","The Circle","Rain After Sun"],portrait:art("Osumare.png"),portraitCaption:"Original artwork",intro:"I am the serpent that reaches from the ground to the sky and back down again, and I am the reason the water that fell yesterday is up there ready to fall tomorrow. Nothing here is spent. Nothing is used up and gone. The thing you are grieving has not vanished from creation — it has gone round, and it is somewhere on the arc, and it is on its way back in a form you may not recognise. That is not comfort. It is simply how the system runs.",myth:["Ọ̀ṣùmàrè is the rainbow, understood as a great serpent stretching between earth and sky, and the power of cycles and continuity. The essential work is the return of water: rain falls, and Ọ̀ṣùmàrè carries it back up to be sent down again, so the cycle does not run out.","He is associated with movement between realms and with transformation — the serpent that renews itself, the shape that arcs from here to there and back. In several traditions his nature encompasses both male and female, sometimes alternating, and this doubleness is part of what he signifies rather than a contradiction in the accounts.","Wealth, renewal and the persistence of things are his. In Brazil, where he is honoured as Oxumaré, his imagery is prominent, and the arc of the rainbow serves as the plainest possible statement of what the tradition holds about time: it does not run out in a straight line. It comes round, and what went up comes back down, and the world is maintained by that returning."]}]},celtic:{label:"Celtic",blurb:"Not one people and not one pantheon. The Tuatha Dé Danann of Ireland, who came in on a cloud and burned their own ships behind them. The houses of the Mabinogi in Wales, full of enchantment and grudges. And the older Gaulish powers, who left us altars and antlers and almost no words at all.",deities:[{id:"dagda",name:"Dagda",epithets:"The Dagda, the Good God · Eochaid Ollathair · Ruad Rofhessa · Irish",domains:["Abundance","Life and Death","Weather","Music","Kingship"],symbols:["The Bottomless Cauldron","The Great Club","The Oak Harp","The Ladle","Brú na Bóinne"],portrait:art("Dagda.png"),portraitCaption:"Original artwork",intro:"They call me the Good God, and they do not mean virtuous — they mean good at things. I have a cauldron nobody has ever walked away from hungry, a club that kills with one end and wakes them up again with the other, and a harp that calls the seasons round in their order. I have also been made to eat porridge out of a hole in the ground in front of an enemy army, with a ladle a man and woman could lie in, and I finished it. There is more than one kind of strength.",myth:["The Dagda is the great father-figure of the Tuatha Dé Danann and he is not a dignified one — the sources take open pleasure in that. He carries a club so vast it must be dragged on wheels and leaves a furrow like a border ditch, and it kills nine men with one end and restores them to life with the other. His cauldron, Coire Ansic, never empties and no company ever leaves it unsatisfied. His harp Uaithne plays the three strains — sorrow, laughter, and sleep — and when it is called it comes to him through the air, killing nine men on the way.","Before the second battle of Mag Tuired he went to the Fomorian camp under truce, and they filled a pit in the ground with porridge — eighty gallons of milk and meal and fat, with whole pigs and goats and sheep in it — and told him he would be killed if he refused any of it. He took a ladle big enough to hold a man and a woman lying together and ate the lot, scraped the gravel at the bottom, and walked off with his belly hanging. It reads as a joke and it is not only a joke. Hospitality could not be refused, and he met it and it did not beat him.","At Samhain he met the Morrígan straddling the river Unius, one foot on either bank, and lay with her there, and she promised to bring him the blood and the heart of the Fomorian king. He rules the Brú na Bóinne until his own son swindles him out of it with a piece of wordplay. He is not the finest or the most beautiful of the Tuatha Dé. He is the one who holds it all together and is never once too proud to be laughed at."]},{id:"morrigan",name:"Morrigan",epithets:"An Mórrígan, the Great Queen · Badb, Macha, Nemain · Irish",domains:["War","Sovereignty","Prophecy","Fate","Death"],symbols:["The Crow","The Ford","Bloodied Linen","The Heifer","The Grey Cloak"],portrait:art("Morrigan.png"),portraitCaption:"Original artwork",intro:"I offered myself to the greatest warrior in Ireland, and he was busy, and he told me so. So I came at him as an eel round his legs in the ford, and a grey wolf at the cattle, and a red heifer leading the stampede, and he wounded me three times. Then I sat on a wall as an old woman milking a cow and he asked for a drink, and blessed me, and each blessing healed a wound he had made. He never worked it out until later. Men rarely do until later.",myth:["The Morrígan is a queen of battle and sovereignty who appears as one and as three — Badb the scald-crow, Macha, and Nemain the frenzy — and the boundaries between them shift with the telling. She does not fight so much as decide. She goes over armies as a crow, she screams above them, and where she settles the outcome is already arranged. She is a goddess of the land as much as of slaughter, and in Ireland those two things were never far apart, because the king held the land by being fit for her.","Her long entanglement with Cú Chulainn is the heart of her stories. She came to him at the ford in the shape of a young woman and offered herself, and he brushed her off, and she promised to hinder him. She attacked as an eel that tripped him, as a wolf that stampeded the cattle across him, as a hornless red heifer at the head of the herd, and he injured her each time. Then she met him as an old woman milking, and he took three drinks and blessed her three times without knowing, and his blessings closed the wounds he had made. Later, when he was going to his death, he passed the washer at the ford, and the clothes she was rinsing in the red water were his.","At the close of the second battle of Mag Tuired she went to the heights of Ireland and proclaimed the victory, and gave a prophecy of peace — summer through winter, milk in plenty, every man master of himself. Then she gave a second prophecy, of the end of the world: a time without honour, without truth, sons betraying fathers, an age of blade and blood. She speaks both, and neither is a threat. She is simply the one who says what is coming."]},{id:"brigid",name:"Brigid",epithets:"Brigid of the Flame · Poet, Smith and Healer · Daughter of the Dagda · Irish",domains:["Poetry","Smithcraft","Healing","Fire","Spring"],symbols:["The Perpetual Flame","The Anvil","The Well","The Cross of Rushes","Imbolc"],portrait:art("Brigid.png"),portraitCaption:"Original artwork",intro:"Poetry, smithcraft, and healing — and people always ask what three such different things are doing in one pair of hands. They are not different. Each of them is fire applied with judgement to something that will not otherwise change shape. I will tell you what else came out of me: my son was killed in a battle he had no business being in, and I went onto the field and made a sound nobody in Ireland had ever made before. That was the first keening. Grief needed a f
