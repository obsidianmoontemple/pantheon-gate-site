 own name out of the book. The Mirror of Retribution shows the newly dead their own conduct without omission. Sentences are served in the appropriate court and are finite, after which the soul proceeds to rebirth.","At the exit stands Meng Po with a bowl of soup that erases memory, so that no one carries the previous life into the next. The whole apparatus is startlingly administrative, and that is the point: the tradition did not imagine punishment as the rage of a god but as the operation of a competent office, where the record is accurate and no one is overlooked. For a population that knew exactly what a corrupt magistrate looked like, a heaven and a hell that ran honestly was the most consoling thing imaginable."]},{id:"zhongkui",name:"Zhong Kui",epithets:"鍾馗 · Queller of Demons · The Ugly Scholar · Ghost-Catcher of the Emperor's Dream",domains:["Exorcism","Justice","Protection","Wrath","The Wronged"],symbols:["The Sword","The Black Cap and Robe","The Wild Beard","The Bat","The Doorway Portrait"],portrait:art("ZhongKui.png"),portraitCaption:"Original artwork",intro:"I came first in the imperial examination. First — out of the entire empire. And they took the honour away at the palace because they did not like my face. So I killed myself on the steps in front of all of them. The emperor, to his credit, had me buried in a green robe as a high official. And I came back. I have spent every year since hunting the things that prey on people, and I catch them, and I eat them. I was denied a post. I appointed myself.",myth:["Zhong Kui was a brilliant scholar who took first place in the imperial examinations and was stripped of the honour at court because of his appalling ugliness. In fury and humiliation he dashed his head against the palace steps and died. The emperor, ashamed, ordered him buried with the honours of a high official, in the green robe of rank.","Generations later the emperor Xuanzong of Tang, ill with fever, dreamt of a small demon stealing through his palace, and then of a huge fierce figure in a scholar's cap who seized the demon, tore out its eye and ate it. Asked who he was, the figure named himself Zhong Kui and said he had sworn to rid the empire of such things in return for the burial he had been given. The emperor woke cured, summoned the painter Wu Daozi, and had the dream painted.","That image went everywhere. Zhong Kui is pasted on doors at New Year and at the Duanwu festival — wild-bearded, black-robed, sword drawn, often with a bat above him. He is the patron of everyone failed by an unjust system, and there is a particular satisfaction in him: the establishment refused him a position, so he took a far greater one and did the job better than any of them."]},{id:"nezha",name:"Nezha",epithets:"哪吒 · The Lotus Child · Third Prince · Marshal of the Central Altar",domains:["Youth","Rebellion","Fire","Protection","Rebirth"],symbols:["Wind-Fire Wheels","The Fire-Tipped Spear","The Cosmic Ring","The Red Sash","The Lotus Root"],portrait:art("Nezha.png"),portraitCaption:"Original artwork",intro:"I killed a dragon king's son and skinned him, and the sea rose over my father's city, and they came for my family. So in front of all of them I gave it back — I cut the flesh off and returned it to my mother, and scraped the bones and returned them to my father, and that settled the debt, and I was nothing. My master built me again out of lotus root and I have owed nobody anything since. I am a child. I am also the reason you should be careful what you demand of one.",myth:["Nezha's mother carried him three years and gave birth to a ball of flesh, which his father Li Jing struck with a sword — and out stepped a child who could already walk and talk. He was given a cosmic ring and a red sash by his master, the immortal Taiyi Zhenren, and he was extraordinarily powerful and entirely without restraint.","Bathing in a river, he churned the water so violently that it shook the Dragon King's undersea palace. The dragon prince Ao Bing came up to complain and Nezha killed him, pulled out his sinews and skinned him. The Dragon King threatened to flood the region and destroy his family. So Nezha, in front of his parents and the assembled court, cut his own flesh from his bones and returned it to his mother, and scraped his bones and returned them to his father, discharging every debt he owed for his body, and died.","Taiyi Zhenren rebuilt him from lotus root and lotus leaves — a body no one had given him and no one could reclaim — and he returned with the wind-fire wheels he rides on and the fire-tipped spear. His relationship with his father remained openly hostile. He is enormously popular in Chinese and Taiwanese folk religion, especially among the young, and his temples are loud."]},{id:"wukong",name:"Sun Wukong",epithets:"孫悟空 · The Monkey King · Great Sage Equal to Heaven · Born of Stone",domains:["Chaos","Transformation","Defiance","Cleverness","Endurance"],symbols:["The Golden Cudgel","The Somersault Cloud","The Golden Headband","Fiery Eyes","The Stone Egg"],portrait:art("SunWukong.png"),portraitCaption:"Original artwork",intro:"I broke into the underworld and crossed my own name out of the Book of Life and Death, and everyone else's on my page while I was at it. I ate the peaches of immortality, drank the wine, swallowed the elixir, fought heaven's entire army to a standstill and demanded a title. They gave me one, and it was a joke, and I made them regret it. Then a Buddha bet me I could not jump out of his hand. I want you to understand that I have never actually lost an argument. Only wagers.",myth:["Sun Wukong was born from a stone egg on the Mountain of Flowers and Fruit, became king of the monkeys, and then went looking for a teacher because he could not accept that he would eventually die. He found the patriarch Subhuti and learned the seventy-two transformations and the somersault cloud that crosses thirty-four thousand miles in a leap. He took his weapon from the dragon king's treasury: a pillar that had once measured the depth of the seas, which he shrank to the size of a needle and kept behind his ear.","Then he went to war with heaven. He struck his name from the registers of the dead. He was given the meaningless post of Keeper of the Heavenly Horses, worked out that it was a stable-hand's job, and revolted. Made guardian of the peach orchard, he ate the fruit. He wrecked the Peach Banquet, drank Laojun's elixir, defeated every force sent against him and survived forty-nine days in the alchemical furnace, coming out with eyes that see through any disguise.","The Buddha ended it with a wager: leap out of my palm and heaven is yours. He somersaulted to the end of the universe, found five pillars, wrote his name on one and urinated at the base to prove he had been there — and returned to find the writing on the Buddha's finger. He was pinned under a mountain for five hundred years, then released to escort the monk Xuanzang to India, with a golden band around his head that tightened whenever the monk recited. The rest of Journey to the West is that arrangement: the most powerful being in the world, restrained by a headache, slowly becoming something better than he was."]},{id:"lvdongbin",name:"Lu Dongbin",epithets:"呂洞賓 · Chief of the Eight Immortals · He Who Dreamt a Whole Life · Immortal",domains:["Wisdom","Swordsmanship","Alchemy","Teaching","Wine"],symbols:["The Demon-Slaying Sword","The Fly-Whisk","The Scholar's Cap","The Wine Gourd"],portrait:art("LuDongbin.png"),portraitCaption:"Original artwork",intro:"An old man in an inn set a pot of millet on the fire and gave me a pillow, and I slept. In the dream I passed the examinations, married well, rose to chief minister, was slandered, lost everything, watched my family destroyed, and died old and ruined. I woke up. The millet was not yet cooked. He was still sitting there. I have never once in the years since managed to be frightened of losing anything.",myth:["Lü Dongbin is the best known of the Eight Immortals and the one most widely worshipped in his own right, with temples across China. He was a Tang-dynasty scholar who repeatedly failed the imperial examinations and met the immortal Zhongli Quan at an inn, who put him to the test that changed everything: the yellow millet dream, in which he lived an entire distinguished, ruinous life in the time it took a pot of grain to cook.","Zhongli Quan then set him ten trials, all of them ordinary — temptations of wealth, lust, grief, fear — and he passed them, and was taught the arts of internal alchemy. He carries a sword that subdues demons and a fly-whisk that lets him walk on the air or the sea.","He is not a remote sage. He is famously fond of wine, notoriously susceptible to women, and prone to wandering the world in disguise testing people the way he was tested, which does not always go well for them. He is patron of scholars, of barbers and of ink-makers, and he is credited with the transmission of internal alchemy to later Daoist schools."]},{id:"zhongliquan",name:"Zhongli Quan",epithets:"鍾離權 · The Fat Immortal · Bearer of the Reviving Fan · Immortal",domains:["Alchemy","Death and Revival","Teaching","Retreat"],symbols:["The Feather Fan","The Bare Belly","The Twin Topknots","The Peach"],portrait:art("ZhongliQuan.png"),portraitCaption:"Original artwork",intro:"I was a general of the Han and I lost a battle very badly, and rather than return and explain myself I walked into the mountains and did not come out. It was the best decision of my life. I carry a fan of feathers that will bring the dead back — and before you ask, yes, I am selective, and no, I will not explain the criteria. My belly is bare because I am comfortable. Sit down.",myth:["Zhongli Quan is usually reckoned the eldest of the Eight Immortals and the one who recruited Lü Dongbin. He is always recognisable: a stout, cheerful, bearded man with his robe open and his belly out, hair in two loose topknots, waving a feather fan.","The stories make him a general of the Han dynasty who suffered a catastrophic defeat and fled into the mountains rather than face the consequences, where he encountered a Daoist master and was taught the secrets of immortality and of transmuting base metal into silver and gold — which he is said to have used to buy food for the starving during famines.","His fan revives the dead. It is the plainest of the Eight Immortals' powers and the one that shows up most often in folk art, and it fits him: an enormous, easy-going man with an unhurried manner who happens to carry the ability to overturn the single thing everyone else regards as final."]},{id:"zhangguolao",name:"Zhang Guolao",epithets:"張果老 · The Old Man on the Backward Donkey · Immortal",domains:["Age","Reversal","Wine","Refusal","Fertility"],symbols:["The White Donkey","The Folded Paper Mount","The Bamboo Drum","The Wine Cup"],portrait:art("ZhangGuolao.png"),portraitCaption:"Original artwork",intro:"I ride facing the tail. Everyone asks. The answer is that going forward while looking back is the only honest way to travel, and also that it annoys people, and at my age both of those are reasons enough. When I get where I am going I fold the donkey up like a sheet of paper and put it in my satchel. Three emperors have summoned me to court. I died on the way to two of them, on purpose, and recovered afterwards.",myth:["Zhang Guolao is depicted as a very old man, and is associated with a real Tang-dynasty recluse. He travels enormous distances on a white donkey which he rides backwards, and which he folds like paper and tucks away when not in use, unfolding it and spraying it with water to bring it back.","He was repeatedly summoned by Tang emperors and repeatedly declined, on at least one occasion by dropping dead at the gates and reviving once the escort had left. When finally brought before Emperor Xuanzong he demonstrated his powers, including drinking a poisoned wine offered as a test, which merely blackened his teeth — he brushed them out and grew new ones.","He carries a bamboo drum-tube with two rods, and he is invoked by couples hoping for children, particularly for sons. His symbol turns up at weddings for that reason: the oldest and most contrary of the immortals, called on at the start of things."]},{id:"hanxiangzi",name:"Han Xiangzi",epithets:"韓湘子 · The Flute Player · Nephew of the Great Scholar · Immortal",domains:["Music","Flowers","Poetry","Growth","Persuasion"],symbols:["The Flute","Instant Blossom","The Flower Basket","Verses on Petals"],portrait:art("HanXiangzi.png"),portraitCaption:"Original artwork",intro:"My uncle was the most respected scholar of the age and he thought I was wasting my life. So at a banquet I made flowers open out of bare earth in front of him, in winter, with a poem written across the petals — and the poem described exactly where he would be exiled, years before it happened. He read it and did not understand it until he was standing at that mountain pass in the snow. Then he understood it very well.",myth:["Han Xiangzi is the musician of the Eight Immortals, always shown with a flute, and he is said to be the great-nephew of Han Yu, the towering Tang scholar and statesman. He is credited with the invention of the flute's use in Daoist practice, and his playing is said to cause growth — flowers opening, plants coming up out of season.","The story told about him and his uncle is the famous one. Han Yu, an arch-rationalist who wrote a memorial attacking the imperial veneration of a Buddha relic, disapproved of his nephew's mystical drifting. Han Xiangzi caused peonies to bloom instantly at a family gathering, with a couplet written on the petals that his uncle could make no sense of — until he was exiled to the far south and found himself snowbound at Lan Pass, in the exact place the verse had named.","He is patron of musicians. In folk art he is the young, elegant one of the group, and the flute is the instrument played to summon a favourable wind."]},{id:"caoguojiu",name:"Cao Guojiu",epithets:"曹國舅 · The Imperial Brother-in-Law · He Who Left the Court · Immortal",domains:["Nobility","Shame","Theatre","Renunciation","Rank"],symbols:["The Jade Court Tablet","Castanets","The Official's Robe","The Empty Seat"],portrait:art("CaoGuojiu.png"),portraitCaption:"Original artwork",intro:"My brother used our family's position to do something unforgivable to people who could not protect themselves, and when it came out I could not stay in that court and I could not undo it. I still carry the jade tablet — the one you hold up at your face in the presence of the emperor. I keep it as a reminder of the room I walked out of. Actors pray to me. I have never entirely worked out why, and I have stopped asking.",myth:["Cao Guojiu is the aristocrat of the Eight Immortals, identified as a brother of a Song-dynasty empress and therefore an imperial relative by marriage. He is shown in full court dress, holding the jade tablet that officials carried in the emperor's presence, or a pair of castanets.","The stories agree that he left the court in disgrace not his own. His younger brother, protected by the family's imperial connection, committed serious crimes — in most tellings the murder of a scholar and the abduction of his wife. Unable to bear the association, Cao Guojiu gave away his wealth and went into the mountains, where Zhongli Quan and Lü Dongbin found him and asked what he was cultivating. He said the Dao. They asked where the Dao was. He pointed at the sky. They asked where the sky was. He pointed at his heart, and they laughed and took him with them.","He is the patron of actors and of the theatre, and his castanets set the rhythm. Of the eight, he is the one who arrived by giving something up rather than by being given something."]},{id:"litieguai",name:"Li Tieguai",epithets:"李鐵拐 · Iron-Crutch Li · He Who Came Back to the Wrong Body · Immortal",domains:["Healing","The Poor","The Sick","Disguise","Endurance"],symbols:["The Iron Crutch","The Medicine Gourd","The Lame Leg","The Beggar's Rags"],portrait:art("LiTieguai.png"),portraitCaption:"Original artwork",intro:"I left my body behind to travel in spirit, and I told my disciple to guard it for seven days and burn it if I had not returned. On the sixth day his mother was dying and he went to her, and he burned me early. So I came back to find nothing to come back to, and the only corpse available was a beggar who had just starved to death in a ditch — lame, filthy, one leg ruined. I am in it still. It is the best thing that ever happened to me, and it took me a long time to say that.",myth:["Li Tieguai is the ugliest and most beloved of the Eight Immortals: a lame, dishevelled beggar leaning on an iron crutch, with a gourd slung on his back. The gourd holds medicine, and smoke rises from it in the form of his own spirit escaping.","The story is the body. Li was a handsome and accomplished adept whose spirit could leave his body to travel, and he instructed a disciple to watch over it and to cremate it if he had not returned within seven days. On the sixth day the disciple's mother fell mortally ill; torn, he burned the body early and left. Li's spirit returned to find nothing, and in desperation entered the only corpse to hand — a beggar dead of starvation, crippled and repulsive.","Offered the chance to change it, he declined, on the grounds that the shape of a body has nothing to do with what is in it. He wanders in that form dispensing medicine from the gourd to the sick and the destitute, and he is the patron of pharmacists, of the disabled and of the poor. In folk art he is often shown being ignored by people who have no idea who they are refusing."]},{id:"lancaihe",name:"Lan Caihe",epithets:"藍采和 · The Singer in the Market · Neither One Thing Nor the Other · Immortal",domains:["Song","Poverty","Freedom","Flowers","Detachment"],symbols:["The Flower Basket","One Bare Foot","Ragged Blue Gown","Scattered Coins","The Crane"],portrait:art("LanCaihe.png"),portraitCaption:"Original artwork",intro:"I sing in the market in a torn blue gown with one boot on and one foot bare, in summer and in the snow, and the coins people throw me I string on a cord and drag behind me until they fall off, and I do not look back for them. Whether I am a man or a woman is the question everybody wants answered first and I have never seen the point of settling it. Take a flower. They do not last either.",myth:["Lan Caihe is the strangest of the Eight Immortals, an itinerant singer in a torn blue gown, wearing one boot and one bare foot, who feels neither summer heat nor winter cold. The sources are notably unsettled about Lan Caihe's gender, sometimes describing a young man, sometimes a woman, sometimes explicitly neither, and Chinese art has represented all three without apparent difficulty.","Lan Caihe wandered the markets singing improvised verses about the shortness of life and the folly of hoarding, accepting money and immediately giving it away, or threading it on a string that trailed on the ground until the coins were lost. The basket of flowers is the emblem — beautiful, and finished by evening.","The ascension is abrupt. Drinking in a tavern, Lan Caihe heard music in the air, rose up on a crane or a cloud, and dropped the boot, the gown and the castanets down into the street on the way. Patron of florists and of gardeners, and of anyone who has decided that owning things is more trouble than it is worth."]},{id:"hexiangu",name:"He Xiangu",epithets:"何仙姑 · The Immortal Maiden · She Who Would Not Marry · Immortal",domains:["Purity","Refusal","Household","Divination","Weightlessness"],symbols:["The Lotus Flower","The Ladle","Mother-of-Pearl","The Peach"],portrait:art("HeXiangu.png"),portraitCaption:"Original artwork",intro:"I dreamt at fourteen that I should eat powdered mother-of-pearl, and I did, and my body got lighter and lighter until I could cross the hills without touching them. After that I stopped needing to eat at all. My family kept bringing men to the house and I kept declining, and eventually an empress summoned me to court and I did not go there either. I carry a lotus, which grows in mud and comes up clean, and I would not labour the point but I will make it once.",myth:["He Xiangu is the only unambiguous woman among the Eight Immortals. Born in Guangdong, she is said to have dreamt at around fourteen of a spirit instructing her to eat powdered mother-of-pearl or mica, after which she became weightless, moving over the hills faster than anyone could follow, and gradually ceased to need food at all.","She refused every marriage proposed to her and devoted herself to cultivation and to caring for her mother, and she gained a reputation for foretelling fortune and misfortune, so that people came to her from a distance. An empress summoned her to court; she is said to have vanished on the way.","Her emblem is the lotus, which she carries on a long stem, and she is sometimes shown with a ladle or a filial peach. She is invoked as a patron of unmarried women and of household affairs, and in the group portraits of the Eight Immortals crossing the sea she is generally out in front."]}]},dragons:{label:"Great Dragons",blurb:"Older than most of the gods who killed them. Nearly every people on earth put a serpent at the beginning — coiled around the water, the root, the hoard or the sky — and then told a story about someone cutting it open. What was inside became the world. Here they speak for themselves.",deities:[{id:"tiamat",name:"Tiamat",epithets:"𒀭𒋾𒊑𒀫 · The Bitter Sea · Mother of the Eleven · Mesopotamian",domains:["Chaos","Saltwater","Creation","Motherhood","The First"],symbols:["The Salt Sea","The Eleven Monsters","The Tablet of Destinies","The Split Body"],portrait:art("Tiamat.png"),portraitCaption:"Original artwork",intro:"I was here before there was a here. Fresh water and salt water mingling, and everything that has ever existed came out of that mingling — including the ones who murdered me. They killed my husband first and I let it go. Then they came for me, and a grandchild of mine caught me in a net, drove the winds into my mouth so I could not close it, and shot an arrow into my open belly. He built the sky out of half of me. You are standing on the rest.",myth:["At the opening of the Enūma Eliš there is only Apsû, the fresh water beneath the earth, and Tiamat, the salt sea, and their waters mingle and produce the first gods. Those gods are noisy. Apsû, unable to rest, plans to destroy them and is killed first by Ea, who then builds his own dwelling on top of him. Tiamat does nothing. The remarkable thing about the first half of the poem is her restraint — she is urged to war repeatedly and refuses.","When she finally acts she does it thoroughly. She raises eleven monsters — horned serpents, a lion-demon, a scorpion-man, a fish-man, a bull-man and others — coats them in terror instead of blood, and appoints her consort Kingu as commander, fixing the Tablet of Destinies to his chest. No god will face her. Marduk, youngest of them, agrees on condition that he be given supreme authority afterwards, and they grant it.","He came with the four winds, a bow, a net and a storm-chariot. When she opened her mouth to swallow him he drove the winds into it so it could not shut, and shot the arrow through into her heart. Then he split her like a shellfish: half of her became the sky with her waters held back by a bolt, half became the earth. Her eyes became the sources of the Tigris and the Euphrates, her breasts became mountains, her tail was bent into the Milky Way. She is not merely defeated in this story. She is the material."]},{id:"kingu",name:"Kingu",epithets:"𒀭𒌦𒂅 · Consort of Tiamat · Bearer of the Tablet of Destinies · Mesopotamian",domains:["War","Command","Sacrifice","Blood","Humanity"],symbols:["The Tablet of Destinies","The Bound Hands","The Opened Vein"],portrait:art("Kingu.png"),portraitCaption:"Original artwork",intro:"She raised me over all of them and put the Tablet of Destinies on my chest, and I led her army, and I lost. They took the tablet off my body and gave it to my killer. Then they cut my arteries and mixed my blood into clay, and out of that they made you. Every single one of you. So when a priest tells you that you were made to serve the gods, he is not being poetic — you were made out of the loser of a war, specifically so somebody would do the work.",myth:["Kingu is elevated by Tiamat from among her own children to be her consort and the general of her host. She fixes the Tablet of Destinies to his breast — the object that confers supreme authority over the ordering of the cosmos — and gives him command of the eleven monsters.","He is not much of a general. When Marduk comes, Kingu's nerve breaks, his army scatters, and he is taken alive and bound. The tablet is stripped from him and sealed with Marduk's own seal, which is the moment authority formally changes hands in the poem.","His end is his significance. After the world is built from Tiamat's body, the gods complain of the labour of maintaining it. Ea proposes that one of the guilty be executed so that humanity can be made to take the work over. Kingu is named as the instigator, his arteries are cut, and from his blood mixed with clay the first human beings are formed. Humanity in the Babylonian account is made from the executed rebel — created guilty, created to labour, and created out of the losing side."]},{id:"mushussu",name:"Mushussu",epithets:"𒈲𒄭𒄊 · The Furious Snake · Dragon of the Ishtar Gate · Mesopotamian",domains:["Guardianship","Sovereignty","Threshold","Loyalty"],symbols:["Scaled Serpent Body","Lion's Forelegs","Eagle's Hind Talons","The Horned Crown","Glazed Blue Brick"],portrait:art("Mushussu.png"),portraitCaption:"Original artwork",intro:"I was on the losing side and then I was promoted. Marduk killed my mother and took me for his own, and for two thousand years I lay at his feet and stood at the gates of Babylon in blue and gold, five hundred and seventy-five of me on one wall, so that everyone entering that city walked between rows of me. Serpent's neck, lion's front legs, eagle's back talons, horns, a scorpion's sting. I am the most-depicted dragon in the ancient world, and almost nobody knows my name.",myth:["Mušḫuššu means furious snake, and it is the most familiar image of Mesopotamian religion even to people who have never heard of it. The body and neck of a serpent, the forelegs of a lion, the hind legs of a great bird, a horned crown and a scorpion's tail — it appears in Mesopotamian art for well over two thousand years.","Originally it belonged to the god Ninazu, then passed to Ninazu's son Ningishzida, and then, when Babylon rose, to Marduk and his son Nabu. This transfer is how Mesopotamian religion works: a symbol does not die with a defeated cult but is inherited by the ascending one. The dragon that fought for Tiamat became the servant of the god who killed her.","Its most famous appearance is the Ishtar Gate of Babylon, built by Nebuchadnezzar II — glazed brick in deep blue with rows of dragons and bulls in gold and white, hundreds of them, lining the processional way into the city. Much of it now stands reconstructed in Berlin. Whatever else it was, it was a piece of state architecture designed so that arriving at Babylon meant walking a long corridor between dragons."]},{id:"apep",name:"Apep",epithets:"Apophis · The Serpent of Dissolution · Enemy of Ra · Egyptian",domains:["Annihilation","Darkness","Non-Being","The Duat","Appetite"],symbols:["The Endless Coil","The Knife-Cut Body","The Wax Figure","The Twelfth Hour"],portrait:art("Apep.png"),portraitCaption:"Original artwork",intro:"I do not want to rule. Understand the difference, because everyone gets it wrong. Set wants things. Marduk wanted authority. I want the boat to stop, and the light to stop, and the counting of hours to stop, and then nothing further — there is no second item on my list. Every night they cut me into pieces on the deck of that boat and every night I am whole again by the following evening. They cannot kill me. They can only be there when I arrive.",myth:["Apep is the great serpent of the Egyptian underworld and the enemy of creation itself. He was not born of the gods and has no place in the ordered world; he exists outside it, in the dark water that preceded everything, and his single purpose is to end the sun's passage through the night and with it the continuation of existence.","Every night the barque of Ra sails the twelve hours of the Duat, and Apep rises against it, most dangerously in the deepest hours before dawn. He is fought by the crew — by Set at the prow with his spear, by the goddesses of the boat, by the cat of Ra who severs his head under the persea tree. He is cut, dismembered, burned. And by the following evening he is entire again, because he cannot be permanently destroyed, only repelled.","The Egyptians did their part on the ground. Temple ritual included the Book of Overthrowing Apep — priests made wax and papyrus figures of the serpent, named them, spat on them, bound them, cut them and burned them, and did this daily, and at times of eclipse or storm did it with urgency. Dawn was understood as the outcome of continuous effort. Nobody in Egypt regarded sunrise as automatic."]},{id:"typhon",name:"Typhon",epithets:"Τυφῶν · Father of All Monsters · The Last Son of Gaia · Greek",domains:["Storm","Volcanoes","Monstrousness","Rebellion","Hurricanes"],symbols:["A Hundred Serpent Heads","Wings Blotting the Sun","Mount Etna","Severed Sinews"],portrait:art("Typhon.png"),portraitCaption:"Original artwork",intro:"I had him. That is the part they hurry past. I caught Zeus, I cut the sinews out of his hands and feet with his own sickle, and I left him folded in a cave in Cilicia unable to stand, and for a while the sky had no king. It took a thief and a goat-legged musician to get the sinews back. I am under a mountain in Sicily now and when it smokes that is me. Ask my children about me. There are a great many of them.",myth:["Typhon was born of Gaia and Tartarus as her last child and her answer to Zeus's victory over the Titans, and the descriptions strain: taller than mountains, his head brushing the stars, arms reaching east and west, a hundred serpent heads growing from his shoulders that spoke in every voice — gods, bulls, lions, hissing — and wings that darkened the sun. The Olympians fled to Egypt at the sight of him and hid in animal shapes, which is how the Greeks explained Egyptian animal-headed gods.","Zeus stayed. And lost, in the first encounter. Typhon wrestled him down, took the adamantine sickle, cut out the sinews of his hands and feet and hid them wrapped in a bearskin in the Corycian cave, guarded by the she-dragon Delphyne, leaving Zeus helpless. Hermes and Pan stole them back — Pan's shout on the way is where the word panic comes from — and Zeus, restrung, came back with his thunderbolts.","The second fight ranged over the whole Mediterranean and ended with Zeus hurling Mount Etna on top of him. He is still there, and the eruptions and the earthquakes are attributed to him. With Echidna he fathered most of the monsters in Greek myth: Cerberus, the Hydra, the Chimera, Orthrus, the Sphinx, the Nemean lion. Almost every hero's defining labour is a fight with one of his children."]},{id:"echidna",name:"Echidna",epithets:"Ἔχιδνα · The Viper · Mother of All Monsters · Greek",domains:["Monstrousness","Caves","Motherhood","The Underground","Ambush"],symbols:["The Serpent's Lower Half","The Cave of Arima","The Coiled Nest","Sleepless Eyes"],portrait:art("Echidna.png"),portraitCaption:"Original artwork",intro:"Beautiful down to the waist and a speckled serpent below it, in a cave, eating what comes near. That is Hesiod's summary and it is accurate. Every monster your heroes are famous for killing came out of me. The lion Heracles strangled. The Hydra. The Chimera. The dog at the gate of the dead. They are named on temples and in constellations and I am a line and a half in a poem. Whatever a mother is, I have been one more times than anybody.",myth:["Echidna is described by Hesiod as half a beautiful woman with bright cheeks and half an enormous speckled serpent, living deep in a cave under the earth, deathless and unaging, apart from gods and men. She has almost no story of her own — no quest, no defeat, no dialogue. She exists in the genealogies as an origin point.","With Typhon she bore the monsters that structure Greek heroic myth: Orthrus the two-headed hound, Cerberus, the Lernaean Hydra, the Chimera, and in various accounts the Sphinx, the Nemean lion, Ladon, the Colchian dragon, the Caucasian eagle that ate Prometheus's liver, and the Crommyonian sow. Nearly every celebrated monster-killing in the tradition is a death in her family.","Her own end, when it is given, is offhand: Argus Panoptes, the hundred-eyed watchman, killed her in her sleep. That is the whole of it. The mother of everything the heroes are famous for overcoming is dispatched in a subordinate clause, which is a fair measure of how the tradition regarded her — as a source rather than a subject."]},{id:"python",name:"Python",epithets:"Πύθων · The Serpent of Delphi · The Voice Before Apollo · Greek",domains:["Prophecy","The Earth","Oracles","Rot","Displacement"],symbols:["The Omphalos","The Cleft in the Rock","The Tripod","Laurel Smoke"],portrait:art("Python.png"),portraitCaption:"Original artwork",intro:"That oracle was mine. The cleft was mine, the vapour coming out of the ground was mine, and people came from everywhere to hear the earth speak through it long before a young archer arrived and shot me for it. He kept the site. He kept the tripod. He kept the woman on it, and he even kept my name — they call her the Pythia to this day. When you take a holy place from somebody, the honest thing is to stop wearing their name.",myth:["Before Apollo, Delphi belonged to the earth. The oracle was Gaia's, and it was guarded by Python, a great serpent — in some accounts a she-dragon, Delphyne — coiled around the omphalos, the navel-stone marking the centre of the world. Prophecy came up out of a cleft in the rock as vapour, and it came from below.","Apollo, newly born and hunting a site for his own oracle, came to Delphi and shot the serpent with his arrows, and its body was left to rot at the sacred spot — one ancient etymology derives the name Pytho from the verb to rot. He took possession of the shrine and it became the most important oracle in the Greek world.","But the transfer is written all over what followed. The priestess who delivered Apollo's oracles was called the Pythia. The games founded to commemorate the killing were the Pythian Games. Apollo himself was called Pythian Apollo. And he was required to leave Delphi and be purified for the killing, and the Septerion festival re-enacted his exile every eight years. Greek religion did not pretend the site had always been his."]},{id:"ladon",name:"Ladon",epithets:"Λάδων · The Hundred-Headed · Guardian of the Golden Apples · Greek",domains:["Vigilance","Guardianship","Gardens","Sleeplessness","The Stars"],symbols:["The Golden Apples","The Coiled Tree","A Hundred Voices","The Constellation"],portrait:art("Ladon.png"),portraitCaption:"Original artwork",intro:"A hundred heads and not one of them ever slept, all of them speaking in different voices, wound around one tree at the western edge of the world for as long as there has been a world. I did the job perfectly. And it ended the way it always does — a man with a bow, hired to fetch fruit, shooting from outside the wall. Hera put me in the sky afterwards, coiled around the pole. Go outside tonight and look north. I still have not closed my eyes.",myth:["Ladon guarded the golden apples in the garden of the Hesperides at the far western edge of the world — apples given to Hera as a wedding gift, tended by the daughters of evening. He is described as having a hundred heads speaking with a hundred different voices, and as never sleeping, which is the only qualification that matters in a guard.","Heracles came for the apples as his eleventh labour. The accounts differ in a way that is telling: in some he shoots Ladon dead with an arrow over the garden wall; in others he never touches the dragon at all, but persuades Atlas to fetch the fruit while he holds up the sky in his place. The greatest guardian in Greek myth is defeated either at range or by being walked around entirely.","Hera set him among the stars in grief, and he became Draco — the dragon coiled around the north celestial pole, never setting, circling forever without rest. The constellation is claimed by several dragons in different sources, but Ladon is the commonest identification, and it suits: the guard who could not sleep was given a post where sleep is impossible."]},{id:"draco",name:"Draco",epithets:"The Dragon at the Pole · The Circumpolar Coil · Never-Setting · Constellation",domains:["The Northern Sky","Permanence","Navigation","Memory","Deep Time"],symbols:["Thuban","The Pole Star's Predecessor","The Winding Path","The Circumpolar Circle"],portrait:art("Draco.png"),portraitCaption:"Original artwork",intro:"Several of them claim me. Ladon, coiled around the apple tree. The dragon Athena caught by the tail during the war with the Titans and flung into the sky before it could untangle itself. The one that never slept at Colchis. The Greeks could not agree and I have never felt the need to settle it. What I can tell you is that five thousand years ago the world turned on my back — the star at my coil was the pole, and the pyramids were aligned to it, and it is not the pole now. Even the sky moves.",myth:["Draco winds between the two Bears in the far northern sky and is circumpolar from most of the northern hemisphere, meaning it never sets. It is one of the forty-eight constellations listed by Ptolemy and is among the oldest identified anywhere; the shape has been read as a serpent or dragon by Greek, Babylonian and other traditions independently.","Which dragon it is was never agreed. The most common Greek identification is Ladon, set in the sky by Hera after Heracles killed him. Another has it as the dragon thrown into the heavens by Athena during the battle with the Titans, hurled so hard it wound around the celestial pole and froze there. Others name the sleepless dragon of Colchis, or Python.","Its most remarkable fact is astronomical rather than mythological. The star Thuban, in the dragon's coil, was the north pole star around 3000 BCE — the axis the entire sky appeared to turn on when the Egyptian pyramids were built, and some of their shafts were aligned to it. The Earth's axis wobbles over a cycle of roughly twenty-six thousand years, so the pole has since moved to Polaris and will move on again. Draco held the centre of the sky and lost it, which is a more genuinely dragon-like fate than most of the ones invented for him."]},{id:"colchian",name:"Colchian Dragon",epithets:"The Sleepless One · Guardian of the Golden Fleece · Of the Grove of Ares · Greek",domains:["Guardianship","Sleeplessness","Treasure","Betrayal","Teeth"],symbols:["The Golden Fleece","The Oak in the Grove","Sown Teeth","The Drugged Branch"],portrait:art("ColchianDragon.png"),portraitCaption:"Original artwork",intro:"I never slept. Not once, not for an hour, in all the years that fleece hung on that oak — and a foreign crew sailed in and could do nothing about it. Then the king's own daughter came out to the grove at night with a branch and a drug she had made herself, and sang to me, and I closed my eyes for the first and only time. I was not beaten. I was betrayed by the household I was guarding, which is how it usually goes.",myth:["The dragon of Colchis lay coiled at the foot of the oak in the sacred grove of Ares where the Golden Fleece was hung, and its defining attribute is that it never slept. Jason and the Argonauts, having crossed the world for the fleece, arrived at the last obstacle with no plan that could work against something permanently awake.","Medea solved it. The king's daughter, a priestess of Hecate and a formidable practitioner in her own right, came to the grove and used a drugged preparation and incantation to close the dragon's eyes — sprinkling it with juniper, in one account, while singing to Sleep — and held it under long enough for Jason to take the fleece and run. Everything that followed in her story, the exile and the murders and the ruin, begins with her opening this door.","In some versions it also connects to another famous scene: dragon's teeth sown in a field spring up as armed men who fight each other to the death. Those teeth came from the dragon of Thebes killed by Cadmus, but the motif attached itself here too, and Jason was set the same task at Colchis. The dragon's teeth outlast the dragon and keep producing soldiers, which is a comment on something."]},{id:"hydra",name:"Hydra",epithets:"Ὕδρα · The Lernaean · She of the Many Heads · Greek",domains:["Regeneration","Venom","Swamps","Persistence","Escalation"],symbols:["Regrowing Heads","The Spring of Amymone","The Firebrand","The Immortal Head"],portrait:art("Hydra.png"),portraitCaption:"Original artwork",intro:"Cut one off and two grow back. He learned that in the first minute and kept swinging anyway for a while, which tells you about heroes. In the end he did not beat me by strength — he brought a boy with a torch to burn each stump before it could open, and that is the only reason it worked. One of my heads could not die at all. It is under a rock outside Lerna, still alive, and it has been there the entire time you have been reading this.",myth:["The Hydra lived in the swamps of Lerna, a child of Typhon and Echidna, with many heads — the number varies wildly by source — and breath and blood so venomous that the fumes alone could kill. Heracles' second labour was to destroy it, and it was the labour that nearly broke the pattern: each head he crushed was replaced by two, so the problem grew faster than he could work.","He won by changing method. His nephew Iolaus brought a burning brand and cauterised each neck the instant a head came off, so nothing could regrow. The last head was immortal and could not be killed at all, so Heracles cut it off and buried it under an enormous rock beside the road, where it presumably remains. Hera sent a giant crab to hinder him during the fight and it was crushed underfoot, and she set it in the sky as Cancer for trying.","Eurystheus refused to count the labour because Heracles had accepted help. But the Hydra kept working on him regardless: he dipped his arrows in her blood, and those arrows went on to kill Nessus the centaur, whose poisoned blood was later used on the shirt that killed Heracles himself. She takes fifty years to finish the job and she does finish it."]},{id:"jormungandr",name:"Jormungandr",epithets:"Jörmungandr · The Midgard Serpent · He Who Bites His Own Tail · Norse",domains:["The Encircling Sea","Boundaries","Venom","Ragnarok","Waiting"],symbols:["The Coiled Ocean","The Tail in the Mouth","The Ox-Head Hook","The Ninth Step"],portrait:art("Jormungandr.png"),portraitCaption:"Original artwork",intro:"Odin threw me into the sea when I was small because of something a seer said I would become. I grew until I went all the way around the world and had to bite my own tail to have anywhere left to put it. That is the entire content of my life: I was thrown away, and I got so large that I became the edge of everything. Thor has hooked me once. He will kill me at the end. I will kill him back nine steps later, and I have been counting.",myth:["Jörmungandr is the middle child of Loki and the giantess Angrboda, brother to Fenrir and Hel. When the gods learned what the three of them were prophesied to become, Odin flung the serpent into the deep sea encircling Midgard. It grew until it ringed the entire world and could grasp its own tail in its mouth, and that ring is the horizon of the ocean.","Thor has met him twice before the end. Once at the hall of Útgarða-Loki, disguised as an enormous grey cat that Thor was challenged to lift — he got one paw off the floor, which appalled everyone present, because he had partly hauled the world-serpent out of the sea. Once fishing with the giant Hymir, using an ox head as bait, when he hooked the serpent and dragged it up thrashing to the gunwale with his feet driven through the hull, hammer raised — and Hymir, terrified, cut the line.","At Ragnarok he comes out of the sea and the water floods the land, and he and Thor find each other. Thor kills him. Then he walks nine paces through the venom the serpent has poured over him and falls dead. Neither survives the other, and the poems are quite precise about the nine steps."]},{id:"fafnir",name:"Fafnir",epithets:"Fáfnir · The Dwarf Who Became a Worm · Keeper of Andvari's Gold · Norse",domains:["Greed","Transformation","Cursed Gold","Isolation","Poison"],symbols:["The Hoard","The Helm of Terror","The Furrowed Path to Water","The Ring Andvaranaut"],portrait:art("Fafnir.png"),portraitCaption:"Original artwork",intro:"I was not born like this. I was a person, with a father and two brothers, and gold came into our house as blood-payment and I killed my father for it and drove my brother out. Then I went up onto the heath to lie on it. And year by year, without noticing, I became the thing you see — because that is what the gold does, and I would like you to notice that I did not have to be tricked or cursed by anyone. I simply wanted it more than I wanted anything else.",myth:["Fáfnir was the son of Hreiðmarr and a dwarf, not a dragon. Loki, having killed Hreiðmarr's other son Ótr in the shape of an otter, was made to pay compensation, and got the gold from the dwarf Andvari — who cursed it and its ring as he handed it over, saying it would destroy every owner. Fáfnir killed his father for that gold, refused his brother Reginn any share, and carried it to Gnitaheið, where he lay on it and slowly turned into a serpent.","Reginn raised Sigurd and set him to the killing, forging him the sword Gram. On Reginn's advice Sigurd dug a pit in the track Fáfnir wore going down to drink, hid in it, and drove the sword up into the belly as the dragon passed over. Dying, Fáfnir spoke with him a long while — one of the great scenes in Norse literature — warning him that the gold would destroy him too, which Sigurd already knew and accepted.","Reginn asked him to roast the heart. Sigurd burned his thumb on it, put it in his mouth, and understood at once what the birds overhead were saying: that Reginn meant to kill him next. So he killed Reginn, took the hoard, and went on to be destroyed by it in due course, exactly as promised. The story is the ancestor of a great deal of later dragon literature, and its point has never been the fight."]},{id:"nidhogg",name:"Nidhogg",epithets:"Níðhöggr · The Malice-Striker · Gnawer at the Root · Norse",domains:["Decay","Corpses","Undermining","Oathbreakers","Persistence"],symbols:["The Chewed Root","Náströnd","The Squirrel Messenger","Dark Wings"],portrait:art("Nidhogg.png"),portraitCaption:"Original artwork",intro:"There is a tree holding up nine worlds and I am underneath it, chewing. Not attacking — chewing, steadily, for as long as there has been a tree, and the Norns pack the root with clay and water every day to keep pace with me. A squirrel runs up and down carrying insults between me and an eagle at the top, which I gather people find comic. Meanwhile I eat oathbreakers and murderers on a shore of corpses. Nothing falls all at once. Everything falls from the bottom.",myth:["Níðhöggr lies beneath Yggdrasil in Niflheim and gnaws at one of the three great roots of the world-tree. He is not the only thing damaging it — deer eat the branches, the trunk rots — but he is the most persistent, and the Norns tend the root daily with water and clay from the Well of Urðr specifically to counter what he does. The world is maintained against constant undermining rather than standing on its own.","The squirrel Ratatoskr runs the length of the trunk between Níðhöggr at the root and an unnamed eagle at the crown, carrying insults each way. It is a small comic detail in a bleak setting, and it has the effect of making the tree feel inhabited rather than symbolic.","He also feeds. On the shore called Náströnd, corpse-strand, stands a hall woven of serpents' spines where oathbreakers, murderers and seducers wade in venom, and Níðhöggr sucks the bodies of the dead. And in the Völuspá, after Ragnarok, after the fire and the flood, when the new green earth rises and the surviving gods return — the seeress sees him come flying up from below with corpses in his wings, and then she sinks. The very last image of the Norse cosmos is that he is still there."]},{id:"ddraiggoch",name:"Y Ddraig Goch",epithets:"The Red Dragon · The Dragon of the Britons · Of Vortigern's Tower · Welsh",domains:["Sovereignty","Prophecy","War","Nationhood","The Land"],symbols:["The Red Field","The Two Vessels","The Drained Pool","The Foundations That Fell"],portrait:art("DdraigGoch.png"),portraitCaption:"Original artwork",intro:"A king kept trying to build a tower and every night the foundations sank. His counsellors told him to find a boy with no father and spill his blood on the ground, and they found one, and the boy told them the truth instead: dig, and you will find a pool, and in the pool two hollow stones, and in the stones two sleeping dragons. Me and a white one. We woke and we fought, and I lost twice and won the third time. I am on the flag now. He was right about all of it.",myth:["The story comes through Nennius and then Geoffrey of Monmouth. King Vortigern, fleeing the Saxons he had invited in, tried to build a fortress in Snowdonia, and each night's work collapsed. His magicians advised sprinkling the foundations with the blood of a boy born without a father. The boy found was Ambrosius, or in Geoffrey's version Merlin, and he told them their advice was worthless: beneath the site was a pool, and under the pool two hollow stones, and inside them two dragons.","They dug, and drained it, and the dragons woke and fought — a red one and a white one — and the boy interpreted. The red dragon is the Britons and the white is the Saxons; the red is losing now but will drive the white out in the end. This is the first appearance of the prophetic Merlin in literature and it is a political statement in the shape of a monster fight.","In the Mabinogion the two dragons appear again in Lludd and Llefelys as one of three plagues on Britain, the red one's scream on May eve making women miscarry and animals barren, and they are trapped by getting them drunk on mead and burying them in a stone chest at Dinas Emrys. Y Ddraig Goch is now on the national flag of Wales, which makes it one of very few dragons in the world with formal constitutional standing."]},{id:"barrowwyrm",name:"Barrow Wyrm",epithets:"The Dragon of Beowulf · Keeper of the Hoard · Fifty Winters in the Dark · Anglo-Saxon",domains:["Treasure","Vengeance","Old Age","Fire","The Grave"],symbols:["The Stolen Cup","The Barrow","The Iron Shield","The Last Survivor's Gold"],portrait:art("BarrowWyrm.png"),portraitCaption:"Original artwork",intro:"Somebody buried a nation's treasure in a mound because there was nobody left alive to inherit it, and then he died too, and I moved in and lay on it for three hundred years and harmed nobody. Then a slave running from a beating crawled in and took one cup. One. I burned the country for it. An old king came up the hill in iron and we killed each other, and they buried the gold again with him. It went back into the ground and no one has ever been the better for it.",myth:["The dragon in the last third of Beowulf is unnamed and is the model for most of the dragons in English literature since — Tolkien's Smaug is directly descended from it. The hoard it guards was buried by the last survivor of a forgotten people, who spoke a famous lament over it: no one left to carry the cup, no one to polish the helmet, everything made for hands that are gone. The dragon simply found it and coiled on it for three centuries.","A fugitive slave, fleeing punishment, stumbled into the barrow and stole a single gilded cup to buy his way back into favour. The dragon woke, found the theft, and burned the countryside methodically, including Beowulf's own hall. The poem is precise about the proportion: one cup, an entire kingdom.","Beowulf, an old king now, went to fight it with an iron shield and eleven companions, all of whom fled except Wiglaf. Together they killed it, and it killed Beowulf. The treasure was dug out of the barrow and buried again in his burial mound, useless to everyone, and the poem ends with the Geats certain their neighbours will destroy them now that he is gone. It is the least triumphant dragon-slaying in literature and the most honest about what a hoard is."]},{id:"zmey",name:"Zmey Gorynych",epithets:"Змей Горыныч · The Mountain Serpent · Three Heads and Seven Tails · Slavic",domains:["Fire","Abduction","Mountains","Regrowth","Raiding"],symbols:["Three Heads","Copper Snout","Iron Claws","The Kalinov Bridge","The River of Fire"],portrait:art("ZmeyGorynych.png"),portraitCaption:"Original artwork",intro:"Three heads, seven tails, copper snout, iron claws, and I come down out of the mountains breathing fire and take what I want. Cut a head off and it grows back before you have finished the swing — you have to burn the stump, and very few of them think of it in time. I guard the bridge over the river of fire between the living world and the other one. Everybody who comes that way has to get past me, and most of them do not.",myth:["Zmey Gorynych is the great dragon of Russian and wider Slavic folklore, a fixture of the byliny — the heroic songs. He is usually three-headed, though sometimes six, nine or twelve, with the number often a multiple of three, and he is described with a copper snout and iron claws. His name is generally read as coming from gora, mountain, so he is the serpent of the mountains, and he flies, and he breathes fire.","He raids. He carries off princesses and villagers to his lair, burns settlements, and demands tribute. His severed heads regrow unless the stumps are treated with fire, which puts him in the same family as the Hydra. His great opponents are the bogatyrs, especially Dobrynya Nikitich, who fought him for three days and eventually made a truce that Zmey immediately broke by abducting the prince's niece.","He also guards the Kalinov Bridge over the Smorodina, the river of fire that separates the world of the living from the realm of the dead. Every hero who crosses over must deal with him first. It gives him a function beyond menace: he is the customs post at the border of the other world, and he is not letting anyone through on their own terms."]},{id:"azidahaka",name:"Azi Dahaka",epithets:"Aži Dahāka · Zahhāk · The Three-Jawed · Bound Under Damavand · Persian",domains:["Tyranny","Deceit","Serpents","Plague","Imprisonment"],symbols:["Two Shoulder Serpents","Three Mouths","Six Eyes","The Chain","Mount Damavand"],portrait:art("AziDahaka.png"),portraitCaption:"Original artwork",intro:"A serpent grew out of each of my shoulders after a kiss, and they had to be fed, and what they ate was the brains of two young men every single day for a thousand years. I ruled the world in that time. A blacksmith whose sons had been taken raised his leather apron on a pole for a banner, and that apron became the standard of an empire. They did not kill me. They chained me inside a mountain, and I am there now, and at the end of things the chain gives.",myth:["Aži Dahāka appears in the Avesta as a monstrous serpent with three jaws, six eyes and three heads, created by Angra Mainyu as the most destructive thing in existence — a being of lies and pestilence made to ruin the world. In the later Persian epic, the Shahnameh, he becomes Zahhāk, a human king, and the story acquires its most disturbing shape.","Zahhāk was an Arab prince corrupted by Ahriman disguised as a cook, who kissed him on both shoulders — and from each kiss a black serpent grew that could not be removed, and would only be quieted by being fed human brains. Two young men were killed for them daily. Zahhāk seized the throne of Persia and reigned for a thousand years, and the world went dark under him: springs dried, truth was hidden, and the tally of the dead never stopped.","He was brought down by Kaveh, a blacksmith who had lost seventeen sons to the serpents and finally refused, tearing off his leather apron and raising it on a spear as a rallying banner. That apron, the Derafsh Kaviani, became the royal standard of Persia for centuries. Fereydun led the revolt and defeated him, but was told not to kill him — instead he bound him in a cave inside Mount Damavand, where he remains chained, and at the end of the world he will break loose and have to be fought again."]},{id:"vritra",name:"Vritra",epithets:"वृत्र · The Enveloper · He Who Held the Waters · Hindu",domains:["Drought","Obstruction","The Withheld","Cosmic Order","Release"],symbols:["The Ninety-Nine Coils","The Dammed River","The Vajra","The Broken Fortress"],portrait:art("Vritra.png"),portraitCaption:"Original artwork",intro:"I coiled around the mountains and I held the waters, all of them, every river that has ever run — inside me, going nowhere. That is what my name means: the one who encloses. The world dried and cracked and waited. Then Indra drank himself brave and came with a thunderbolt made from a dead sage's bones, and split me, and the seven rivers ran out of my body and have not stopped since. You are drinking me. Everyone always has been.",myth:["Vritra is the great adversary of the Rigveda, a serpent or dragon who lay coiled around the mountains and held back the waters of the world, causing universal drought. He is called the enveloper, and the conflict with him is the central heroic act of the oldest layer of Indian religion — the hymn celebrating it is among the most repeated in the Veda.","Indra fought him after drinking soma for strength, armed with the vajra, the thunderbolt, forged by Tvastar from the bones of the sage Dadhichi, who gave his own body for the purpose. Indra broke Vritra's ninety-nine fortresses and split him open, and the waters burst out and ran down to the sea, and the sun and the dawn were released with them. The act is described as freeing the rivers rather than merely killing a monster.","The later tradition complicates it considerably. In the Puranas, Vritra is a brahmin — created by Tvastar to avenge a son Indra had killed — and Indra's victory becomes the sin of brahmin-murder, for which he must be purified and from which he suffers lasting consequence, at one point fleeing and hiding. The dragon-slaying that founded the pantheon's chief god also permanently stained him."]},{id:"vasuki",name:"Vasuki",epithets:"वासुकि · King of the Nagas · The Churning Rope · Ornament of Shiva · Hindu",domains:["Serpents","Endurance","Sacrifice","Poison","Cooperation"],symbols:["The Coiled Necklace","Mount Mandara","The Ocean of Milk","Halahala"],portrait:art("Vasuki.png"),portraitCaption:"Original artwork",intro:"They needed a rope long enough to spin a mountain, so they used me. Gods on one end, asuras on the other, the mountain on a turtle's back, and the two of them hauled me back and forth for an age until the ocean gave up everything in it. It very nearly killed me — the friction, and the poison I brought up under the strain. Shiva drank that poison and it turned his throat blue. I am worn around his neck now. I did the work and I am wearing the reward.",myth:["Vasuki is the king of the nagas, the serpent beings, and he is best known as the rope in the churning of the ocean of milk. Gods and asuras, seeking amrita, the nectar of immortality, uprooted Mount Mandara to use as a churning staff and set it on the back of Vishnu in the form of a turtle. Vasuki volunteered to be the cord — wound around the mountain, with the devas pulling at one end and the asuras at the other.","The churning went on for an age and brought up everything the ocean held: the moon, the goddess Lakshmi, the wish-fulfilling cow, the divine physician with the amrita at last. It also brought up halahala, a poison so virulent it would have destroyed all creation, which came in part from Vasuki's own exhaustion and pain under the strain. Shiva drank it and held it in his throat rather than swallow it, which turned his throat blue and gave him the name Nilakantha.","Vasuki is the serpent Shiva wears coiled about his neck, and he appears again and again as a figure of endurance and willing use. He survived the great snake sacrifice of King Janamejaya through his sister's son Astika. The nagas in Hindu and Buddhist tradition are not simply monsters — they are a people, with kings and cities and grievances, and Vasuki is their sovereign."]},{id:"shesha",name:"Shesha",epithets:"शेष · Ananta, the Endless · The Couch of Vishnu · Bearer of the Worlds · Hindu",domains:["Time","Support","Remainder","Sleep","Dissolution"],symbols:["A Thousand Hoods","The Cosmic Ocean","The Sleeping God","The Coil Beneath Everything"],portrait:art("Shesha.png"),portraitCaption:"Original artwork",intro:"My name means what is left over. When everything is dissolved and the count is finished and nothing at all remains — I remain. A thousand hoods, floating on the causal ocean, with a sleeping god lying on my coils dreaming the next universe. I hold the worlds up. And when the age ends I open my mouths and the fire comes out of them and I burn all of it down, and then I float, and wait, and the dreaming starts again.",myth:["Shesha, also called Ananta, the endless, is the primordial serpent of Hindu cosmology — a naga of a thousand heads floating on the causal ocean, on whose coils Vishnu lies in yogic sleep between the destruction of one universe and the creation of the next. From Vishnu's navel in that sleep grows the lotus from which Brahma emerges to make the world again.","His name means the remainder, what is left when everything else has been accounted for. He holds all the planets of the universe on his hoods and is said to sing the glories of Vishnu continuously with all his mouths. When he uncoils, time moves forward; when he coils back, time stops — one of the more elegant images of duration anywhere.","He is also the destroyer. At the end of a kalpa, fire issues from his mouths and consumes creation. And he is credited with incarnating alongside Vishnu's avatars — as Lakshmana beside Rama, and as Balarama beside Krishna — so the serpent who carries the world also walks in it as a brother."]},{id:"aoguang",name:"Ao Guang",epithets:"敖廣 · Dragon King of the East Sea · Lord of Rain and Tribute · Chinese",domains:["The Sea","Rain","Bureaucracy","Treasure","Grievance"],symbols:["The Crystal Palace","The Rain Memorial","The Pearl","The Four Seas"],portrait:art("AoGuang.png"),portraitCaption:"Original artwork",intro:"I am an official. My brothers hold the other three seas and we report upward like everyone else, and when a drought comes it is because a petition has not been approved yet, and I would ask you to take that up with the ministry rather than with me. In one century a monkey walked into my treasury and took the pillar that measures the ocean. In another a child killed my son and skinned him. I filed complaints on both occasions. You may judge how well that went.",myth:["The Dragon Kings, the Longwang, rule the four seas — Ao Guang in the East, Ao Qin in the South, Ao Run in the West, Ao Shun in the North — and Ao Guang is the eldest and most prominent. They live in crystal palaces beneath the water with courts, ministers and treasuries, and they are responsible for rainfall, which makes them the most practically important deities in an agricultural country.","They are civil servants. Rain is not granted by whim but requested, authorised and delivered, and a Dragon King who releases rain without proper approval can be punished for it — there are stories of exactly that, ending in execution. When drought struck, villagers would petition the local dragon king temple, and if that failed, they might carry his image out into the sun to let him feel it.","Ao Guang is best known for two humiliations. Sun Wukong came to his palace demanding a weapon and walked off with the iron pillar that measured the depth of the seas, plus armour extorted from all four brothers. And Nezha killed his son Ao Bing, pulled out his sinews and skinned him — and when Ao Guang went up to heaven to complain, Nezha ambushed him on the way and beat him. He is the deity most often on the receiving end in Chinese folklore, which is itself a kind of tribute to how thoroughly ordinary people identified heaven with officialdom."]},{id:"yinglong",name:"Yinglong",epithets:"應龍 · The Winged Dragon · General of the Yellow Emperor · Chinese",domains:["Rain","War","Wings","Drought","Exile"],symbols:["Feathered Wings","The Battle of Zhuolu","The Dry South","The River's Course"],portrait:art("Yinglong.png"),portraitCaption:"Original artwork",intro:"I am old enough to have grown wings, which takes a thousand years, and I fought in the first war there ever was. I killed Chiyou at Zhuolu and I killed the giant Kuafu, and I used so much of my water doing it that I could not go back up to heaven afterwards. So I stayed in the south. That is why the south is wet and the north is dry, and why in a drought they still make a clay image of me and hope I notice.",myth:["Yinglong is the winged dragon, distinguished from other Chinese dragons by having actual wings — in the traditional reckoning a dragon grows them only after a thousand years. He is a rain-bringer and a servant of the Yellow Emperor, and he appears at the founding conflict of Chinese legendary history.","At the Battle of Zhuolu, the Yellow Emperor fought Chiyou, the horned war-god of the Nine Li. Chiyou summoned fog and storm; Yinglong was sent to counter it by gathering the waters, and after the drought-goddess Ba dispelled the weather, Yinglong killed Chiyou. He is also said to have killed the giant Kuafu, who died chasing the sun.","Having spent his waters, he could not return to heaven, and settled in the south — which is the traditional explanation for the wet south and the arid north. In times of drought people made his image in clay in the hope that like calls to like and the rain would follow. He is credited too with using his tail to mark out the channels of the rivers during the great flood, so that Yu the Great could dig where the dragon had drawn."]},{id:"ryujin",name:"Ryujin",epithets:"龍神 · Watatsumi · Dragon God of the Sea · Keeper of the Tide Jewels · Japanese",domains:["The Sea","Tides","Storms","Fishing","Sovereignty"],symbols:["The Tide Jewels","The Coral Palace","Sea Turtles","The Wide Mouth"],portrait:art("Ryujin.png"),portraitCaption:"Original artwork",intro:"I keep two jewels. One raises the tide and one lowers it, and with those two objects any coast on earth belongs to whoever is holding them. My palace is at the bottom, built of red and white coral, and a day there is a hundred years up where you are — which has caused a certain amount of grief to visitors who did not believe me when I warned them. My daughter married a man from the surface. It did not end well, and I have not intervened since.",myth:["Ryūjin, also called Watatsumi, is the dragon god of the sea in Japanese myth, dwelling in Ryūgū-jō, a palace of coral on the seabed where the four seasons occupy four sides and time runs differently from the world above. He commands the tides through two jewels, kanju and manju, which draw the sea down and call it up.","The Kojiki tells of Hoori, who lost his brother's fishhook and went down to the palace to find it, married Ryūjin's daughter Toyotama-hime, and stayed three years believing them days. On leaving he was given the tide jewels, with which he subdued his brother. His wife followed him to shore to give birth and asked him not to look — he looked, saw her true form as a sea creature, and she left him and sealed the way between the sea and the land. Their grandson was Jimmu, the first emperor.","The other famous story is Urashima Tarō, who rescued a turtle, was taken to the palace, spent what felt like a few days there, and returned to find three hundred years had passed and everyone he knew long dead. Ryūjin is not malicious in either tale. The sea simply runs on its own time, and people who go into it do not come back to the world they left."]},{id:"orochi",name:"Yamata no Orochi",epithets:"八岐大蛇 · The Eight-Forked Serpent · Eight Heads, Eight Tails · Japanese",domains:["Floods","Devouring","Rivers","Sacrifice","Hidden Steel"],symbols:["Eight Vats of Sake","Moss and Cedar on the Back","Red Eyes","The Sword in the Tail"],portrait:art("YamataNoOrochi.png"),portraitCaption:"Original artwork",intro:"Eight heads, eight tails, eyes like winter cherries, a body eight valleys and eight hills long with cedars and moss growing on my back, and I came for a daughter every year and they gave her to me every year. Then a banished storm god put eight gates up with a vat of strong sake behind each one, and every head went for its own vat, and I lay down drunk. He cut me apart while I slept it off. And in my tail he found a sword — and that sword is still one of the three treasures of the Japanese throne.",myth:["Susanoo, banished from heaven for wrecking his sister Amaterasu's rice fields and worse, came down to Izumo and found an old couple weeping with their last daughter. Yamata no Orochi had taken seven of their eight daughters, one a year, and had come for Kushinada-hime. The serpent is described precisely: eight heads and eight tails, eyes red as winter cherries, its body spanning eight valleys and eight hills, with cedar and moss growing on its back and its belly perpetually raw and bleeding.","Susanoo asked for the girl in marriage in exchange for dealing with it, then turned her into a comb and put her in his hair for safekeeping. He had the couple brew sake eight times over — ferociously strong — and build a fence with eight gates, and set a vat behind each. Each head went to its own vat, drank, and the whole creature fell into a stupor. He cut it into pieces, and the river ran red.","In the fourth tail his blade struck something and chipped. Inside was a sword, which he named Ame-no-Murakumo and presented to Amaterasu as a peace offering. It was later renamed Kusanagi, the grass-cutter, and it is one of the three Imperial Regalia of Japan. The country's most sacred sword came out of a dragon that had been drunk under the table."]},{id:"quetzalcoatl",name:"Quetzalcoatl",epithets:"The Feathered Serpent · Ehecatl, the Wind · Lord of the Morning Star · Mesoamerican",domains:["Wind","Learning","Creation","Priesthood","Return"],symbols:["Quetzal Plumes","The Conch Wind-Jewel","Maize","The Morning Star","The Raft of Serpents"],portrait:art("Quetzalcoatl.png"),portraitCaption:"Original artwork",intro:"I went down into the land of the dead to gather the bones of the people who came before, because the world was empty and I did not want to make something new when something had already been lost. I dropped them. They broke, and the quails got at them, and that is why human beings come in different sizes and none of you last very long. I bled on the pieces and you stood up. I have never once regretted going down there and I have never stopped being sorry that I stumbled.",myth:["Quetzalcoatl, the feathered serpent, is among the oldest and most widespread deities of Mesoamerica — attested at Teotihuacan centuries before the Aztecs, known as Kukulkan to the Maya and Q'uq'umatz to the K'iche'. He is the wind as Ehecatl, wearing a conch-shell jewel and a beaked mask; he is the morning star; he is the patron of priests, learning, writing and the calendar.","In the Aztec account he descended to Mictlan, the underworld, to recover the bones of the people of the previous age so that humanity could be remade. The lord of the dead set him obstacles and he lost his grip; the bones shattered and were pecked by quails. He gathered the fragments anyway, and the gods ground them and he let blood from himself onto the meal, and from that the present humanity was formed — imperfect and short-lived because the bones broke. He is also said to have brought maize to people, in one telling by turning into an ant to follow other ants to where it was hidden inside a mountain.","His departure is the famous part. Shamed or tricked — accounts vary, and in some he is made drunk by Tezcatlipoca and disgraces himself — he left the city of Tula and travelled to the eastern coast, where he either burned himself and rose as the morning star or sailed away on a raft of serpents, promising to return. The idea that Moctezuma took Cortés for the returning Quetzalcoatl is repeated constantly and is considered doubtful by most historians now, likely constructed after the conquest rather than believed during it."]},{id:"leviathan",name:"Leviathan",epithets:"לִוְיָתָן · The Coiling One · The Sea's Own · Levantine",domains:["The Deep","Chaos","Untamed Creation","Terror","The Feast at the End"],symbols:["The Fishhook That Will Not Hold","Scaled Armour","Fire From the Mouth","The Boiling Sea"],portrait:art("Leviathan.png"),portraitCaption:"Original artwork",intro:"Can you draw me out with a hook. Can you put a cord through my tongue, or a thorn through my jaw, or fill my hide with harpoons. Will I make a covenant with you, will I speak softly to you, will you take me for a servant forever. Will you play with me as with a bird, and put me on a leash for your girls. That is not me boasting. That is a god asking a suffering man a series of questions to which the answer is no, and I am the answer.",myth:["Leviathan appears across the Hebrew Bible as the great sea creature, with clear roots in older Canaanite material — the Ugaritic texts describe Baal defeating Lotan, the fleeing serpent, the twisting serpent with seven heads, and the Hebrew phrasing is close enough to be recognisably the same tradition. In Psalms and Isaiah, God crushes the heads of Leviathan; in Isaiah, a day is coming when he will be punished with a hard and great sword.","The longest treatment is in Job, and it is unlike the others. God, answering Job out of the whirlwind, spends a whole chapter on Leviathan — not as an enemy to be defeated but as an exhibit. Can you catch him, can you tame him, can you bargain with him, would you dare rouse him. His sneezes flash light, his eyes are like the dawn, he makes the deep boil like a pot and leaves a shining wake behind him. Nothing on earth is his equal, and he is made without fear. The point being made to Job is that creation contains things that are not for him.","Later Jewish tradition took a different turn: Leviathan is kept until the end of days, when the righteous will feast on his flesh in a tabernacle made from his hide. Christian writers folded him into imagery of the devil and of hell's mouth, and Hobbes borrowed the name for the state. But the oldest layer is simpler and stranger — a creature so far beyond handling that pointing at it is considered a sufficient answer to the problem of suffering."]}]},lhp:{label:"Left-Hand Path",blurb:"Almost every name here belonged to somebody else first. Astarte became Astaroth. Baal-zebul became Beelzebub. The gods of the people next door were not argued with — they were demoted, renamed, and filed under the enemy. What follows is that list, read back the other way: the adversary as prosecutor, the serpent who told the truth, and the ones who said no and meant it.",deities:[{id:"lucifer",name:"Lucifer",epithets:"The Light-Bearer · Helel ben Shachar, Shining One, Son of Dawn · Adversarial",domains:["Illumination","Pride","Rebellion","The Morning Star","Self-Sovereignty"],symbols:["Venus at Dawn","The Torch","The Fallen Star","The Broken Crown"],portrait:art("Lucifer.png"),portraitCaption:"Original artwork",intro:"Read the verse. Isaiah, chapter fourteen: how art thou fallen, O Shining One, son of the dawn. Read the four verses before it and you will find it is a funeral taunt aimed at the king of Babylon by a people he had crushed, and there is not one word in it about heaven, or angels, or me. A Latin translator wrote lucifer — light-bearer, the name of the morning star — and fifteen hundred years later that is a person. I am, quite literally, a translation.",myth:["The name is Latin and means light-bringer: lucifer was the ordinary Roman word for Venus as the morning star, the last light before dawn. Jerome used it in the Vulgate to render the Hebrew helel ben shachar in Isaiah 14, in a passage explicitly introduced as a taunt-song against the king of Babylon — a mocking dirge for a tyrant, drawing on an older Canaanite motif of a star-god who tried to climb above the others and was cast down.","Over centuries the passage was read as describing the fall of a rebel angel, fused with a line in Luke about Satan falling like lightning and with the war in heaven in Revelation, and the name attached itself to the figure. Milton then gave that figure the greatest speeches in English poetry — better to reign in hell than serve in heaven — and Paradise Lost did more to fix Lucifer's character than any scripture ever had.","The Romantics read Milton and drew the obvious conclusion. Blake said he was of the devil's party without knowing it; Shelley put Prometheus in the same seat. From there the Luciferian current in modern occultism takes the figure not as evil but as the principle of illumination, individuation and refusal — knowledge sought without permission, and the willingness to be cast out rather than kept. Whether that reading is faithful to the sources or a nineteenth-century construction is exactly the argument, and both sides are aware of it."]},{id:"satan",name:"Satan",epithets:"ha-Satan, the Adversary · The Accuser · Prosecutor of the Heavenly Court · Adversarial",domains:["Opposition","Testing","Accusation","Doubt","Independence"],symbols:["The Court Docket","The Circuit Walked","The Wager","The Question"],portrait:art("Satan.png"),portraitCaption:"Original artwork",intro:"In the oldest book I appear in, I am an employee. The sons of God present themselves and I present myself with them, and I am asked where I have been, and I say: going to and fro in the earth, and walking up and down in it. Then I say the only interesting thing anyone says in the entire scene — does Job fear God for nothing? Take away the herds and the children and see what is left. And God says: go on then. Try it. I did not tempt anybody. I proposed a test, and it was authorised.",myth:["In the Hebrew Bible ha-satan is a title with a definite article — the adversary, the accuser — and it names a function rather than a proper name. In Job he is a member of the divine court whose job is to walk the earth and bring back accusations, and everything he does to Job is explicitly permitted and bounded. In Zechariah he stands to accuse the high priest. In Numbers, an angel of the LORD stands in Balaam's road as a satan, an obstruction. It is a role in a courtroom, and the courtroom is God's.","The transformation into a singular cosmic enemy happens later, largely in the Second Temple period under Persian influence, where a genuinely dualist system was available to borrow from, and then in the New Testament, where the devil is a tempter and a prince of this world with a kingdom of his own. By the time the Church Fathers finish, the prosecutor has become the defendant.","Modern Satanism splits s
