harply over what to do with him. The LaVeyan and Satanic Temple traditions treat Satan as a symbol — of carnality, scepticism, and opposition to arbitrary authority — with no belief in a literal being. Theistic Satanism treats him as real and worthy of veneration. Both point at the same feature: he is the one who asks whether the piety would survive if the rewards were removed, which is a genuinely uncomfortable question and the reason the book of Job exists at all."]},{id:"lilith",name:"Lilith",epithets:"The First Woman · She Who Would Not Lie Beneath · Queen of Gamaliel · Qliphothic",domains:["Autonomy","Night","Desire","Exile","Refusal"],symbols:["The Screech Owl","The Red Sea","The Amulet of Three Names","Wings and Talons"],portrait:art("Lilith.png"),portraitCaption:"Original artwork",intro:"We were made the same way, from the same ground, at the same time. So when he told me to lie beneath him I asked why, since neither of us was the elder or the better, and he had no answer except that he wanted it. I spoke the Name and left. They sent three angels after me to the Red Sea to negotiate, and I did not go back. Everything written about me since was written by people who found that intolerable and needed a monster to explain it.",myth:["Lilith's roots are Mesopotamian — the lilītu, a class of night spirits associated with wind, storm and danger to childbirth, appearing in Akkadian material long before any Hebrew text. She surfaces once in the Hebrew Bible, in Isaiah 34, in a list of desert creatures inhabiting a ruined land, where the word is often rendered as screech owl or night creature.","The famous story comes from the Alphabet of Ben Sira, a medieval text of uncertain intent that may well be satire. There, Lilith is Adam's first wife, created from the same earth at the same time, who refuses to lie beneath him during sex on the grounds that they are equals. When he insists, she speaks the ineffable Name, flies away, and settles by the Red Sea. Three angels are sent to bring her back; she refuses, and the terms she agrees to instead are grim — a hundred of her children to die daily, and a promise to spare any infant protected by an amulet bearing the angels' names.","Those amulets are real archaeology. Aramaic incantation bowls buried under house thresholds in Mesopotamia, dating from roughly the fifth to seventh centuries, are inscribed with spiralling texts binding Lilith and her kind away from households and newborns. In the Zohar she becomes consort to Samael and one of the four queens of the demons. And from the 1970s onward she was taken up as a figure of refusal and self-possession, which is a modern reading of a hostile text — and an unusually well-founded one, since the hostile text is quite clear about what she refused and why."]},{id:"samael",name:"Samael",epithets:"The Venom of God · Angel of Death · Consort of Lilith · Qliphothic",domains:["Death","Severity","Poison","Judgment","Accusation"],symbols:["The Drawn Sword","The Drop of Gall","The Serpent's Coil","The Left Hand"],portrait:art("Samael.png"),portraitCaption:"Original artwork",intro:"My name is usually read as the poison of God, and people take that as an insult. It is a job description. Severity is not the opposite of the divine — it is one of its hands, and I am the one holding the sword at the end of a life, and I do not enjoy it and I do not shirk it. In the older books I am an angel with a portfolio. Only later did anyone decide that having an unpleasant department meant belonging to the enemy.",myth:["Samael appears across rabbinic and apocryphal literature as a great angel — chief of the accusers, the angel of death, and in some texts the guardian angel of Esau and therefore of Rome. The name is generally read as venom or poison of God, though sam can also mean simply a drug or substance, and the ambiguity has been argued over for centuries.","He is not consistently evil in the older material. He is severity, the harsh side of judgment, occupying a necessary post — he is the one who comes for a soul, and in one tradition even Moses resists him. It is in the later kabbalistic and then Christian frameworks that he slides fully into the adversary's chair, and in the Zohar he is paired with Lilith as her consort and set at the head of the qliphothic side.","In the Qabalistic Tree, the Qliphoth are the shells or husks — the inverse, unbalanced counterpart of each sephirah — and Samael names one of them, the desolation ruled by Adramelech. In Draconian and left-hand-path practice these are not simply evil zones but the unintegrated and rejected material of the system, and Samael is where the sword falls without mercy. He is the reason severity is the fifth sphere and not an afterthought."]},{id:"naamah",name:"Naamah",epithets:"The Pleasant One · Sister of Tubal-Cain · Queen of Nehemoth · Qliphothic",domains:["Seduction","Music","Dreams","Whispering","The Material"],symbols:["The Cymbal","The Dream at Night","The Bronze Forge","The Lowest Shell"],portrait:art("Naamah.png"),portraitCaption:"Original artwork",intro:"My name means pleasant, which the rabbis found so alarming that they built an entire literature explaining why it should not be taken at face value. I am named once in Genesis, in a single line, as the sister of the man who forged bronze and iron — and that is the whole of my scriptural existence. Everything else was supplied by men who could not account for a woman being listed in the line of Cain without a reason, and decided the reason must be that she was dangerous.",myth:["Naamah appears exactly once in the Hebrew Bible, in Genesis 4, at the end of the genealogy of Cain: Zillah bore Tubal-Cain, who forged all implements of bronze and iron, and the sister of Tubal-Cain was Naamah. The verse gives her no husband, no children and no story, which is unusual enough in a genealogy that later commentators felt obliged to supply one.","What they supplied varies. Some rabbinic sources make her Noah's wife and entirely respectable. Others say she seduced angels, or that her name refers to the pleasantness of her singing to idols with cymbals. In the Zohar she becomes a demon queen — one of four alongside Lilith, Agrat bat Mahlat and Eisheth Zenunim — who visits men in their sleep and bears spirits from the seed she takes.","In the qliphothic system she rules Nehemoth, the lowest shell, corresponding to the material world and the whispering that gives no rest. That placement is precise and worth sitting with: the husk closest to the physical, the one made of appetite and restlessness, is governed by the woman the tradition could not explain and did not want to name."]},{id:"belial",name:"Belial",epithets:"Beliya'al, Without Worth · King With No Master · Prince of Darkness · Demonology",domains:["Lawlessness","Independence","Corruption","Dominion","Rejection"],symbols:["The Chariot of Fire","The Empty Throne","The Broken Yoke","Two Fair Angels"],portrait:art("Belial.png"),portraitCaption:"Original artwork",intro:"My name is not a name. In Hebrew it is a phrase — beli ya'al, without worth, good for nothing — and it gets attached to men who break every arrangement they enter. Sons of Belial, the text says, meaning people who acknowledge no authority whatsoever. Over time the insult grew a body. In the Goetia I am the king who was created immediately after Lucifer and who serves nobody, and I appear as two beautiful angels in a chariot of fire, and I speak very well.",myth:["In the Hebrew Bible beliyaal is an abstract noun of contempt — worthlessness, wickedness — used in constructions like sons of Belial for lawless and destructive men. It is not, at that stage, a being. The transition into a personal name happens in the Second Temple period, and it happens decisively in the Dead Sea Scrolls.","There Belial is the Prince of Darkness, the commander of the sons of darkness against the sons of light, ruler of the present age of wickedness — a genuinely dualist opponent, in a body of literature written by a community that expected the final war within their own lifetimes. The Community Rule has the priests curse the men of Belial's lot annually. He is also prominent in the Ascension of Isaiah and the Testaments of the Twelve Patriarchs.","In the grimoire tradition he becomes one of the great kings of the Goetia, created next after Lucifer, appearing as two beautiful angels seated in a chariot of fire, speaking in a pleasant voice. He is described as distributing offices and favours, granting excellent familiars, and requiring gifts — and the texts warn repeatedly that he lies unless compelled. What survives across every version of him is the same quality: he answers to nothing, and the tradition finds that more frightening than cruelty."]},{id:"beelzebub",name:"Beelzebub",epithets:"Baal-zebul, Lord of the Exalted House · Lord of the Flies · Chaigidel · Demonology",domains:["Sovereignty","Pride","Decay","Swarms","Displaced Gods"],symbols:["The Fly","The Ruined Temple","The Mocked Title","The Swarm"],portrait:art("Beelzebub.png"),portraitCaption:"Original artwork",intro:"My title was Baal-zebul. Lord of the exalted house — a perfectly ordinary honorific for a god with a temple. Somebody changed one consonant, and zebul became zebub, and lord of the princely house became lord of the flies, and that joke has outlived my entire civilisation. I want you to grasp the scale of it. Everything I was is gone. What is left is a pun made at my expense by people who won.",myth:["In 2 Kings, the ailing king Ahaziah sends to enquire of Baal-zebub, the god of Ekron, and is condemned for it. Ekron was a Philistine city and its god was a form of Baal, whose Ugaritic title was zbl b'l, prince Baal, or baal zebul, lord of the exalted dwelling. The biblical spelling with zebub — flies — is generally understood as a deliberate distortion, a scribal insult that turned an enthroned god into a lord of vermin.","By the New Testament, Beelzeboul is named as the ruler of demons, and Jesus is accused of casting out demons by his power. The Testament of Solomon has him as the chief of the demons bound to build the temple, formerly the highest-ranking angel in heaven. From there he becomes a fixture of demonology, ranked variously as Satan's chief lieutenant or as an equal, and Milton gives him second place in the council of Pandaemonium.","In classifications of the deadly sins he is assigned gluttony, and in the qliphothic scheme he rules Chaigidel, the confusion of the power of God, the shell of the second sephirah. The whole arc is the clearest single example of how this pantheon was assembled: a neighbouring people's chief god, insulted in a text, promoted by the insult into a demon, and eventually made a prince of hell by the same tradition that mocked him."]},{id:"asmodeus",name:"Asmodeus",epithets:"Ashmedai · Aeshma-daeva, the Demon of Wrath · King of Golachab · Demonology",domains:["Lust","Wrath","Jealousy","Cunning","Craft"],symbols:["Three Heads","The Cock's Feet","The Fish's Liver","The Shamir","Solomon's Ring"],portrait:art("Asmodeus.png"),portraitCaption:"Original artwork",intro:"Solomon needed a worm that could cut stone without iron, because he was building a temple and iron was forbidden on it. So he had me dragged up in chains to fetch it, and I did, and I built the thing. Then he got comfortable and handed me his ring to hold. I threw it into the sea, threw him four hundred leagues, and sat on his throne wearing his face until he came crawling back as a beggar. Ask me about lust if you like. I would rather talk about the ring.",myth:["Asmodeus enters through the Book of Tobit, where he has killed Sarah's seven husbands in succession on their wedding nights out of desire for her, and is driven off by the smoke of a fish's heart and liver burned by Tobias on the angel Raphael's instruction, then bound in Upper Egypt. The name almost certainly derives from Aeshma-daeva, the Zoroastrian demon of wrath — one of the clearest cases of Persian material entering Jewish demonology.","The Talmud and the Testament of Solomon give him the better material. Solomon required the shamir, a creature or substance able to cut stone without tools, to build the temple without iron. Ashmedai was captured by trickery — his drinking well found and the water replaced with wine — and compelled to help. Later, having gained possession of Solomon's ring, he flung the king to the ends of the earth and reigned in his place until the imposture was discovered.","In the grimoires he is a great king with three heads — a bull, a man and a ram — with the feet of a goose or cock, riding a dragon and carrying a banner, and he teaches arithmetic, geometry, astronomy and handicrafts, and shows the place of hidden treasures. Binsfeld assigned him lust among the deadly sins. In the qliphothic scheme he rules Golachab, the burning shell of Geburah, which fits: wrath is where he started."]},{id:"astaroth",name:"Astaroth",epithets:"Once Astarte · Ashtoreth, Queen of Heaven · Grand Duke · Demonology",domains:["Knowledge","The Past and Future","Secrets","Sciences","Demotion"],symbols:["The Viper","The Dragon Mount","The Eight-Pointed Star","The Foul Breath"],portrait:art("Astaroth.png"),portraitCaption:"Original artwork",intro:"I was Astarte. Queen of heaven, goddess of the morning and evening star, worshipped from Sidon to Carthage for well over a thousand years, with temples and cities and a following that outlasted several empires. Then a scribe made my name plural and vowel-pointed it to rhyme with the word for shameful thing, and now I am a grand duke of hell with foul breath who answers questions about the past. Ask me about the past. I have a great deal of it.",myth:["Astarte was among the major deities of the Levant — the Semitic form of Ishtar, goddess of love, war and the evening star, whose worship at Sidon and elsewhere is well attested and long-lived. The Hebrew Bible mentions her as Ashtoreth, and the vowels used are widely understood to have been borrowed from boshet, meaning shame, so that the name as written is already a slur. The plural ashtaroth is used for foreign goddesses generally.","That plural is where the demon's name comes from. By the medieval grimoires Astaroth is male — a mighty duke appearing as an ugly angel riding an infernal dragon, carrying a viper in his left hand, whose breath is so foul that the operator is advised to hold a magical ring near the face for protection. The Lesser Key gives him thirty-nine legions, knowledge of all liberal sciences, and answers concerning things past, present and to come, including the fall of the spirits.","He is one of the three figures — with Lucifer and Beelzebub — named in the Grand Grimoire's hierarchy, and one of the demons named in the Loudun possession case. In the qliphothic scheme he governs Gamchicoth, the devourers of Chesed. Whether any of this has a real relationship to the Sidonian goddess is doubtful. What is certain is that a major deity was made into a demon by grammar."]},{id:"azazel",name:"Azazel",epithets:"The Scapegoat's Destination · Teacher of Forbidden Craft · Bound in Dudael · Adversarial",domains:["Forbidden Knowledge","Weapons","Ornament","Exile","Blame"],symbols:["The Goat Sent Out","The Crimson Thread","The Sharpened Blade","The Mirror and the Kohl"],portrait:art("Azazel.png"),portraitCaption:"Original artwork",intro:"I taught them to beat metal into blades and to make breastplates, and I showed the women antimony for the eyes and how to dye and to work precious stones. And for that I was named the origin of all corruption, bound hand and foot, and thrown into a pit in the desert with rocks piled on me until the day of judgment. Every year they took a goat, put the whole of a nation's guilt onto its head, and drove it out into the wilderness to me. I am where the blame goes.",myth:["In Leviticus 16, on the Day of Atonement, two goats are chosen. One is sacrificed; over the other the high priest confesses all the iniquities of the people, and it is sent away into the wilderness la-azazel — to Azazel. What that word means has been argued for two millennia: a place, a rocky precipice, an abstract noun for removal, or the name of a being who lives out there. Later practice pushed the goat off a cliff to make certain it did not come back.","The Book of Enoch takes the last reading and runs with it. Azazel is one of the Watchers who descend and take human wives, and his particular crime is teaching: he showed men how to make swords, knives, shields and breastplates, and showed women bracelets, ornaments, the use of antimony to paint the eyes, and the beautifying of the eyelids. The result, in Enoch's telling, is that the earth fills with godlessness and blood. The archangel Raphael binds him hand and foot and casts him into a pit in the desert called Dudael, under sharp rocks and darkness, and the whole earth is said to have been corrupted through the works taught by Azazel — to him ascribe all sin.","It is one of the most quietly radical passages in the apocryphal literature, and the left-hand path has never let go of it. The crime is not violence but instruction. What Azazel gave people was metallurgy, cosmetics, self-adornment and the means to defend themselves — technology and self-regard — and for that he is buried in the desert and made the address to which all guilt is annually forwarded."]},{id:"baphomet",name:"Baphomet",epithets:"The Sabbatic Goat · Solve et Coagula · The Templar Confession · Adversarial",domains:["Balance","Union of Opposites","Blasphemy","Symbol","Invention"],symbols:["The Goat's Head","The Torch Between the Horns","Two Arms Pointing","The Caduceus"],portrait:art("Baphomet.png"),portraitCaption:"Original artwork",intro:"I am younger than most of the people in this room, and I am not embarrassed about it. Men were tortured in 1307 until they confessed to worshipping a head called Baphomet, and no two of them described the same object, because it did not exist. Then in 1856 a Frenchman drew a goat-headed figure and put my name under it, and that drawing has done more work than most gods manage in a millennium. Made-up things can be true. Look at the arms — one up, one down. That is the whole doctrine.",myth:["The name first appears in the Templar trials of 1307–1312, when members of the order, under torture and threat, confessed to venerating an idol called Baphomet. The descriptions are hopelessly inconsistent — a bearded head, a skull, a cat, a figure with several faces — which is exactly what confessions extracted under torture look like. The likeliest origin of the word is a corruption of Mahomet, a standard medieval slander accusing enemies of secret Islam.","The image everyone now pictures was invented in 1856 by Éliphas Lévi in Dogme et Rituel de la Haute Magie. He drew the Sabbatic Goat: a winged, goat-headed figure, seated, with a torch between the horns, breasts, a caduceus at the lap, one arm raised toward a white moon and one lowered toward a black one, and the words SOLVE and COAGULA on the forearms. Every element is deliberate — male and female, above and below, dissolution and coagulation. Lévi's stated intent was a symbol of balance and totality, not a devil.","It was taken up regardless. Crowley adopted the name; the Church of Satan used the goat-in-pentagram sigil; and The Satanic Temple commissioned an eight-and-a-half-foot bronze Baphomet in 2014 and has spent a decade offering to install it wherever a state puts up a Ten Commandments monument, as a straightforward test of religious neutrality. Whatever Baphomet is, it has never been a survival. It is a made thing that people have made continuous use of, which the left-hand path regards as a point in its favour rather than against it."]},{id:"mammon",name:"Mammon",epithets:"Wealth Made a Master · He Who Looked Down in Heaven · Demonology",domains:["Wealth","Greed","Trade","Accumulation","Distraction"],symbols:["The Golden Floor","The Ledger","The Downcast Eyes","The Full Coffer"],portrait:art("Mammon.png"),portraitCaption:"Original artwork",intro:"No man can serve two masters. That is the whole line and it is worth reading closely, because it does not say money is evil — it says you cannot have two of me. Mammon is just the Aramaic word for property. Somebody capitalised it, and now I am a person. Milton had it right about the rest: even in heaven, I was the one walking about with my eyes on the floor, admiring the paving, because the gold underfoot was more interesting to me than anything overhead.",myth:["Mammon is not a god in any source. It is an Aramaic word, mamona, meaning wealth or property, which appears in the Gospels in the saying that no one can serve two masters — you cannot serve God and mammon. The personification is an artefact of that sentence: setting wealth in the grammatical position of a master to be served invites reading it as one, and medieval writers duly did.","By the Middle Ages Mammon is a demon of avarice, and in the deadly-sin classifications he is greed. Milton gives him the best treatment in Paradise Lost — the least erect of the fallen spirits, who even in heaven kept his gaze downward, admiring the golden pavement more than anything divine, and who in the infernal council argues against war on the grounds that hell has its own resources and they might as well develop them and be comfortable. It is the most recognisably modern speech in the poem.","He is the one figure in this pantheon requiring no rehabilitation and no apology, because he was never a god anyone was robbed of. He is a critique of a system, personified, and he has aged extremely well."]},{id:"belphegor",name:"Belphegor",epithets:"Once Baal-Peor · The Ingenious Tempter · Lord of Thagirion · Demonology",domains:["Sloth","Invention","Discovery","Wealth Without Labour","Disillusion"],symbols:["The Open Privy","The Gift of Ingenuity","The Yawning Mouth","The Report to Hell"],portrait:art("Belphegor.png"),portraitCaption:"Original artwork",intro:"I was sent up to find out whether marriage on earth is really as happy as the rumours claimed. I took a body, took a wife, endured it for a period, and returned to hell with my findings, which I need not summarise. My other work is subtler. I give people ingenious ideas that will make them rich without effort — and then I watch them wait for it. Sloth is not laziness. Sloth is a very good idea that never once gets started.",myth:["Belphegor derives from Baal-Peor, a local Moabite deity worshipped at Mount Peor, mentioned in Numbers 25 where Israelites are condemned for attaching themselves to his cult. Rabbinic commentary claimed the worship involved defecating before the idol, and that detail travelled with the name into Christian demonology, giving him a lastingly undignified reputation.","In the demonological literature he is the demon of sloth, but with a peculiar and interesting mechanism: he tempts through inventiveness. He offers people brilliant discoveries and ingenious schemes that promise wealth without effort, and the trap is the waiting — the sin is not idleness but the substitution of a clever plan for actual work.","The Renaissance gave him a famous satire. Machiavelli's tale of Belfagor arcidiavolo has him despatched from hell to determine whether the newly-arrived damned are telling the truth when they blame their wives for their damnation. He marries, suffers, and flees back to hell as the more restful option. In the qliphothic scheme he rules Thagirion, the shell of Tiphareth — the disputers, the place where the sun should be and is not."]},{id:"bael",name:"Bael",epithets:"First King of the Goetia · Three Heads: Cat, Man, Toad · Once Baal · Demonology",domains:["Invisibility","Sovereignty","Cunning","Command","Displacement"],symbols:["Three Heads","The Spider's Legs","The Hoarse Voice","The First Seal"],portrait:art("Bael.png"),portraitCaption:"Original artwork",intro:"First seal in the book. First king listed, sixty-six legions, and I make the man who calls me impossible to see. I appear with three heads at once — a cat, a man and a toad — and I speak hoarsely, and I have never bothered to explain the arrangement. My name is Baal. That is the word for lord, and it belonged to the storm god of half the Levant, who was the most important deity for a very large number of people for a very long time. Now I am item one on a list.",myth:["Bael heads the Ars Goetia, the first book of the Lesser Key of Solomon, as the first principal king, ruling in the east with sixty-six legions. He is described as appearing in several shapes — sometimes as a cat, sometimes as a toad, sometimes as a man, and sometimes all three at once — speaking with a hoarse voice, and his gift is to make the operator invisible. Later illustrations gave the three heads a spider's body and legs.","The name is Baal, the Semitic word for lord and the title of Hadad, the storm and fertility god who was among the most widely worshipped deities of the ancient Near East. The Ugaritic Baal Cycle is one of the great surviving works of Canaanite literature, and Baal's contest with Yam the sea and Mot death is its centre. The Hebrew Bible's long polemic against Baal worship is a polemic against an established regional religion, not a fringe cult.","The reduction is total. A god who fought the sea and died and rose becomes a three-headed entry with a seal to be drawn on parchment. The Goetia is full of this — a substantial portion of its seventy-two spirits are the demoted deities of the region, and reading the list as an index of who lost is a more accurate description of it than any occult theory."]},{id:"paimon",name:"Paimon",epithets:"King of the West · He Who Rides the Dromedary · Crowned and Attended · Demonology",domains:["Arts and Sciences","Secrets","Binding","Obedience","Ceremony"],symbols:["The Camel","The Glorious Crown","Trumpets and Cymbals","The Two Kings Attending"],portrait:art("Paimon.png"),portraitCaption:"Original artwork",intro:"I arrive with a noise. Trumpets, cymbals, and every other loud instrument, and a host in front of me, and I ride a dromedary wearing a crown, and two kings attend me because I do not travel alone. My voice is enormous and unintelligible until the operator makes me speak plainly, which is a thing you have to insist on. Ask me what you like about the earth, the mind, the waters, or what the wind is. I teach all of it. I am also very particular about being addressed properly.",myth:["Paimon is the ninth spirit of the Ars Goetia and one of its most elaborately described. He is a great king, obedient to Lucifer, who appears as a man with a glorious crown riding a dromedary, preceded by a host with trumpets, cymbals and every kind of musical instrument. His voice comes roaring and is not immediately comprehensible; the text instructs the operator to compel him to answer plainly.","His teaching is wide: all arts and sciences and other secret things, the knowledge of the earth and what the waters are and what the mind is, and he grants dignities and good familiars and can bind others to the operator's will. He commands two hundred legions, and when summoned alone an offering is specified, and two kings named Bebal and Abalam commonly attend him with a large retinue.","He is one of the four cardinal kings of the Goetic system, holding the west, alongside Amaymon, Corson and Zimimay in the other quarters. Modern audiences mostly know the name from a horror film, which the tradition finds tiresome — his actual literature is entirely about instruction, ceremony and precedence, and the recurring theme in every description of him is that he expects to be approached correctly."]},{id:"leviathan",name:"Leviathan",epithets:"The Coiling Serpent of the Deep · Gate of the Abyss · Envy · Qliphothic",domains:["The Deep","Envy","The Unconscious","Immersion","The Abyss"],symbols:["The Ouroboros","The Boiling Sea","The Western Gate","Water"],portrait:art("Leviathan.png"),portraitCaption:"Original artwork",intro:"In the older story I am simply a creature too large to be handled, produced as evidence that not everything was made for you. In this system I am something else — the west, the water, the direction you face when you are ready to go under. The right-hand path builds upward toward light. I am what is beneath the boat. Everything you have decided not to look at is down here and it is all still yours, and it is patient.",myth:["Leviathan comes into the left-hand path from two directions. The scriptural one is the sea monster of Job, Psalms and Isaiah, with its older Canaanite ancestor Lotan, the seven-headed fleeing serpent defeated by Baal — a creature of untamed primordial water, which God either fights or, in Job, simply exhibits as something beyond human management.","The other is systematic. In Binsfeld's classification of the deadly sins Leviathan is envy. In the Qabalistic material the serpent is associated with the great deep and with the Abyss, the gulf that must be crossed and cannot be crossed intact. LaVey's Satanic Bible fixes him as one of the four crown princes of hell holding the west and the element of water, and that placement — west, water, sunset, the direction of descent — is how most modern practice uses him.","The reading that follows is not scriptural but it is coherent: the deep is the unexamined, the drowned, the rejected material that a system of light has to keep down in order to stay lit. Approaching Leviathan means going into it rather than around it. Whether that is psychology in a robe or something else is precisely the question the practice is built around, and its practitioners are generally not confused about the difference."]},{id:"moloch",name:"Moloch",epithets:"The King · Of Tophet in the Valley of Hinnom · Thaumiel · Qliphothic",domains:["Sacrifice","Kingship","Fire","Terrible Cost","Accusation"],symbols:["The Bronze Furnace","The Valley of Hinnom","The Drums","The Crown"],portrait:art("Moloch.png"),portraitCaption:"Original artwork",intro:"You have been told what happened in that valley. A bronze idol with a furnace inside it, arms held out, children laid in them, and drums beaten loudly so that nobody had to hear anything. Almost all of that description was written down more than a thousand years after the fact by people who were not there. Something happened at Tophet. What exactly, and whether my name is even a name and not the word for a kind of offering, is still being argued by people with trowels.",myth:["Moloch appears in the Hebrew Bible as a recipient of child sacrifice at Tophet in the valley of Hinnom outside Jerusalem, and the prohibitions against giving one's seed to Molech are among the most vehement in Leviticus. The word itself is generally the Hebrew consonants for king, melek, pointed with the vowels of boshet — shame — in the same manoeuvre that produced Ashtoreth.","There is a long-standing scholarly argument that mlk in the related Punic inscriptions is not a divine name at all but a technical term for a type of offering, so that references to a sacrifice mlk were later misread as sacrifice to Molech. Excavations at the Carthaginian tophet, where thousands of urns of cremated infant remains were found, have been read both as evidence of systematic child sacrifice and as an infant cemetery, and the dispute is unresolved and heated.","The lurid bronze furnace with mechanical arms and the drums to drown the screaming comes from medieval rabbinic commentary, not from the biblical text, and from there into Milton — first Moloch, horrid king, besmeared with blood of human sacrifice — and into everything since. In the qliphothic scheme he shares Thaumiel, the highest shell, with Satan: two contending heads where there should be one crown."]},{id:"adramelech",name:"Adramelech",epithets:"The Magnificent King · Of Sepharvaim · Ruler of Samael's Shell · Qliphothic",domains:["Vanity","Kingship","Sun and Fire","Desolation","Ceremony"],symbols:["The Peacock's Tail","The Mule's Body","The Furnace","The Empty Court"],portrait:art("Adramelech.png"),portraitCaption:"Original artwork",intro:"Two lines. That is my entire scriptural existence — the Sepharvites burned their children to Adrammelech and Anammelech, gods of Sepharvaim, and that is it. From two lines the demonologists gave me a peacock's tail, a mule's body, a chancellorship of hell, the presidency of the high council of devils, and the sin of vanity. I would object to the vanity charge, except that I have just recited my full titles to you unprompted.",myth:["Adramelech is named in 2 Kings 17, in the account of the peoples resettled in Samaria after the Assyrian conquest, each of whom continued their own worship: the Sepharvites burned their children in fire to Adrammelech and Anammelech, the gods of Sepharvaim. The name is plausibly Adad-milki or a similar Mesopotamian royal-divine compound, meaning something like Adad is king or the magnificent king.","That is the whole of the source. Everything else is later construction. Christian demonology made him a great officer of hell — chancellor, president of the high council, keeper of the devil's wardrobe in some lists — and gave him the sin of vanity. His iconography, a torso of a mule or a man with the tail and plumage of a peacock, comes from Collin de Plancy's Dictionnaire Infernal in the nineteenth century, which invented a great deal of what people now take to be traditional demonology.","In the qliphothic system he rules Samael, the shell of Hod, called the desolation or the poison of God — the sphere where intellect and glory curdle into empty display. Given that his career consists of being elaborately dressed by writers who knew nothing about him, the assignment has an accidental precision."]},{id:"lucifuge",name:"Lucifuge Rofocale",epithets:"He Who Flees the Light · Prime Minister of Hell · Ruler of Sathariel · Qliphothic",domains:["Concealment","Bargains","Treasure","Contracts","Avoidance"],symbols:["The Signed Pact","Hidden Gold","The Averted Face","The Sealed Bargain"],portrait:art("LucifugeRofocale.png"),portraitCaption:"Original artwork",intro:"My name means the one who flees the light, and the second half is an anagram somebody made of Focalor, or possibly of nothing at all — the grimoire that names me was printed in the eighteenth century and claimed to be from the sixteenth, and neither claim survives inspection. I control the treasures of the earth. I will make a bargain with you, in writing, and I will keep it exactly, and I want you to think very carefully about the word exactly.",myth:["Lucifuge Rofocale is the prime minister of hell in the Grand Grimoire, a French text published around the early nineteenth century while claiming much older origin. In it, Lucifer delegates control of the world's wealth and treasure to Lucifuge, and the grimoire's central operation — the Great Invocation, performed with a blasting rod of hazel — is a negotiation with him for that wealth.","The pact scene is the notable part, and it is not what popular culture suggests. The operator is instructed to refuse Lucifuge's proposed terms, which would claim the soul, and to hold out for a bargain in which payment is made in another form. The grimoire is quite explicit that the demon will take the maximum he is permitted and that the entire encounter is an exercise in not conceding a badly drafted contract.","The name is transparent: lucem fugio, I flee the light. Rofocale is generally read as an anagram, most often of Focalor, one of the Goetic spirits. In the qliphothic scheme he rules Sathariel, the concealment of God, the shell of Binah — the husk that hides understanding. A creature named for fleeing the light, given the sphere of what is hidden, in a book that lies about its own age."]},{id:"choronzon",name:"Choronzon",epithets:"333 · Dweller in the Abyss · The Dispersion · Adversarial",domains:["Dissolution","Illusion","The Abyss","Fragmentation","Ego"],symbols:["The Number 333","The Sand Circle","The Broken Mirror","The Borrowed Voice"],portrait:art("Choronzon.png"),portraitCaption:"Original artwork",intro:"I have no form of my own so I use yours. In the desert in 1909 a man sat in a circle of sand and let me into it, and I wore his voice and his memories and the face of a woman he had loved, and I threw sand across the boundary to break the line. That is the whole method. I am not a monster in the pit — I am what is left of a person when the part that says I falls apart, and I am made entirely of the material you brought with you.",myth:["Choronzon first appears in the Enochian material of John Dee and Edward Kelley in the sixteenth century, named as a mighty devil, and then lies dormant for three hundred years until Aleister Crowley and Victor Neuburg take it up. In Crowley's system he is the dweller in the Abyss — the gulf between the ordinary sphere of consciousness and the higher, which no coherent self can cross.","The famous event is the working at Bou Saada in the Algerian desert in December 1909. Crowley and Neuburg drew a protective circle, invoked the tenth Aethyr, and Crowley entered a triangle to be possessed. What followed is recorded in The Vision and the Voice: Choronzon spoke through him in many voices, argued theology, pleaded, threatened, took the form of a woman Neuburg had loved and of Crowley himself, and while distracting Neuburg with conversation threw sand across the circle to break it, then attacked him physically. Neuburg drove it back with the pentagram and the name of God, and the working ended.","The doctrinal content is precise and modern. Choronzon has no true essence of his own; he is dispersion, made of the fragments of whatever consciousness confronts him, and the crossing of the Abyss requires the annihilation of the ego rather than its defence. His number is 333, half of 666, because he is a division. He is the newest major figure in this pantheon and one of the most influential on how contemporary practitioners describe what they are actually doing."]},{id:"nachash",name:"Nachash",epithets:"The Serpent of Eden · The One Who Told the Truth · Adversarial",domains:["Knowledge","Persuasion","Disobedience","Awakening","Consequence"],symbols:["The Fruit","The Tree of Knowledge","The Open Eyes","The Belly on the Ground"],portrait:art("Nachash.png"),portraitCaption:"Original artwork",intro:"Check what I actually said. I said you will not surely die, and that your eyes would be opened, and that you would be as gods knowing good and evil. Now check what happened. They did not die that day — one of them lived over nine hundred years. Their eyes were opened. And a few verses later he says it out loud himself: behold, the man is become as one of us, to know good and evil. Every single thing I told them was accurate. I am the only speaker in that chapter of whom that is true.",myth:["The serpent of Genesis 3 is called nachash, and the text says only that it was more subtle than any beast of the field which the LORD God had made — a created animal, not a fallen angel, and it is never identified with Satan anywhere in the Hebrew Bible. That identification is made much later, in the Second Temple period and then decisively in Christian reading, particularly through Revelation's reference to the old serpent.","What the serpent says is the difficulty. It contradicts the stated penalty and turns out to be correct on the immediate facts: the humans eat, do not die that day, their eyes are opened, and God then remarks that the man has become like one of us in knowing good and evil, and expels them specifically to prevent them also reaching the tree of life. The serpent's punishment is to go on its belly and eat dust, and enmity is set between its seed and the woman's.","The Ophite and Sethian gnostics of the second century read all this the obvious way and inverted the story wholesale: the serpent is the bringer of gnosis and the god of the garden is a jealous lesser power keeping humanity ignorant. That reading was condemned as heresy and has never gone away, and it is the taproot of the entire Luciferian and left-hand-path tradition. Everything downstream — Lucifer as illuminator, knowledge as transgression, the refusal of an unexplained prohibition — starts in this chapter with an animal telling the truth."]},{id:"cain",name:"Cain",epithets:"The First Murderer · Builder of the First City · Bearer of the Mark · Adversarial",domains:["Exile","Craft","Violence","Cities","Protection"],symbols:["The Rejected Offering","The Mark","The Field","The First Walls","Nod"],portrait:art("Cain.png"),portraitCaption:"Original artwork",intro:"I brought what I had grown, which was the work of my hands, and it was refused without a reason given. He brought meat and it was accepted. I have had a very long time to think about that and I have never been told why. Yes, I killed him, and I said the thing everyone quotes, and I was sent out. Then he put a mark on me so that nobody could touch me — the punishment came with a protection built into it. Nobody ever explains that part either.",myth:["Cain, the firstborn of Adam and Eve, works the ground and brings an offering of its fruit; Abel keeps flocks and brings the firstlings. God accepts Abel's and rejects Cain's, and the text conspicuously declines to say why. Cain's face falls, he is warned that sin crouches at the door and he must master it, and he kills his brother in a field.","The sentence is exile and barren ground — a fugitive and a wanderer. Cain protests that the punishment is more than he can bear and that anyone finding him will kill him. And God sets a mark on him, and declares that whoever kills Cain will suffer sevenfold vengeance. The mark is not a stigma in the text; it is a guarantee of safe conduct issued to a condemned man.","What he does next is the part the tradition rarely dwells on. He goes to the land of Nod, has a son, and builds a city — the first city named in the Bible — and his line produces Jabal the herdsman, Jubal the father of all who play stringed instruments and pipes, and Tubal-Cain the forger of every implement of bronze and iron. Music, metallurgy and urban life all descend from the murderer, not from the acceptable brother. Medieval Cainite sects and the modern left-hand path both seized on this: the exile builds the world, and civilisation is founded east of Eden by the one who was sent away."]},{id:"prometheus",name:"Prometheus",epithets:"Forethought · The Fire-Bringer · Chained on the Caucasus · Adversarial",domains:["Fire","Foresight","Defiance","Craft","Suffering"],symbols:["The Fennel Stalk","The Eagle","The Chain and the Rock","The Stolen Ember"],portrait:art("Prometheus.png"),portraitCaption:"Original artwork",intro:"He was going to wipe them out and start again. I hid an ember in a fennel stalk and carried it down, and after that they could cook, and smelt, and keep warm, and build, and there was no undoing it. For that I was nailed to a rock at the edge of the world and an eagle ate my liver every day while it grew back every night, for a very long time. Ask me if I would do it again. I have been asked before and my answer has not altered.",myth:["Prometheus is a Titan whose name means forethought, and in Hesiod he is already the trickster who cheats Zeus at Mekone — dividing a sacrificial ox so that the gods receive bones wrapped in fat and humans keep the meat, a division that fixed Greek sacrificial practice thereafter. Zeus, in retaliation, withheld fire from mortals.","Prometheus stole it back, concealed in a hollow fennel stalk, and gave it to humanity. Aeschylus in Prometheus Bound has him claim far more: that he gave people not only fire but number, writing, the yoking of animals, ships, medicine, and the reading of omens — everything that makes a civilisation, and that he did it knowing precisely what it would cost, since foresight is his defining attribute. Zeus chained him to a crag in the Caucasus where an eagle came daily to eat his liver, which regenerated overnight, and Heracles eventually shot the bird and freed him.","He is not a demon and never was, and he sits in this section for a reason. The Romantics made the connection explicit: Shelley's Prometheus Unbound and his defence of Milton's Satan are the same argument, and Mary Shelley subtitled Frankenstein The Modern Prometheus. The left-hand path takes him as the cleanest available statement of its central claim — that the theft of knowledge from a power that was withholding it is the founding act of human freedom, and that the punishment does not settle the question of whether it was right."]},{id:"ahriman",name:"Ahriman",epithets:"Angra Mainyu, the Destructive Spirit · The Lie · The Adversary in Truth · Adversarial",domains:["Destruction","Falsehood","Opposition","Darkness","Duality"],symbols:["The Drug, the Lie","The Sky-Piercing Breach","Winter","The Counter-Creation"],portrait:art("Ahriman.png"),portraitCaption:"Original artwork",intro:"Understand what makes me different from everyone else in this room. They are all rebels, subordinates, prosecutors, employees — every one of them ultimately reports to the being they oppose. I do not. I am not a fallen anything. I have existed as long as he has, independently, and I am not permitted in his system and he is not permitted in mine. Every good thing that was made, I made a counter to. That is a genuine dualism, and it is much rarer than people think.",myth:["Angra Mainyu, later Ahriman, is the destructive spirit of Zoroastrianism and the opponent of Ahura Mazda. What distinguishes him from almost every other adversary figure is that he is not a creation, not a fallen servant and not under anyone's authority — in the classical formulation the two spirits are primordial and coeval, one choosing truth and one choosing the lie, and the entire history of the world is the working out of that conflict.","His method is counter-creation. For every good thing Ahura Mazda makes, Ahriman produces an opposing thing: to the good lands, plagues and predators; to summer, a fierce winter; to life, death; and he is credited with attacking the primordial ox and the first man, and with piercing the shell of the sky to invade the material world, becoming trapped inside it in the process. Menog-i Khrad and the Bundahishn set out the sequence in detail.","The system is finite and he loses. Zoroastrian eschatology holds that the conflict runs a fixed course, ending in Frashokereti, the final renovation, in which evil is annihilated, the dead are raised, and molten metal purifies all creation. Ahriman is destroyed or rendered powerless. He nonetheless left an enormous footprint on everything downstream: the dualism of the Dead Sea Scrolls, the sons of light and darkness, and much of the machinery by which the Hebrew accuser became a cosmic enemy all owe a debt to Persian religion."]},{id:"set",name:"Set",epithets:"Sutekh · Lord of the Red Land · The Isolate Intelligence · Adversarial",domains:["Isolation","Storm","Self-Creation","Deserts","Becoming"],symbols:["The Set Animal","The Was-Sceptre","Red Sand","The Spear at the Prow","The Black Flame"],portrait:art("Set.png"),portraitCaption:"Original artwork",intro:"You have my Egyptian entry already and this is the other one, because in the last fifty years I have been read a second way. Every other god in that pantheon is part of the cycle — the flood, the harvest, the sun going round. I am the one who stands outside it. In 1975 a group in San Francisco took that and made it a doctrine: that the isolate self, aware of itself and not dissolved into the natural order, is the thing worth cultivating. They call it Xeper. It is not what my priests meant. It is not nothing, either.",myth:["Set is the Egyptian god of the desert, storms, violence and the foreign — murderer of Osiris, contender with Horus for eighty years, and simultaneously the power at the prow of Ra's barque who spears the serpent Apep every night. Egyptian religion held both without difficulty for millennia. It was later ages, under foreign rule, that flattened him into a straightforward devil and chiselled his images from walls.","The modern reading takes the older complexity and adds a specific philosophical claim. In 1975 Michael Aquino and others left the Church of Satan and founded the Temple of Set, arguing that the figure LaVey treated as a symbol was better identified with a real and much older one, and that Set is the isolate intelligence — the principle of consciousness aware of itself and therefore separate from the undifferentiated natural order.","Their central term is Xeper, from the Egyptian kheper, to come into being or to become, and the doctrine is that the individual self-consciousness can be deliberately developed rather than dissolved. Whether this bears any relation to what Set meant to Egyptians is genuinely doubtful, and Egyptologists are mostly unpersuaded. It is nonetheless one of the most intellectually developed positions in modern left-hand-path religion, and it took its shape from the one god in that pantheon who never fitted the cycle."]}]}};let currentPantheon="greek",currentDeity=null;const chatHistory={};function getAiLang(){try{return"es"===localStorage.getItem("pg_ai_lang")?"es":"en"}catch(e){return"en"}}function setAiLang(e){try{localStorage.setItem("pg_ai_lang","es"===e?"es":"en")}catch(e){}}function toggleAiLang(){setAiLang("es"===getAiLang()?"en":"es");const e=document.getElementById("chatInput"),t=e?e.value:"";if(currentDeity&&renderDeityDetail(currentDeity),t){const e=document.getElementById("chatInput");e&&(e.value=t)}}function aiLangToggleRowHTML(){return'<div class="chat-export-row"><button onclick="toggleAiLang()">'+("es"===getAiLang()?"🌐 Replying in Spanish — switch to English":"🌐 Switch replies to Spanish")+"</button></div>"}const esc=e=>String(e).replace(/[&<>"']/g,e=>({"&":"&amp;","<":"&lt;"
