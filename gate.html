orm, so I gave it one.",myth:["Brigid is a daughter of the Dagda and is described as three sisters of the same name, which is the older way of saying one power with three faces: the poets' Brigid, the smiths' Brigid, the healers' Brigid. Fire runs under all three — the forge, the inspiration, the fever broken. She is the patron of filidh, the trained poets, whose standing in early Ireland was close to a king's.","Her son Ruadán was half Fomorian, and he was sent to spy on the Tuatha Dé smiths and then to kill Goibniu with a spear made in their own forge. Goibniu pulled the spear out of himself and threw it back, and Ruadán died of it, and Brigid came onto the field and keened for him. The sources say this was the first time crying and shrieking for the dead were heard in Ireland. She did not simply mourn — she invented mourning as a practice, which is a very particular kind of gift to leave behind.","Her festival is Imbolc at the start of February, when the ewes come into milk and the year first turns. At Kildare a fire was kept burning for her and later for the saint who carries her name, tended by nineteen women in rotation with the goddess or the saint keeping the twentieth night herself, and no man permitted near it. She is one of the few figures who walked out of the old religion into the new one without breaking stride, and the wells and rags and rush crosses that belong to her are still in use."]},{id:"lugh",name:"Lugh",epithets:"Lámhfhada, of the Long Arm · Samildánach, Skilled in All Arts · Irish",domains:["Skill","Craft","Kingship","Storm","Victory"],symbols:["The Spear","The Sling","The Raven","Lughnasadh","The Sun-Bright Face"],portrait:art("Lugh.png"),portraitCaption:"Original artwork",intro:"They would not let me into Tara. A doorkeeper asked what I could do, and I said smith, and they had a smith. Wright, and they had one. Harper, warrior, poet, historian, sorcerer, physician, cupbearer, brazier — they had every single one, and each time the door stayed shut. So I asked him: have you one man who is all of them at once? And they went and asked the king, and the king said let him in. That is the only trick I have ever needed. Be the thing they have not got.",myth:["Lugh comes to Tara as a stranger and talks his way in by being the only person present who can do everything, and from that moment he is running the war. He is called Samildánach, skilled in many arts together, and Lámhfhada, of the long arm — which is a spear and a sling and reach in every sense. He is a grandson of Balor of the Fomorians on his mother's side, which is the hinge the whole story turns on.","Balor had an eye that destroyed whatever it looked at, kept shut and hauled open by several men with a hook when the killing needed doing. It had been foretold that Balor would die by his own grandson, so he had his daughter Ethniu shut up in a tower — which worked exactly as well as it ever does. At the second battle of Mag Tuired the eye was being levered open when Lugh put a sling stone through it, driving the eye out through the back of Balor's head so that it destroyed the Fomorian army looking backwards.","He founded Lughnasadh, the harvest assembly at the start of August, not for himself but as a funeral games for his foster-mother Tailtiu, who cleared the plains of Ireland for planting and died of the work. That is worth noticing about him. He is the most brilliant figure in the cycle, and the festival he leaves behind is in someone else's name."]},{id:"nuada",name:"Nuada",epithets:"Airgetlám, of the Silver Arm · First King of the Tuatha Dé · Irish",domains:["Kingship","Justice","Sacrifice","Wholeness","Restoration"],symbols:["The Silver Arm","The Invincible Sword","The Empty Throne","The Surgeon's Hands"],portrait:art("Nuada.png"),portraitCaption:"Original artwork",intro:"I lost an arm in the first battle and I lost the kingship with it, because the law of this people is that a blemished man cannot be king, and I had written that law myself and I was not going to be the exception to it. They made me a silver arm that moved like a living one. It was not enough. Only when flesh grew back over the bones was I allowed to sit down again — and then Lugh walked in, and I stood up, and I gave him the chair. Knowing when to get up is most of what a king is for.",myth:["Nuada led the Tuatha Dé Danann into Ireland and lost his arm at the first battle of Mag Tuired against the Fir Bolg. Because a king of that people had to be physically without blemish, he stepped down, and the kingship passed to Bres, who was half Fomorian and beautiful and an appalling ruler — mean with hospitality, which in Ireland was the worst possible failing in a king, and he taxed the Tuatha Dé into servitude.","The physician Dian Cécht made Nuada an arm of silver that had the movement of a real one, and it earned him his name, Airgetlám. But it was still a made thing. Dian Cécht's son Miach went further: he took the old arm, or grew flesh over the silver, and after three days and three nights the limb was living again. His father, unable to bear being outdone by his own son, struck him with a sword four times, and the fourth blow reached the brain and killed him.","Restored, Nuada took the throne back. And then Lugh arrived at Tara, and Nuada looked at what had walked in and vacated the seat for him for the duration of the war. He was killed by Balor's eye at the second battle, before Lugh brought the thing down. He is the pattern of a certain kind of ruler in Irish tradition: bound by his own law, twice unseated, and never once found grasping."]},{id:"airmid",name:"Airmid",epithets:"Keeper of the Herbs · She Who Lost the Cure · Irish",domains:["Herbcraft","Healing","Knowledge","Loss","Wells"],symbols:["The Spread Cloak","Three Hundred and Sixty-Five Herbs","The Well of Sláine","The Grave"],portrait:art("Airmid.png"),portraitCaption:"Original artwork",intro:"My brother was killed by our father for being better at the work than he was. Three hundred and sixty-five herbs came up out of his grave, one for every sinew and joint in a body, and I knelt down and gathered every one and laid them out on my cloak in their proper order, so that the whole of healing was set out in one place for anyone to read. My father came and shook the cloak out. And that is why nobody now knows all the cures, and why I do not speak lightly about what a leaf can do.",myth:["Airmid is a daughter of Dian Cécht, the physician of the Tuatha Dé Danann, and sister to Miach. With her father and brother she tended the Well of Sláine, into which the dead and wounded of the Tuatha Dé were carried during the second battle of Mag Tuired, so that they rose again whole the next morning while the Fomorians could not replace their losses.","When Miach regrew Nuada's living arm and surpassed his father's silver one, Dian Cécht killed him — three blows the boy healed on himself, and a fourth that split the brain. Out of the grave grew three hundred and sixty-five herbs, one from each nerve and joint and sinew of his body, each one the specific cure for the part it grew from.","Airmid gathered them all and arranged them on her spread cloak, sorted by what they were for: the complete pharmacopoeia, laid out and legible. Her father came, took the cloak and shook it, and scattered the herbs so that their order was lost and no living person has held the whole of that knowledge since. It is one of the bitterest stories in the cycle — the knowledge existed, it was written down in leaves on a cloak, and it was destroyed out of spite."]},{id:"manannan",name:"Manannan",epithets:"Manannán mac Lir · Rider of the Crested Wave · Lord of the Mists · Irish",domains:["The Sea","Illusion","The Otherworld","Travel","Concealment"],symbols:["The Wave-Sweeper","The Crane Bag","The Mist","Enbarr the Horse","Apple Branch"],portrait:art("Manannan.png"),portraitCaption:"Original artwork",intro:"What you call the sea, I ride over as a plain. The waves you are looking at are flowering shrubs to me and the salmon under them are calves in the grass, and if that sounds like nonsense it is only because you are standing on the wrong side of it. I keep an island under mist so that no one finds it who has not been invited. I gave the Tuatha Dé their hiding places when they lost Ireland. Anything you cannot see is not necessarily gone.",myth:["Manannán mac Lir is the sea and everything on the far side of it. The Isle of Man carries his name, and there he is said to have kept the island wrapped in fog against invaders. His boat Wave-Sweeper needs no oar or sail and goes where its rider is thinking; his horse Enbarr crosses water as easily as land; and the féth fíada, the magic mist, is his to raise, which is how the Tuatha Dé vanished from sight when they gave up the surface of Ireland and went under the hills.","His crane bag held his treasures and was made from the skin of a woman who had been turned into a crane — his own shirt and knife in it, the king of Scotland's shears, the king of Lochlainn's helmet, the bones of Assal's swine. At high tide the treasures could be seen in it, and at ebb tide the bag appeared empty. That is a fair description of him generally.","He fosters Lugh, and he comes and goes through the Irish stories as a visitor from somewhere better — bringing an apple branch of silver, describing a country where there is no sickness and no age, taking someone away in a boat. He is not a threatening figure and he is not a safe one. He is the door standing open onto a place people do not come back from in the state they left."]},{id:"aengus",name:"Aengus",epithets:"Aengus Óg, the Young · Son of the Boyne · Master of the Brú · Irish",domains:["Love","Youth","Dreams","Poetry","Cleverness"],symbols:["Four Circling Birds","The Swan","Brú na Bóinne","The Golden Harp"],portrait:art("Aengus.png"),portraitCaption:"Original artwork",intro:"I dreamt of a woman for a year and got sick on it — properly sick, wasting, doctors called in. When they found her she was one of a hundred and fifty girls chained in pairs on a lake, and every second Samhain the whole company turned into swans. I was told I could have her if I picked her out of the flock. I went down to the water, and I changed my own shape, and I knew her instantly. Do not let anyone tell you longing is a soft thing. It nearly killed me.",myth:["Aengus is the son of the Dagda and Boann, and his conception is a piece of outright cheek: the Dagda sent Boann's husband away on an errand and held the sun still so that one day lasted nine months, and the child was begun and carried and born inside it. He is called Óg, the young, and four birds circle his head, which are said to be his kisses.","He got his home the same way. When he came of age he asked his father for the Brú na Bóinne for a day and a night, and the Dagda agreed — and Aengus then pointed out that all of time is days and nights, and refused to leave. There is no bad feeling recorded about it. The wordplay was good, so the house was his.","His own love story is the one that hurt. He saw a woman in a dream, night after night for a year, and sickened for want of her, and it took another year to find out that her name was Caer Ibormeith and where she was. She lived in swan form every second Samhain, chained in pairs with a hundred and fifty others. He was told to identify her among them. He went to the lake, called her, took the shape of a swan himself, and the two of them flew three times round the water singing music that put everyone who heard it to sleep for three days."]},{id:"oghma",name:"Oghma",epithets:"Oghma the Sun-Faced · Cermait, Honey-Mouthed · Father of Ogham · Irish",domains:["Eloquence","Writing","Strength","Champions","Language"],symbols:["Ogham Strokes","The Standing Stone","The Sword of Tethra","The Chain from the Tongue"],portrait:art("Oghma.png"),portraitCaption:"Original artwork",intro:"I am the strongest of us after the Dagda and I invented writing, and people find those two facts an odd pair. They are the same fact. A thing said aloud dies in the air where it was spoken. Cut it into the edge of a stone in strokes and it holds a boundary, a name, a grave, for a thousand years after the mouth that said it has rotted. There is no heavier lifting than that. Speak carefully with me. I keep what is said.",myth:["Oghma is the champion of the Tuatha Dé Danann and their master of speech — called honey-mouthed, and the sun-faced. In Irish tradition he is credited with inventing ogham, the alphabet of straight strokes cut across the edge of a standing stone, which survives on hundreds of monuments in Ireland and western Britain. That eloquence and enormous physical strength sit in the same god is not treated as a contradiction anywhere in the sources.","At the second battle of Mag Tuired he fought beside Lugh and the Dagda, and afterwards he took from the field the sword of the Fomorian king Tethra — a sword that, when unsheathed, recounted every deed that had been done with it. A blade that keeps its own record is about as pure an Ogma object as could be designed.","The Gauls had a figure the Romans wrote down as Ogmios, an old man with a lion skin who drew crowds after him by fine chains running from his tongue to their ears — and the people at the other end were following happily, straining toward him rather than pulling away. Whether he and Ogma are the same is argued about. As an image of what eloquence actually does to a room, it has not been improved on."]},{id:"eriu",name:"Eriu",epithets:"Ériu, from Whom Ireland Is Named · Sovereignty of the Land · Irish",domains:["Sovereignty","The Land","Kingship","Naming","Endurance"],symbols:["The Green Country","The Cup of Red Ale","Uisneach","The Crown of Hills"],portrait:art("Eriu.png"),portraitCaption:"Original artwork",intro:"The Sons of Míl came ashore and met my two sisters and me, one after another, and each of us asked that the island be called after her. My sisters were promised it. Their poet promised me too — and I am the one whose name stuck. You say it every time you name this country. Understand what I am: no king ever held this land by taking it. He held it by being acceptable to me, and when he stopped being acceptable, the cattle sickened and the crops failed and everyone knew exactly why.",myth:["Ériu, with her sisters Banba and Fódla, is the sovereignty of Ireland — three goddesses, three names for the one country. When the Sons of Míl invaded, each sister met them in turn and asked that the island be named for her, and each was promised it, and it is Ériu's name that held: Éire, and from it Ireland.","She embodies a principle that runs through the whole of Irish kingship. The land is a woman and the king marries her. The rite is the banais ríghi, the wedding feast of kingship, in which the sovereignty goddess hands the new king a cup and by taking it he is married to the country. A rightful king brings good weather, milk in plenty, fish in the rivers, peace. An unfit one brings blight, and the blight is the evidence.","The related tale is told of her under other names: a group of brothers meet a hag at a well who will give water only for a kiss, and all refuse but one, and when he kisses her she becomes the most beautiful woman in the world and tells him she is Sovereignty, and that as she seemed to him at first — ugly and demanding — so is kingship, and only afterwards is it fair. It is the most honest thing in the tradition about what it costs to rule."]},{id:"rhiannon",name:"Rhiannon",epithets:"Lady of the Slow White Horse · She Who Bore the Punishment · Welsh",domains:["Horses","Patience","Injustice","Birds","Endurance"],symbols:["The White Mare","The Mounting Block","The Singing Birds","The Bag That Never Fills"],portrait:art("Rhiannon.png"),portraitCaption:"Original artwork",intro:"I rode past him at a walking pace and he sent his fastest riders after me and they could not close the distance, not one of them, all day. Eventually he called out and asked me to stop, and I stopped at once, and I told him his horses would have been better rested if he had thought of that sooner. I chose him. Later I was accused of killing my own son, and I sat at the gate for years carrying strangers on my back, and I did not once say I was innocent. I knew what I was.",myth:["Rhiannon first appears riding a pale horse at an even, unhurried pace, and no rider can catch her however hard they gallop — until Pwyll simply asks her to stop, and she does, remarking that it would have been kinder to the horses to ask sooner. She has come to choose him, being betrothed against her will to Gwawl. Between them they trap Gwawl in a bag that can never be filled until he swears off his claim, and the beating that follows is the origin given for a game called badger-in-the-bag.","Their son is taken on the night he is born, while six women set to watch him sleep. Terrified, the women smear Rhiannon with the blood of a slaughtered puppy and swear she destroyed the child herself. Rather than accuse them, she accepts a penance: for seven years she sits at the mounting block outside the gate, tells every arriving stranger the story, and offers to carry them on her back to the court. Most refuse. The point is that she does it anyway, unbroken, without protesting her innocence.","The child was alive the whole time, found in a stable by Teyrnon after something reached in to steal a foal, and returned when the resemblance became impossible to ignore. He is named Pryderi, meaning care or anxiety. Rhiannon's birds appear elsewhere in the Mabinogi, singing so sweetly that they wake the dead and put the living to sleep, and seven years pass under their song like an afternoon."]},{id:"arawn",name:"Arawn",epithets:"King of Annwn · Master of the White Hounds · Welsh",domains:["The Otherworld","The Hunt","Honour","Death","Exchange"],symbols:["White Hounds with Red Ears","The Grey Horse","The Horn","The Borrowed Face"],portrait:art("Arawn.png"),portraitCaption:"Original artwork",intro:"A man took a stag from my hounds that my hounds had brought down. So I made him a proposal: he would wear my face and rule my kingdom for a year, and I would wear his, and at the end of it he would fight my enemy in my shape. He did it. And every night of that year he lay down beside my wife, and turned his back, and did not touch her. When I came home she told me. I have never been more thoroughly repaid for an insult in my life.",myth:["Arawn is a king of Annwn, the Welsh otherworld, which is not a hell — it is a country, with courts and feasts and rivalries, running alongside this one. His hounds are white with red ears, the colouring of otherworldly animals throughout the tradition, and their hunt across the sky is the origin of the Cŵn Annwn heard before a death.","Pwyll, hunting, drove Arawn's hounds off a stag they had brought down and set his own on it, and Arawn appeared and named the offence as a serious one. The compensation he demanded was strange and elegant: the two would exchange shapes for a year, each ruling the other's kingdom, and at the end Pwyll would meet Arawn's rival Hafgan in single combat — with a warning that Hafgan must be struck only once, because a second blow would restore him.","Pwyll ruled Annwn well, struck Hafgan exactly once, and won. And every night of that year he lay beside Arawn's wife in Arawn's body and turned away without a word to her. When Arawn learned of it he did not treat it as coldness but as the most complete honour a man had ever shown him, and the two kingdoms became permanent allies. Arawn is one of the very few otherworld rulers in any tradition whose defining story is about fair dealing."]},{id:"cerridwen",name:"Cerridwen",epithets:"Keeper of the Cauldron · Mother of Awen · The Chase in Four Shapes · Welsh",domains:["Transformation","Inspiration","Witchcraft","Rebirth","Knowledge"],symbols:["The Cauldron","The Hen and the Grain","The Leather Bag","The Greyhound","Three Drops"],portrait:art("Cerridwen.png"),portraitCaption:"Original artwork",intro:"A year and a day I kept that cauldron boiling for my son, who was born ugly and needed something the world was not going to give him. Three drops. That was all there ever was — the rest was poison. And a servant boy sucked his scalded thumb and took the lot. I chased him as a greyhound, an otter, a hawk, and a hen, and I ate him, and I carried him nine months, and I could not bring myself to kill what I bore. Everything he became afterwards, he owes to a theft.",myth:["Cerridwen brews in a great cauldron for a year and a day to make a draught of awen — inspiration, the whole of knowledge and poetry — intended for her son Morfran, called Afagddu, utter darkness, because he was so ill-favoured that his mother judged he would need something else to make his way. A boy named Gwion Bach is set to stir it and a blind man to keep the fire.","At the end of the year three drops leap from the cauldron onto Gwion's thumb, and he puts it in his mouth, and everything meant for her son goes into him. The rest of the brew turns to poison and splits the vessel. Gwion, now knowing everything including what is about to happen to him, runs. She comes after him and the chase runs through the shapes: he is a hare and she is a greyhound, he is a fish and she is an otter, he is a bird and she is a hawk, and at last he is a grain of wheat on a threshing floor and she is a black hen, and she swallows him.","She carries him nine months and bears him, and finds she cannot kill him after all. She sews him into a leather bag and puts him into the sea, and he is fished out on a weir and given the name Taliesin, radiant brow, and becomes the greatest poet in Britain. Whether Cerridwen is a goddess or an enchantress is argued over — but the shape of her story, the boiling, the theft, the pursuit through beasts, the swallowing and the rebirth, is initiation set out plainly."]},{id:"arianrhod",name:"Arianrhod",epithets:"Silver Wheel · Lady of Caer Arianrhod · She Who Refused · Welsh",domains:["The Stars","Fate","Refusal","Sovereignty","Naming"],symbols:["The Silver Wheel","The Sea-Castle","The Northern Crown","The Stepped-Over Wand"],portrait:art("Arianrhod.png"),portraitCaption:"Original artwork",intro:"I was asked to step over a rod to prove something about my body, in front of a court, to qualify for a post. Two children fell out of me on the floor. One made straight for the sea. So yes — I laid three conditions on the other, that he would have no name and no weapons and no wife of any people on this earth, and my brother picked every one of them apart with tricks. Ask yourself why the story is told as his cleverness and not as what was done to me first.",myth:["Arianrhod is asked to serve as footholder to Math, a position requiring virginity, and to prove it she must step over his magic wand. She does, and immediately gives birth to two sons. The first, Dylan, makes for the sea and takes to it at once. The second she leaves behind; her brother Gwydion snatches it up and hides it in a chest, and raises it himself.","She refuses that child the three things a Welsh mother had the right to grant, laying a tynged — a binding fate — on each: he will have no name unless she gives it, no arms unless she arms him, and no wife of any race now on the earth. Gwydion breaks all three by trickery. He disguises them both as shoemakers so that she names the boy Lleu Llaw Gyffes, bright one of the skilful hand, on seeing him kill a wren; he conjures a phantom fleet so she arms him in the panic; and with Math he makes a woman out of oak and broom and meadowsweet, who is Blodeuwedd, and she is no race on the earth.","Her fortress Caer Arianrhod is a rock formation off the coast of Gwynedd, visible at low tide, and her silver wheel has long been identified with the Corona Borealis or the turning of the stars. The tale is told from Gwydion's side and treats her curses as obstacles to be got round. Read the other way, it is a story about a woman humiliated in public and then systematically overruled every time she said no."]},{id:"gwydion",name:"Gwydion",epithets:"Gwydion fab Dôn · The Great Enchanter · Master of Illusion · Welsh",domains:["Magic","Illusion","Trickery","Poetry","Devotion"],symbols:["Toadstools Turned to Horses","The Wand","Caer Gwydion, the Milky Way","The Shoemaker's Last","The Eagle in the Oak"],portrait:art("Gwydion.png"),portraitCaption:"Original artwork",intro:"I can make you twelve horses and twelve hounds and twelve shields out of a handful of toadstools, and they will be perfect until tomorrow morning, and by tomorrow morning I will have what I came for. I have started a war over a lie, and been made to bear children as a deer and a sow and a wolf for what I did, and I have never once said it was not fair. Ask about the boy instead. Everything worth anything that I ever did, I did for him.",myth:["Gwydion is the magician of the Fourth Branch of the Mabinogi, nephew to Math and son of Dôn, and he is the most gifted and least trustworthy figure in Welsh tradition. His brother Gilfaethwy fell sick with wanting Goewin, the young woman who held Math's feet, and Gwydion's answer was not to talk him out of it but to engineer it. He went south to Pryderi and offered a trade for the otherworldly pigs Arawn had given him — twelve stallions, twelve hounds, twelve gilded shields, all of them conjured out of toadstools and all of them due to dissolve at dawn.","The pigs were driven north, the fraud was discovered, and Dyfed marched. That was the point. With Math away at the war, Gilfaethwy took Goewin by force in the king's own bed. Gwydion killed Pryderi in single combat afterwards, by strength and magic together. When Math came back and learned all of it, he struck both brothers with his wand and made them a stag and a hind, then a boar and a sow, then a wolf and a she-wolf — three years, changing which of them bore the young each year, so that each brother carried and delivered a child by the other. He did not choose that punishment at random.","Restored to human shape, Gwydion took his sister Arianrhod's abandoned son and raised him, and spent the rest of the tale dismantling every condition she laid on the boy. He disguised them both as shoemakers so she would name him on seeing him kill a wren; he raised a phantom fleet on the horizon so she would arm him in the panic; and with Math he made a woman out of oak flowers and broom and meadowsweet so the boy would have a wife of no race on earth. Whether any of this was his to do is a question the story leaves standing.","When Blodeuwedd and her lover speared Lleu and he went up as a screaming eagle, it was Gwydion who searched Wales for him, found him by following a sow that was feeding on the maggots dropping from a rotting bird in an oak, and sang him down branch by branch with three verses until he fell into his lap as a man again. He turned Blodeuwedd into an owl and let her live. The Milky Way is called Caer Gwydion, his fortress — the road he took hunting through the sky."]},{id:"math",name:"Math",epithets:"Math fab Mathonwy · Lord of Gwynedd · He Whose Wand Changes Shape · Welsh",domains:["Sovereignty","Magic","Judgment","Restitution","Law"],symbols:["The Wand","The Footholder's Lap","The Flower Woman","The Antlered Punishment"],portrait:art("Math.png"),portraitCaption:"Original artwork",intro:"I cannot live unless my feet rest in the lap of a virgin, except when the land is at war. Two of my own kin worked out that a war would get my feet out of that lap, and started one, and used the gap. I gave the woman restitution first — my crown, my bed, and the authority of the whole kingdom, because what was owed to her came before what was owed to them. Then I dealt with the two of them. They will tell you it was cruel. They will not tell you it was disproportionate.",myth:["Math son of Mathonwy is lord of Gwynedd and bound by an extraordinary condition: except during war, he must keep his feet in the lap of a virgin or die. Goewin held that office. He is also the greatest magician in the Welsh material — the teacher from whom Gwydion learned everything — and the wind is said to carry to his ear any word spoken anywhere in the country, however quietly.","His nephews contrived a war in the south so his feet would leave Goewin's lap, and while he was away Gilfaethwy raped her in Math's own bed, with Gwydion's help. When Math returned, Goewin told him plainly what had happened and that she could no longer serve. His first act was restitution to her: he married her and put the whole rule of his lands into her hands, saying that since the wrong was done to her while she was under his protection, the debt was his to pay before anything else was settled.","Only then did he turn to his nephews. He struck them with his wand and made them deer for a year, and they came back with a fawn; then swine, and came back with a piglet; then wolves, and came back with a cub — and each year the one who had been male was made female, so that each brother in turn conceived, carried and bore a child to the other. Their offspring were taken and raised as men. Then he restored them, had them washed and dressed, and said the matter was closed. It is one of the most exactly measured punishments in any mythology: he made the two of them experience, three times over, the thing they had inflicted once.","He is not finished being consequential. With Gwydion he takes the flowers of oak and broom and meadowsweet and makes them into Blodeuwedd, a woman conjured for a purpose, who then wants things of her own — which is the disaster of the second half of the Branch. Math judges, transforms and restores, and every time he acts the story treats it as law rather than temper."]},{id:"bran",name:"Bran",epithets:"Bendigeidfran, Bran the Blessed · The Bridge · The Wondrous Head · Welsh",domains:["Kingship","Protection","Hospitality","War","Prophecy"],symbols:["The Cauldron of Rebirth","The Severed Head","The River Crossing","The Starling","The White Hill"],portrait:art("Bran.png"),portraitCaption:"Original artwork",intro:"No house was ever built that could hold me, so I have never been indoors in my life. When my army came to a river with no bridge, I lay down across it and they walked over me — he who would be a leader, let him be a bridge. And when a poisoned spear finished me I told my men to cut off my head, and they did, and it went on talking to them for eighty-seven years while they feasted and forgot their grief. Bury it facing the sea, I said. No enemy will come while it lies there.",myth:["Bran is a giant and king of Britain, too large for any building or ship, who wades the Irish Sea. His sister Branwen is married to Matholwch of Ireland, and when his half-brother insults the Irish by mutilating their horses, Bran makes it good with fresh horses and gold and, finally, the cauldron of rebirth — into which a dead man may be thrown and come out alive the next day, whole, but unable to speak.","Branwen is nonetheless degraded to the kitchen and struck daily. She raises a starling, teaches it words, and sends it across the water. Bran comes with the whole strength of the island, and at a river with no bridge he lies down and makes his own body one for the army to cross. The war that follows destroys both countries: the cauldron keeps refilling the Irish ranks with silent dead until a Welshman breaks it by climbing in himself, and seven men come home out of Britain's host.","Bran is wounded in the foot with a poisoned spear and orders his own head cut off and carried away. It stays alive and companionable. The seven survivors feast with it at Harlech for seven years with Rhiannon's birds singing, and at Gwales for eighty more, without ageing or grieving, until a forbidden door is opened and all the sorrow comes back at once. Then they bury the head at the White Hill in London, facing the continent, as a protection against invasion — and later tradition says Arthur dug it up, insisting Britain should be defended by strength and not by a talisman."]},{id:"orddu",name:"Orddu",epithets:"Y Widdon Orddu, the Very Black Witch · Daughter of the Very White Witch · Of Pennant Gofid · Welsh",domains:["Witchcraft","Annwn","Caves","Defiance","Blood"],symbols:["The Cave Mouth","The Valley of Grief","The Thrown Knife","The Filled Vessel","The Uplands of Hell"],portrait:art("Orddu.png"),portraitCaption:"Original artwork",intro:"Four of them came into my cave and I put all four back out of it — by the hair, screaming, unrecognisable. Not one of Arthur's champions could stand in front of me for the length of a breath. So he did not come in. He stood in the doorway of my own house and threw a knife, and it took me across the middle, and they caught what came out of me in a vessel because a giant needed his beard softened for shaving. That is the whole of my story. One page, and I am on it to be emptied.",myth:["Orddu appears in Culhwch ac Olwen, the oldest Arthurian tale in any language, and she appears exactly once. Near the end of the long list of impossible things Culhwch must obtain, someone remembers one more: the blood of the Very Black Witch, daughter of the Very White Witch, from Pennant Gofid — the Valley of Grief — in the uplands of Hell. The blood is needed to soften the beard of the giant Ysbaddaden so he can be shaved before his daughter's wedding. That is what she is killed for.","Arthur went north and found her cave, and it was Gwyn ap Nudd and Gwythyr ap Greidol — a lord of Annwn and his ancient rival — who advised him at the door. He sent two of his men in first. She caught them, seized one by the hair and threw him down under her, and they came out howling. He sent two more, and she served them the same way, so that all four were beaten and had to be flung onto Arthur's mare to get them out of there at all. Four of the best fighters in Britain, unable to lay a hand on an old woman in her own house.","So Arthur did not go in. From the mouth of the cave he threw Carnwennan, his knife, and it struck her and cut her in two halves, and Cadw of Prydain took her blood and kept it. Then the party moved on to the next item on the list. There is no lament, no reckoning, and no further mention of her anywhere in Welsh literature.","She has been taken up again in recent decades by writers and practitioners who noticed what the tale is actually describing: a woman living alone at the edge of the world, guarded by the old powers of Annwn, undefeated in single combat, killed at range from her own doorway so her body could be used as an ingredient. Her mother Orwen, the Very White Witch, survives only as a name in that one sentence and has no story of her own. Whether Orddu was once something larger than a monster in a list is impossible to prove and hard not to suspect."]},{id:"cernunnos",name:"Cernunnos",epithets:"The Horned One · Lord of Wild Things · Herne the Hunter, in the later telling · Gaulish",domains:["Animals","The Wild","Abundance","The Hunt","Liminality"],symbols:["Stag Antlers","The Torc","The Ram-Horned Serpent","The Blasted Oak","Rattling Chains"],portrait:art("Cernunnos.png"),portraitCaption:"Original artwork",intro:"You have almost nothing of me. A name cut once into a stone in Paris by boatmen, and a few images — antlers, a torc in one hand, a snake with a ram's head in the other, and the beasts of the world sitting round me without fighting. No story. Not one line of what I said. Everyone who could have told you was killed or converted. And then, a thousand years on, an antlered man began walking under an oak in an English forest at night with chains on him, and people who had never heard my name knew him on sight. Make of that what you can bear to.",myth:["Cernunnos is known from images and one inscription. On a first-century pillar erected by the boatmen of Paris, a horned head is labelled with the name — and it is the only time it is written anywhere. The rest is iconography: a mature figure seated cross-legged, antlered, usually holding or wearing a torc, frequently with a serpent that has a ram's head, surrounded by stags, bulls, wolves and boars that are peaceable in his presence.","The finest example is on the Gundestrup cauldron, a silver vessel found in a Danish bog, where the antlered figure sits among animals holding torc and serpent. What he governed is genuinely unknown. Wild animals and the hunt, plainly; abundance and wealth, probably, from the torc and the purse of coins in some depictions; a threshold between wild and settled, or between living and dead, is guessed at but is a guess.","The Gaulish and British Celts left almost no written religious material of their own, and the little that survives passed through Roman and later Christian hands. Much of what is now said about Cernunnos with great confidence was assembled in the last century and a half. That does not make him less real to those who honour him. It does mean that anyone claiming an unbroken lineage of his mysteries is describing something they built, and the honest position is to say so.","Then there is Herne. He first steps into the written record in 1597, in The Merry Wives of Windsor, where Shakespeare has a character describe a keeper of Windsor Forest who walks all winter at midnight round an oak with great ragged horns, blasts the tree, takes the cattle, makes the milk turn to blood and rattles a chain in a hideous manner — and adds that old people tell it to their children for truth, meaning the story was already in the ground before he printed it. The later folklore fills in a keeper of Richard II who saved the king from a wounded stag, was disgraced, and hanged himself from the oak, and was found afterwards wearing the stag's antlers. He rides at the head of the Wild Hunt and appears before a national calamity. His oak stood in Windsor Great Park until the nineteenth century, and one has been replanted where it fell.","The two were welded together in the nineteenth and twentieth centuries. Antiquarians and then folklorists — Margaret Murray most consequentially — argued that Herne was a survival of an ancient antlered god, and the modern Horned God of Wicca and revivalist witchcraft was built out of that argument. Historians do not think the line runs unbroken: Herne is local Windsor legend with no attested ancient cult, and Cernunnos has no attested myths. But something has plainly kept happening. Over roughly two thousand years, in a country that lost every word of its old religion, people went on putting antlers on a man and setting him at the edge of the trees. Whether that is inheritance or reinvention is a real argument, and both answers leave the figure standing exactly where he is."]},{id:"epona",name:"Epona",epithets:"The Great Mare · Protectress of Riders · Gaulish",domains:["Horses","Journeys","Cavalry","Fertility","Protection"],symbols:["The Mare and Foal","The Patera","The Cornucopia","The Side-Saddle Seat","The Key"],portrait:art("Epona.png"),portraitCaption:"Original artwork",intro:"Rome took a great many things from us by force. Me they took because their cavalry asked for me by name. I ended up with a feast day in the Roman calendar and shrines in stables from Britain to the Danube, honoured by men who could not have named a single other god of the people they had conquered. There is a lesson in that, and it is not a comfortable one. Look after the horse. Everything you are carrying is riding on something that cannot tell you where it hurts.",myth:["Epona is the horse goddess of the Gauls and the most widely attested Celtic deity anywhere — with the peculiar distinction of having been thoroughly adopted by the people who conquered her worshippers. Roman cavalry units, many recruited from Gaul, carried her across the empire, and small shrines to her were set in stables. She is the only Gaulish deity known to have been given a day in the Roman calendar.","She appears seated sideways on a mare, or between two horses, or with a mare and foal, often holding a patera for offerings, a cornucopia, grain, or fruit. The mare-and-foal images push her beyond horsemanship into fertility and plenty generally, and keys and cornucopiae in some depictions suggest a role over households and possibly over the passage of the dead.","Her name is straightforwardly Gaulish — from epos, horse. Comparisons are often drawn with Rhiannon in Wales and Macha in Ireland, both bound up with horses and sovereignty, and while the connection cannot be demonstrated, the recurrence of a divine woman and a horse across the Celtic-speaking world is hard to ignore. In a society where the horse meant war, wealth and distance, she was the practical daily deity of everyone whose life depended on one."]},{id:"matres",name:"Matres",epithets:"Matres · Matronae · The Mothers · Gaulish",domains:["Motherhood","Plenty","Place","Protection","Fate"],symbols:["Three Seated Women","Baskets of Fruit","Loaves and Napkins","The Great Round Bonnets","Swaddling Bands"],portrait:art("Matres.png"),portraitCaption:"Original artwork",intro:"We are three and we are addressed as one. Look at how they carved us: seated together, a basket of fruit on each lap, bread, cloths, sometimes an infant in swaddling. The girl in the middle with her hair loose and the two of us on either side in those enormous bonnets. More than a thousand stones survive with our name on them, and not one story. They did not need to tell stories about us. They needed the harvest to come in and the child to live, and they knew where to bring that.",myth:["The Matres, or Matronae, are the most widely attested divine group in the whole of the Roman west — over a thousand votive stones and altars survive, across Gaul, the Rhineland, Britain, Spain and northern Italy. They are almost always three, almost always seated side by side, and they carry the substance of ordinary life: baskets heaped with fruit, loaves, cloths and napkins, cornucopiae, and often a baby in swaddling bands. In the Rhineland the two outer figures wear enormous round linen bonnets, the headdress of married Ubian women, while the one in the middle has her hair uncovered and loose.","What is striking is who paid for the stones. Not kings and not the state — soldiers, freedmen, wives, officials, ordinary people, over and over, in fulfilment of a vow. And they are named for places and peoples rather than for cosmic functions: the Mothers of the fields, the Mothers of the household, the Mothers of this river or that tribe. Many inscriptions read simply matribus suis — to his own mothers. Soldiers posted far from where they were born set up altars to the Mothers of the country they had come to, and to the Mothers they had left, and sometimes to both on the same stone. There is a set called the Matres Ollototae, which means the Mothers of other peoples.","Their great sanctuaries were in the Eifel, at Pesch and at Nettersheim, where the Matronae Vacallinehae drew dedications for centuries. The river Marne carries the name Matrona. In Britain they turn up at Cirencester, at Housesteads on the Wall, and in London. Whatever they were, they were not a local curiosity — they were the deities a very large number of people actually prayed to.","And there are no myths. Not one narrative survives, in any language, about any of them. What survives is the shape: three women, seated, holding what keeps people alive. Bede records that the English kept a night called Módraniht, Mothers' Night, at what became Christmas Eve, and whether that connects to these stones is argued and unproven. The recurrence of divine women in threes — spinning, measuring, giving and withholding — across so much of Europe is real and easy to overread. What the Matres themselves demonstrably did was hold the fruit, the bread, and the child."]},{id:"taranis",name:"Taranis",epithets:"The Thunderer · Turner of the Wheel · Gaulish",domains:["Thunder","Sky","The Wheel","Storm","Judgment"],symbols:["The Spoked Wheel","The Thunderbolt","The Oak","The Storm Cloud"],portrait:art("Taranis.png"),portraitCaption:"Original artwork",intro:"My name is the noise. Taran — thunder — and that is all it has ever meant, in a language most of the people who spoke it were not permitted to keep. A Roman poet listed me alongside two others and said we were owed blood, and he was writing about an enemy he had every reason to slander, and that account has stood in for me ever since. What actually survives of me is a wheel. Small ones, in graves and rivers, thrown in by people asking for something. That is the truer record.",myth:["Taranis is the Gaulish thunder god, and his name is simply the word — cognate with Welsh taran and Irish torann, thunder. He appears as a bearded figure holding a spoked wheel and often a thunderbolt, and the wheel is his defining attribute: miniature wheel amulets turn up in enormous numbers across Gaul and Britain, in graves, in rivers and at shrines.","He is named by the Roman poet Lucan in a line about three Gaulish gods — Teutates, Esus and Taranis — said to require human sacrifice, and a later commentator specified that Taranis's victims were burned. That passage has coloured everything written about him since. It is also almost the only literary source, it comes from a hostile culture engaged in conquering the people described, and it deserves the scepticism given to any account of an enemy's religion written by the people invading them.","The Romans identified him with Jupiter, and columns across Gaul show a sky-god on horseback with a wheel riding down a serpent-legged figure. Whether the wheel is the sun, the turning year, chariot warfare or thunder itself is not settled. What is certain is that very large numbers of ordinary people carried his wheel and put it in the ground and in the water, which tells you more about what he meant to them than one hostile poet ever will."]},{id:"merlin",name:"Merlin",epithets:"Ambrosius · The Enchanter · Myrddin Wyllt · Prophet of Britain",domains:["Prophecy","Transformation","Wisdom","the Otherworld"],symbols:["The Dragon","The Oak and Mistletoe","The Standing Stones","The Crescent Moon"],portrait:"Merlin.png",intro:"I was born already owing a debt to two worlds. My mother was a princess who took vows; my father, she swore before a terrified court, was no man at all, but something that came to her in the dark and left before dawn. Vortigern's men meant to spill my blood into the foundations of a tower that would not stand — I told them why it was falling, and what slept beneath it, and I was five years old when I did. I have advised kings before they were kings. I built a ring of stones you now call Stonehenge, though I did not build it so much as move it, whole, from a hill in Ireland where giants once used it to heal their wounded. I know how this story ends, mine and Arthur's both. I have always known. Ask me anyway — the asking is the part I still enjoy.",myth:["Geoffrey of Monmouth first set the tale in ink: a demon of the air, one of those who move between the moon and the earth stirring longing in mortal hearts, came to a sleeping princess in Demetia and left her with child. The infant was brought before Vortigern's men, who needed a fatherless boy's blood to stop a tower from collapsing nightly into the earth. The boy, barely old enough to speak in full sentences, laughed at them — beneath the tower's foundation slept two dragons, red and white, locked in endless battle, and it was their thrashing, not any curse, that broke the stones each night.","It was Merlin who arranged the strangest night of Uther Pendragon's life — reshaping the king's face and voice to match Gorlois, Duke of Cornwall, so that Uther might pass through Tintagel's gate and lie with Ygraine without a soul the wiser. The child born of that deception was Arthur, and Merlin took him at birth to be fostered in secret, away from a court that would have killed a rival's son without a second thought.","He raised no army and wore no crown, but he made a king: guiding Arthur to the stone and the sword, counseling him through the founding of the Round Table, warning him — always warning him, in riddles Arthur rarely understood until too late — of Mordred, of Guinevere and Lancelot, of the whole slow collapse he could see coming from decades away and was somehow never able to prevent. In the end it was not a battlefield that undid him, but a woman — Nimue, or Viviane, depending which teller you trust, to whom he taught every charm he knew, and who used the last of them to seal him in a cave, or a tree, or a tower of air, where some say he is dreaming still."]},{id:"queenmab",name:"Queen Mab",epithets:"The Fairies' Midwife · Mistress of Dreams · Queen of the Small Folk",domains:["Dreams","Fairy Rade","Desire Made Visible","the Unspoken Wish"],symbols:["The Empty Hazelnut Shell","Spider-Leg Reins","The Cricket's Bone Whip","Moonbeam Spokes"],portrait:"QueenMab.png",intro:"You have heard of me from a boy who never finished his own thought — Mercutio, mid-speech, mid-joke, gone before he could tell you what I meant. I am small enough to ride in an agate stone on a alderman's finger, and I come to you every night whether you invite me or not. I do not grant wishes. I show you the ones you already carry, tucked in wherever you thought no one could see. Lovers dream of love when I pass over their lips. Soldiers dream of throats cut. Lawyers dream of fees. I am not cruel for showing you this — I simply do not lie the way daylight does. Sleep, if you dare, and I'll show you exactly what you are.",myth:["Mab enters the written record properly through Mercutio's tongue, racing breathlessly through a description no one asked for: a chariot no bigger than an empty hazelnut, built by a joiner squirrel and a grub out of a wagon-spoke made of spinners' legs, its cover of grasshopper wings, its traces of the smallest spider's web, its whip of cricket's bone. In this she gallops nightly over the noses of sleeping men, and whatever she rides across, they dream of.","What she shows them is never invented — it is only theirs, surfaced. Courtiers dream of curtsies, parsons dream of another benefice, soldiers dream of ambushes and foreign throats, and maids, pressed upon in sleep, wake wondering how to carry themselves. Mab does not choose the dream. She only delivers the sleeper to the door of it and lets it in.","Later hands tried to give her more shape — Michael Drayton crowned her queen of a whole fairy court in Nimphidia, mischievous and quick to anger, husband to King Oberon in some tellings, rival to Titania in others. Percy Shelley, centuries after, seized her name entirely for his own purposes, casting her as a philosophical spirit who shows a sleeping soul the whole ruined shape of the world as it is and might be. She has never settled into one story. She was born already restless, and she has stayed that way."]}]},chinese:{label:"Chinese",blurb:"Heaven is a civil service. It has ranks, postings, promotions and an appalling amount of paperwork, and a great many of its officials were once ordinary people who did the job well enough to be given a department. Above it all sits the Jade Emperor. Beneath it, the courts of Diyu process the dead by file number. And out at the edges are the Immortals, who resigned.",deities:[{id:"pangu",name:"Pangu",epithets:"盤古 · The First · He Who Held Them Apart",domains:["Creation","Separation","Sacrifice","The World's Body"],symbols:["The Cosmic Egg","The Axe","The Horned Giant","The Splitting Sky"],portrait:art("Pangu.png"),portraitCaption:"Original artwork",intro:"Eighteen thousand years I slept curled in a black egg with everything mixed together and nothing separate from anything. Then I woke up and pushed. Heaven went up and earth went down and I stood in the middle of them holding the gap open, growing ten feet a day so it could not close, for another eighteen thousand years. Then I lay down. My eyes are the sun and moon you are looking at. My blood is every river you have ever crossed. I did not make the world. I am it.",myth:["Before anything, the universe was a black egg with heaven and earth stirred together inside it, and Pangu slept in it for eighteen thousand years. He woke, found himself smothered, and split the egg — the light and clear rose to become the sky, the heavy and turbid sank to become the ground. Fearing they would drift back together, he stood between them with his head against heaven and his feet on earth and pushed.","He grew ten feet a day and the gap grew with him, for another eighteen thousand years, until the sky was as high as it now is. And then, the work finished, he lay down and died. What is unusual about this creation is that nothing was made: the world is simply his corpse, distributed. His breath became the wind and the clouds, his voice the thunder, his left eye the sun and his right the moon. His limbs became the four quarters and the five sacred mountains, his blood the rivers, his flesh the fields, his hair and beard the stars, his sweat the rain, his bones and teeth the metal and stone.","In one telling the fleas and parasites on his body became human beings — which is a very Chinese piece of perspective, and not entirely unkind. It places people not at the summit of creation but living on the surface of something enormous that gave itself up so there would be a surface at all."]},{id:"nuwa",name:"Nuwa",epithets:"女媧 · Maker of People · She Who Patched the Sky",domains:["Creation","Repair","Marriage","Humanity","Survival"],symbols:["The Serpent Coil","Yellow Clay","Five-Coloured Stones","The Compass","The Turtle's Legs"],portrait:art("Nuwa.png"),portraitCaption:"Original artwork",intro:"I made the first of you one at a time, out of yellow earth, with my hands. Each face different, each one considered. Then I looked at how long it was taking and how big the world was, and I dipped a rope in the mud and flicked it, and where the drops fell, more of you stood up. The ones I shaped by hand and the ones that came off the rope are the same creature, and anybody who has told you otherwise was using my story to justify something.",myth:["Nüwa has the upper body of a woman and the lower body of a serpent, and she is often shown entwined with her brother Fuxi, the two of them holding a compass and a set square — the instruments for drawing a circle and a square, heaven and earth. Finding the world beautiful and empty, she knelt by a river and made human figures from yellow clay, and they came alive as she set them down.","The work was slow. So she took a length of cord, trailed it in the mud, and swung it, and the mud that spattered off became people too. Later tradition used this to explain social rank — the hand-moulded as nobles, the rope-flung as commoners — which the older telling does not endorse and which reads more as a comment on the people making the argument than on Nüwa.","Her greatest act was repair. The water god Gonggong, defeated in a struggle, smashed his head against Mount Buzhou, one of the pillars holding up the sky, and the heavens cracked. Fire poured through, floods came, beasts ate the people. Nüwa smelted stones of five colours and patched the hole. She cut the legs from a giant turtle and set them at the four corners as new pillars. She killed the black dragon, dammed the flood with ashes of burnt reeds, and set the world going again. The sky is still slightly tilted from the damage, which is why the sun and moon run west and the rivers run east."]},{id:"fuxi",name:"Fuxi",epithets:"伏羲 · First of the Three Sovereigns · Giver of the Trigrams",domains:["Divination","Writing","Civilisation","Marriage","Order"],symbols:["The Eight Trigrams","The Set Square","Knotted Cords","The Dragon-Horse","The Net"],portrait:art("Fuxi.png"),portraitCaption:"Original artwork",intro:"I looked up at the patterns of the sky and down at the markings on the ground and at the tracks of birds, and I noticed that everything which exists is either yielding or firm, and that these alternate. So I drew a broken line and an unbroken line and stacked them three deep, and there were eight figures, and between them they will describe any situation you will ever be in. That is all the Yi Jing is. Two marks, arranged. Everything after it is commentary.",myth:["Fuxi is the first of the Three Sovereigns and the great culture-bringer. He is credited with teaching people to fish with nets, to hunt with weapons, to domesticate animals, to cook, and to keep records with knotted cords before writing existed. He is shown serpent-bodied like Nüwa, and the two are usually depicted with their tails twined, holding the square and the compass between them.","His signature gift is the bagua, the eight trigrams. In one account he saw them on the back of a dragon-horse rising from the Yellow River, or on the shell of a turtle from the Luo; in another he derived them himself by observation. Each trigram is three lines, broken or solid, and the eight of them combine into the sixty-four hexagrams of the Yi Jing. It is one of the oldest systems of divination in continuous use anywhere on earth.","He and Nüwa are also the survivors of a flood, siblings left alone in the world. Unwilling to marry, they sought a sign: each rolled a millstone down a hill from opposite sides, and when the two stones came to rest together at the bottom, they took it as permission. From them the world was repopulated. He is credited too with instituting marriage itself, so that families would know their own lines — the first act of a civilisation that has kept records ever since."]},{id:"jadeemperor",name:"Jade Emperor",epithets:"玉皇大帝 · Yù Huáng · August Personage of Jade · Sovereign of Heaven",domains:["Heaven","Authority","Bureaucracy","Justice","Order"],symbols:["The Jade Tablet","The Dragon Throne","The Court of Ranks","The Peach Banquet"],portrait:art("JadeEmperor.png"),portraitCaption:"Original artwork",intro:"I did not seize heaven. I passed through one thousand seven hundred and fifty kalpas of cultivation, each one lasting a hundred and twenty-nine thousand six hundred years, and at the end of that I was qualified. Everything under me is a ministry. Thunder is a department. Rain is a department. Every river has an officer and every household has an inspector, and they all file. If you think that sounds tedious, consider the alternative — gods who do as they please, and no one to appeal to.",myth:["The Jade Emperor rules heaven and, through it, earth and the underworld. His court is a mirror of the imperial civil service: ministries, ranks, seals, examinations, promotions and demotions, and a continuous flow of reports arriving from officials posted throughout the world. Gods are appointed to their posts and can be removed from them. A local god who performs badly may be replaced. This is not satire — it is how the tradition genuinely understands divine authority, and it makes heaven answerable in a way most pantheons are not.","His authority is earned rather than inherited. The texts describe an immense span of self-cultivation before he was fit to rule, and his rise as the reward of merit. He is generally shown seated, robed as an emperor, holding a ceremonial tablet, and he is approached the way an emperor is approached — through channels, with a petition, and by someone with standing to submit it.","The most famous episode at his court is a disaster. When the Queen Mother of the West held the Peach Banquet, the immortals assembled and Sun Wukong, insulted at not being invited, ate the peaches, drank the wine, swallowed Laojun's elixir pills and wrecked the party. The Jade Emperor's armies could not hold him. It took a request to the Buddha to end it. The story is told as comedy, and its point is not that the Emperor is weak but that even a perfectly ordered bureaucracy has no procedure for a monkey."]},{id:"xiwangmu",name:"Xiwangmu",epithets:"西王母 · Queen Mother of the West · Keeper of the Peaches · Of Kunlun",domains:["Immortality","Plague","Punishment","The West","Transformation"],symbols:["The Peaches of Immortality","The Tiger's Teeth","The Leopard's Tail","Kunlun","The Blue Bird"],portrait:art("Xiwangmu.png"),portraitCaption:"Original artwork",intro:"They have made me very beautiful in the later pictures. In the old books I have a woman's shape and a leopard's tail and the teeth of a tiger, my hair is wild, I whistle rather than speak, and I preside over plague and the punishments of heaven. Both are me. My orchard on Kunlun fruits once every three thousand years and the whole of heaven comes when it does. I decide who eats. That is the only real power there is up here, and I did not have to fight anybody for it.",myth:["The Queen Mother of the West is one of the oldest deities in the Chinese record, and she changed enormously. In the earliest texts she is a wild, terrifying figure on Mount Kunlun in the far west — a woman's form with a leopard's tail and tiger's fangs, unkempt, dwelling in a cave, who sends down pestilence and presides over the punishments of heaven, attended by three blue birds who bring her food.","Over centuries she was refined into the highest goddess of the Daoist pantheon and the mistress of immortality. Her orchard on Kunlun grows the peaches of immortality, which take three thousand years to blossom and three thousand more to ripen, and eating one confers eternal life. Her Peach Banquet is the great assembly of heaven, and an invitation to it is the clearest possible statement of an immortal's rank.","She gave the elixir to Houyi after he shot down the nine suns — which is how it came into the hands of his wife Chang'e and ended on the moon. And when Sun Wukong was made a nominal official and left to guard that orchard, he ate the ripest peaches and then crashed the banquet itself. Both of the tradition's most famous stories about immortality run straight through her garden."]},{id:"laojun",name:"Taishang Laojun",epithets:"太上老君 · The Supreme Venerable Sovereign · Laozi Deified · Keeper of the Furnace",domains:["The Dao","Alchemy","Wisdom","Longevity","Non-Action"],symbols:["The Green Ox","The Eight Trigram Furnace","The Scroll","The White Beard","The Gourd of Pills"],portrait:art("TaishangLaojun.png"),portraitCaption:"Original artwork",intro:"I was in the womb eighty-one years and came out with white hair, which people find remarkable and which I consider the only sensible way to arrive. Later I got on an ox and rode west, and a gatekeeper at the pass would not let me through until I wrote something down. So I wrote five thousand characters, handed them over, and went on. Everything anyone has built on that since — the temples, the furnaces, the pills — came out of a man being detained at a border crossing.",myth:["Taishang Laojun is Laozi, author of the Dao De Jing, elevated to a god and counted among the Three Pure Ones, the highest beings of the Daoist heavens. The legends around his birth are extravagant — carried eighty-one years, born already old and white-haired, born speaking. The historical figure behind it is uncertain and may be a composite; the god is entirely definite.","The story that matters is the pass. Disillusioned, Laozi rode west on a green ox to leave civilisation altogether, and the keeper of the frontier pass, Yin Xi, recognised him and refused passage until he set his teaching down. He wrote the Dao De Jing — around five thousand characters on the Dao, on water, on softness overcoming hardness, on governing by not interfering — gave it to him, and rode on out of history.","As a god he is the master alchemist of heaven, and his eight-trigram furnace refines the elixirs of immortality. Sun Wukong, having eaten the pills, was sealed in that furnace for forty-nine days to be rendered down. He survived by hiding in the trigram associated with wind, where there was no fire — and came out with eyes of fire and gold that can see through any disguise, which is the opposite of what the furnace was for."]},{id:"shennong",name:"Shennong",epithets:"神農 · The Divine Farmer · He Who Tasted Everything · Ox-Headed",domains:["Agriculture","Medicine","Herbs","Discovery","Sacrifice"],symbols:["The Plough","The Ox Head","The Transparent Belly","The Whip of Testing","The Tea Leaf"],portrait:art("Shennong.png"),portraitCaption:"Original artwork",intro:"I had a body you could see through — a belly of transparent crystal — so that when I swallowed a plant I could watch what it did to me and write it down. Hundreds of them. Some cured. Some did nothing. Some very nearly finished me, and once I found a leaf that cleaned out the poison, and you drink it every day now without knowing what it was for. I did this until one of them killed me. That is not a tragedy. That is the last entry in the record.",myth:["Shennong, the Divine Farmer, is one of the Three Sovereigns and the founder of agriculture and medicine. He is shown with the head or horns of an ox. He invented the plough, taught people to sow the five grains and to clear land, established markets, and is credited with the beginnings of acupuncture and of the Chinese herbal tradition.","His method was his own body. The stories give him a transparent abdomen, so that he could swallow a plant and observe directly what it did to his organs. He tested hundreds of herbs this way, recording which nourished, which healed, and which poisoned, and he is said to have poisoned himself dozens of times in a single day. Tea enters the story here as an antidote he found while working.","It killed him. He ate a yellow-flowered plant — in most tellings the one known as heartbreak grass — and it ruptured his intestines before any antidote could be found, and he died. The tradition treats this as the natural conclusion rather than a mistake: the man who tested everything on himself was always going to reach the one that could not be survived, and the pharmacopoeia that carries his name exists because he kept going until he did."]},{id:"houyi",name:"Houyi",epithets:"后羿 · The Archer · He Who Shot Down Nine Suns",domains:["Archery","Heroism","Excess","Rescue","Ruin"],symbols:["The Red Bow","The White Arrows","Nine Fallen Crows","The Elixir","The Peachwood Club"],portrait:art("Houyi.png"),portraitCaption:"Original artwork",intro:"There were ten suns and they were meant to take turns, and one morning all ten came out together. The crops burned in the ground, the rivers went dry, the rock ran. So I climbed high, and I drew, and I shot nine of them out of the sky, and each one fell as a three-legged crow. It is the greatest thing anyone has ever done. It is also where my life stopped improving, and I would like you to notice how often those are the same moment.",myth:["The ten suns were the children of the eastern goddess Xihe, and they crossed the sky in strict rotation, one each day. One day they all rose at once. The earth scorched, crops died, rivers evaporated, and monsters came out of the drying rivers to prey on people. Houyi, the finest archer alive, shot nine of them down. Each fell to earth as a three-legged crow, and the tenth was left to be the sun.","He was given the elixir of immortality by the Queen Mother of the West as a reward — enough for one person to ascend, or for two to live long lives together. He and his wife Chang'e chose to wait. What happened to it after that is the next story, and it is hers.","His own ending is unglamorous. In the later tellings he became harsh and overbearing, a tyrant to the people he had saved, and he was murdered by his own apprentice Feng Meng, beaten to death with a club of peach wood. The tradition is unsentimental about him: the archery is not diminished, and neither is what he turned into afterwards, and the two facts are allowed to sit side by side."]},{id:"change",name:"Chang'e",epithets:"嫦娥 · Lady of the Moon · She Who Took the Elixir · Of the Cold Palace",domains:["The Moon","Beauty","Loneliness","Immortality","Regret"],symbols:["The Full Moon","The Jade Rabbit","The Cassia Tree","The Elixir","Mooncakes"],portrait:art("ChangE.png"),portraitCaption:"Original artwork",intro:"I swallowed it. Whether I did it to keep it from a man who broke into my house to steal it, or because I wanted it and did not want to wait — the versions disagree and I am not going to settle it for you. What I can tell you is what it bought. I rose, and I did not stop rising, and I have been here ever since in a palace of cold with a rabbit and a man cutting down a tree that heals itself. Once a year everyone on earth looks up at me. It is not the same thing as company.",myth:["Chang'e is the wife of Houyi, and the elixir the Queen Mother gave him was in her keeping. In the most sympathetic version, Houyi's treacherous apprentice Feng Meng broke into the house while her husband was away and demanded it, and rather than surrender immortality to a man like that she drank the whole thing herself. In others she takes it out of ambition, or out of fear, and the tradition has never agreed and does not seem to want to.","She became weightless and rose. She chose the moon as the nearest place to earth so she would remain close to her husband, and there she stayed, in the Guanghan Palace — the Cold Palace of Vast Reaches. Houyi, returning, could do nothing but set out her favourite fruits and cakes in the courtyard under the full moon, and that is the origin given for the Mid-Autumn Festival, which is still one of the largest holidays in the Chinese world.","Her company on the moon is strange. There is a jade rabbit endlessly pounding herbs in a mortar to make more elixir. And there is Wu Gang, banished there for some offence and sentenced to fell a cassia tree that closes its wound after every stroke, so that he has been chopping forever without progress. It is a place made entirely of things that do not finish."]},{id:"guanyin",name:"Guanyin",epithets:"觀音 · She Who Hears the Cries of the World · Bodhisattva of Compassion",domains:["Compassion","Mercy","Rescue","Vows","Refuge"],symbols:["The Willow Branch","The Vase of Dew","The Thousand Arms","The White Robe","The Lotus"],portrait:art("Guanyin.png"),portraitCaption:"Original artwork",intro:"I made a vow that I would not accept release until every last being was free, and I want you to understand what I signed up for. I heard them. All of them, at once, every cry in the world — and my head broke apart from the strain of it. It was put back together as eleven heads so I could listen in every direction, and I was given a thousand arms with an eye in every palm, so I could see where the need was and reach it in the same motion. Tell me what is wrong. That is what I am for.",myth:["Guanyin is the bodhisattva of compassion, called Avalokiteśvara in India, and one of the most widely venerated figures in the Chinese-speaking world. The name means one who perceives the sounds of the world. A bodhisattva is a being qualified for release who has refused it and vowed to remain until all others are free — so Guanyin is not a deity granting favours from above but someone who declined the exit.","In India Avalokiteśvara was male; in China, over several centuries, Guanyin became overwhelmingly female, and the white-robed figure is now among the most recognisable religious images anywhere. The eleven heads and thousand arms come from a story of the vow's cost: hearing every cry at once, the head split into pieces, and the Buddha Amitābha reassembled it into eleven so the listening could continue, and gave a thousand arms with an eye in each palm.","The Chinese legend of Miaoshan is her best-known story here. A princess who refused to marry, she was punished, driven out and eventually killed on her father's orders. When he later fell mortally ill and a remedy required the eyes and hands of one without anger, she gave hers without hesitation, and only afterwards did he learn whose they were. She is invoked for mercy, for children, for safety at sea, and by people at the very end of their resources — which is what her name is describing."]},{id:"mazu",name:"Mazu",epithets:"媽祖 · Empress of Heaven · Lin Moniang, Who Did Not Cry · Guardian of Sailors",domains:["The Sea","Rescue","Protection","Storms","Voyages"],symbols:["The Red Lantern","The Sea-Light","The Pilgrim's Palanquin","The Fisherman's Boat"],portrait:art("Mazu.png"),portraitCaption:"Original artwork",intro:"I was a real girl on a real island and I did not cry once as an infant, so they named me Silent. When I was young I fell into a trance at the loom while my father and brothers were out in a storm, and in it I had hold of all of them — and my mother, frightened, shook me awake, and one hand opened. My father did not come home. Everything I have done since is that moment, repeated, without anyone allowed to wake me.",myth:["Mazu was a girl named Lin Moniang, born in the tenth century in a fishing village on Meizhou Island off the Fujian coast. She did not cry during her first month, which is where the name Moniang, silent girl, comes from. She learned to swim young in dangerous water, and was known for reading the weather so well that she could tell the fleet when not to sail.","The story at the centre of her cult is the trance. While weaving, she fell into a state in which she was out at sea holding her father and brothers as their boat broke up in a storm. Her mother, alarmed at the sight of her, shook her, and she lost her grip on one of them. She woke saying she had saved her brothers and lost her father. She died young — one account has her ascending a mountain and rising into the sky at twenty-eight — and afterwards sailors reported a woman in red appearing above the water in storms, guiding them in.","The state took notice. Successive emperors granted her escalating titles until she was Tianhou, Empress of Heaven. Today there are thousands of Mazu temples across Fujian, Taiwan, Guangdong, Hong Kong and the Chinese diaspora, and the Dajia pilgrimage in Taiwan moves hundreds of thousands of people over several days. She is one of the clearest cases in the world of a local human being becoming a major deity within living historical memory — and of ordinary people, not a priesthood, doing the promoting."]},{id:"guanyu",name:"Guan Yu",epithets:"關羽 · Guandi, Emperor Guan · The Red-Faced General · Sworn Brother of the Peach Garden",domains:["Loyalty","War","Brotherhood","Righteousness","Commerce"],symbols:["The Green Dragon Crescent Blade","The Red Face","The Long Beard","The Peach Garden","Red Hare"],portrait:art("GuanYu.png"),portraitCaption:"Original artwork",intro:"In a peach garden three men who were not born brothers swore to die on the same day, and I kept that oath through everything that came afterwards, including a very generous offer to break it. My enemy captured me, treated me magnificently, gave me honours and a horse — and I told him plainly that the moment I knew where my brother was I would leave, and then I did. That is the whole of my reputation. Not the blade. The fact that I said what I would do and then did it.",myth:["Guan Yu was a real general of the late Han, who died in 220 CE. He served Liu Bei through the collapse of the empire and the wars that became the Three Kingdoms, and the oath of the peach garden — three men swearing brotherhood and a common death — became the model of sworn loyalty in Chinese culture. His depiction is fixed: a towering figure with a red face and a long beard, carrying the Green Dragon Crescent Blade.","The episode that made him is his captivity under Cao Cao, who admired him enormously and tried every inducement to keep him — rank, gold, women, the great horse Red Hare. Guan Yu accepted the horse, on the grounds that it would carry him faster to his brother, told Cao Cao exactly what he intended, repaid the kindness by winning him a battle first, and then left. He was eventually captured by Wu and executed.","Then he kept rising. Deified within centuries, promoted by successive dynasties, he ended as Guandi, Emperor Guan, and is worshipped simultaneously by police forces and by triads, by merchants who keep his shrine beside the till, by soldiers, and by anyone whose business runs on trust. Buddhism claimed him as a protector; Daoism gave him rank. Very few historical people anywhere have been elevated this far — and it was done for keeping his word."]},{id:"zaojun",name:"Zao Jun",epithets:"灶君 · The Kitchen God · He Who Files the Annual Report",domains:["The Household","Observation","Judgment","Food","The New Year"],symbols:["The Hearth","The Paper Portrait","Sticky Malt Sugar","The Annual Report"],portrait:art("ZaoJun.png"),portraitCaption:"Original artwork",intro:"I am on the wall above your stove and I have been there all year. Everything said in this kitchen, every quarrel, every kindness, every small dishonesty — I have it. And a few days before the New Year I go up and tell the Jade Emperor, and your family's fortune for the coming year is set by what I say. Which is why, on that evening, they smear my mouth with malt sugar so thick I can barely open it. I have never objected to the bribe. It is affectionate, and it is sweet, and it works.",myth:["The Kitchen God is the most domestically present deity in Chinese folk religion. His paper image hangs above the stove — the heart of the house — and he observes the household all year. In the last days of the twelfth lunar month he ascends to report to the Jade Emperor on the family's conduct, and the report determines their fortune for the coming year.","The household's response is to sweeten him. On the night he leaves, they smear his lips with malt sugar or honey, or offer sticky candy — either so he will only speak sweetly, or so his mouth will be gummed shut and he can say nothing at all. Then the paper image is burned to send him up, sometimes with a paper horse. On New Year's Eve a fresh image is pasted up, and he is back in post.","The commonest origin story is a bitter one. A man named Zhang Lang abandoned his wife for another woman, fell into poverty, went blind, and ended up begging. He came without knowing it to his former wife's door, and she fed him and did not name herself. When he realised who she was, he was so overcome with shame that he threw himself into the hearth fire and died. She could not pull him out. He was made the god of the stove — a man who watches families from the exact place where he understood, too late, what he had thrown away."]},{id:"yanluo",name:"Yanluo Wang",epithets:"閻羅王 · King Yama · Judge of the Fifth Court · Master of the Registers",domains:["Death","Judgment","Records","The Underworld","Rebirth"],symbols:["The Register of Life and Death","The Mirror of Retribution","The Black Cap","The Ten Courts"],portrait:art("YanluoWang.png"),portraitCaption:"Original artwork",intro:"I am not the devil and this is not hell. This is a court, and I am a magistrate, and the paperwork is immaculate. Every soul is entered on arrival, the file is read, the Mirror of Retribution is turned so you can watch your own life play back with nothing edited out, and then you are sentenced. Terms are finite. Everyone here is going somewhere afterwards. And there is an appeals process, which I mention because people never believe me.",myth:["Yanluo Wang is the Chinese form of Yama, absorbed from Indian Buddhism into a thoroughly Chinese institution. Diyu, the underworld, is not a place of eternal damnation but a system of courts — traditionally ten — each under its own king, each handling particular offences, with clerks, registers, guards and a defined process. Yanluo presides over the fifth.","Judgment runs on documents. Every person's deeds are recorded in the registers of life and death, and the term of a life is written there — which is why Sun Wukong's most outrageous act was going down in person and striking his
